name: Deploy Production App Manual

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: Select DEPLOY_APP to deploy the selected master commit
        required: true
        default: CANCEL
        type: choice
        options:
          - CANCEL
          - DEPLOY_APP
      transcription_admission:
        description: Preserve admission or activate the qualified faster-whisper Profile
        required: true
        default: PRESERVE_CURRENT
        type: choice
        options:
          - PRESERVE_CURRENT
          - ENABLE_FASTER_WHISPER

permissions:
  contents: read

concurrency:
  group: production-app-manual-v1
  cancel-in-progress: false

jobs:
  deploy-app:
    environment: production-asr
    runs-on: [self-hosted, linux, ubuntu, production, app]
    timeout-minutes: 45
    env:
      GPU_SERVICE_URL: ${{ vars.GPU_SERVICE_URL }}
      GPU_SERVICE_TOKEN: ${{ secrets.GPU_SERVICE_TOKEN }}
      REPO_PATH: ${{ vars.PRODUCTION_APP_REPO_PATH }}
      BACKUP_DIR: ${{ vars.PRODUCTION_APP_BACKUP_DIRECTORY }}
      DATA_PATH: ${{ vars.PRODUCTION_APP_DATA_PATH }}
      COMPOSE_OVERRIDE: ${{ vars.PRODUCTION_APP_COMPOSE_OVERRIDE }}
      COMPOSE_ENV_FILE: ${{ vars.PRODUCTION_APP_ENV_FILE }}
      DEPLOY_HTTP_PROXY: ${{ vars.DEPLOY_HTTP_PROXY }}
      GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SELECTED_REF: ${{ github.ref }}
      CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
      TRANSCRIPTION_ADMISSION_ACTION: ${{ inputs.transcription_admission }}
      DEPLOY_COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Back up, deploy, and strictly verify the selected App commit
        run: |
          set -euo pipefail

          [ "${CONFIRM_PRODUCTION}" = "DEPLOY_APP" ] || {
            echo "ERROR: App-only production deployment was not confirmed"
            exit 1
          }
          case "${TRANSCRIPTION_ADMISSION_ACTION}" in
            PRESERVE_CURRENT|ENABLE_FASTER_WHISPER) ;;
            *)
              echo "ERROR: unsupported transcription admission action"
              exit 1
              ;;
          esac
          [ "${SELECTED_REF}" = "refs/heads/master" ] || {
            echo "ERROR: manual App deployment only accepts master"
            exit 1
          }
          [[ "${DEPLOY_COMMIT_SHA}" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "ERROR: selected master commit is not a full Git SHA"
            exit 1
          }
          command -v flock >/dev/null 2>&1 || {
            echo "ERROR: flock is required for host-level deployment exclusion"
            exit 1
          }

          cd "${REPO_PATH}"
          BASIC_AUTH="$(printf 'x-access-token:%s' "${GIT_TOKEN}" | base64 | tr -d '\n')"
          PROXY_ARGS=()
          if [ -n "${DEPLOY_HTTP_PROXY:-}" ]; then
            PROXY_ARGS=(-c "http.proxy=${DEPLOY_HTTP_PROXY}")
          fi
          fetch_exact_commits() {
            for ATTEMPT in 1 2 3 4; do
              if git -c http.version=HTTP/1.1 "${PROXY_ARGS[@]}" \
                -c "http.extraHeader=AUTHORIZATION: basic ${BASIC_AUTH}" fetch \
                https://github.com/abworks-dev/RAGPinCheng.git "$@"; then
                return 0
              fi
              [ "${ATTEMPT}" -lt 4 ] || return 1
              sleep "$((2 ** ATTEMPT))"
            done
          }
          fetch_exact_commits "${DEPLOY_COMMIT_SHA}" || {
            echo "ERROR: selected master commit could not be fetched"
            exit 1
          }

          REPOSITORY_HEAD="$(git rev-parse HEAD)"
          REPOSITORY_BRANCH="$(git branch --show-current)"
          TRACKED_CHANGES="$(git status --porcelain --untracked-files=no)"
          [ "${REPOSITORY_BRANCH}" = "master" ] || {
            echo "ERROR: production application repository must be on master"
            exit 1
          }
          [ -z "${TRACKED_CHANGES}" ] || {
            echo "ERROR: production application repository has tracked local changes"
            exit 1
          }
          git merge-base --is-ancestor \
            "${REPOSITORY_HEAD}" "${DEPLOY_COMMIT_SHA}" || {
            echo "ERROR: selected master commit is not a fast-forward from production"
            exit 1
          }
          echo "APP_ONLY_GIT status=fast-forward-ready current=${REPOSITORY_HEAD} target=${DEPLOY_COMMIT_SHA}"

          LOCK_METADATA="$(git show "${DEPLOY_COMMIT_SHA}:gpu_service/runtime-lock.json")"
          VALIDATION_STATUS="$(printf '%s' "${LOCK_METADATA}" | python3 -c \
            'import json,sys; print(json.load(sys.stdin).get("validation_status", ""))')"
          QUALIFICATION_RUN_ID="$(printf '%s' "${LOCK_METADATA}" | python3 -c \
            'import json,sys; print(json.load(sys.stdin).get("qualification_run_id", ""))')"
          QUALIFIED_GPU_SOURCE_COMMIT="$(printf '%s' "${LOCK_METADATA}" | python3 -c \
            'import json,sys; print(json.load(sys.stdin).get("source_commit", ""))')"
          EXPECTED_GPU_SOURCE_FINGERPRINT="$(printf '%s' "${LOCK_METADATA}" | python3 -c \
            'import json,sys; print(json.load(sys.stdin).get("qualified_source_fingerprint", ""))')"
          EXPECTED_GPU_LOCK_SHA256="$(printf '%s' "${LOCK_METADATA}" | python3 -c \
            'import json,sys; print(json.load(sys.stdin).get("qualified_lock_sha256", ""))')"
          REQUIREMENTS_FILE="$(printf '%s' "${LOCK_METADATA}" | python3 -c \
            'import json,sys; print(json.load(sys.stdin).get("requirements_file", ""))')"
          [ "${VALIDATION_STATUS}" = "validated" ] || {
            echo "ERROR: selected commit does not contain validated GPU lock metadata"
            exit 1
          }
          [ -n "${QUALIFICATION_RUN_ID}" ] || {
            echo "ERROR: selected commit lacks a GPU qualification run"
            exit 1
          }
          [[ "${QUALIFIED_GPU_SOURCE_COMMIT}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "ERROR: selected commit has an invalid qualified GPU source"
            exit 1
          }
          [[ "${EXPECTED_GPU_SOURCE_FINGERPRINT}" =~ ^[0-9a-f]{64}$ ]] || {
            echo "ERROR: selected commit has an invalid qualified GPU fingerprint"
            exit 1
          }
          [[ "${EXPECTED_GPU_LOCK_SHA256}" =~ ^[0-9a-f]{64}$ ]] || {
            echo "ERROR: selected commit has an invalid qualified GPU lock hash"
            exit 1
          }
          [[ "${REQUIREMENTS_FILE}" =~ ^[A-Za-z0-9._-]+$ ]] || {
            echo "ERROR: selected commit has an invalid GPU requirements file"
            exit 1
          }
          fetch_exact_commits "${QUALIFIED_GPU_SOURCE_COMMIT}" || {
            echo "ERROR: qualified GPU source commit could not be fetched"
            exit 1
          }

          GPU_RUNTIME_FILES=(
            gpu_service/__init__.py
            gpu_service/app.py
            gpu_service/config.py
            gpu_service/models.py
            gpu_service/schemas.py
            scripts/start-gpu-service.ps1
            scripts/diagnose_gpu_reranker.py
            scripts/get-gpu-runtime-lock-hash.ps1
          )
          GPU_OBJECT_IDS=()
          for FILE in "${GPU_RUNTIME_FILES[@]}"; do
            OBJECT_ID="$(git rev-parse "${QUALIFIED_GPU_SOURCE_COMMIT}:${FILE}")"
            [[ "${OBJECT_ID}" =~ ^[0-9a-f]{40}$ ]] || {
              echo "ERROR: qualified GPU source inventory is incomplete"
              exit 1
            }
            GPU_OBJECT_IDS+=("${OBJECT_ID}")
          done
          FINGERPRINT_PAYLOAD="$(printf '%s\n' "${GPU_OBJECT_IDS[@]}")"
          COMPUTED_GPU_FINGERPRINT="$(printf '%s' "${FINGERPRINT_PAYLOAD}" | sha256sum | awk '{print $1}')"
          [ "${COMPUTED_GPU_FINGERPRINT}" = "${EXPECTED_GPU_SOURCE_FINGERPRINT}" ] || {
            echo "ERROR: qualified GPU source fingerprint does not match lock metadata"
            exit 1
          }
          COMPUTED_LOCK_SHA256="$(
            git show "${DEPLOY_COMMIT_SHA}:gpu_service/${REQUIREMENTS_FILE}" | python3 -c '
          import hashlib, sys
          content = sys.stdin.buffer.read().replace(b"\r\n", b"\n").replace(b"\r", b"\n")
          print(hashlib.sha256(content).hexdigest())
          '
          )"
          [ "${COMPUTED_LOCK_SHA256}" = "${EXPECTED_GPU_LOCK_SHA256}" ] || {
            echo "ERROR: selected commit GPU dependency lock does not match validated metadata"
            exit 1
          }
          EXPECTED_GPU_RELEASE_ID="${EXPECTED_GPU_SOURCE_FINGERPRINT:0:12}-${EXPECTED_GPU_LOCK_SHA256:0:12}"
          export EXPECTED_GPU_RELEASE_ID EXPECTED_GPU_SOURCE_FINGERPRINT EXPECTED_GPU_LOCK_SHA256

          CONTRACT_FILES=(
            src/providers.py
            gpu_service/__init__.py
            gpu_service/app.py
            gpu_service/models.py
            gpu_service/schemas.py
          )
          for FILE in "${CONTRACT_FILES[@]}"; do
            TARGET_BLOB="$(git rev-parse "${DEPLOY_COMMIT_SHA}:${FILE}")"
            QUALIFIED_BLOB="$(git rev-parse "${QUALIFIED_GPU_SOURCE_COMMIT}:${FILE}")"
            [ "${TARGET_BLOB}" = "${QUALIFIED_BLOB}" ] || {
              echo "ERROR: App/GPU contract differs from the qualified runtime: ${FILE}"
              exit 1
            }
          done
          echo "APP_ONLY_CONTRACT status=identical files=${#CONTRACT_FILES[@]}"

          mkdir -p "${BACKUP_DIR}"
          exec 9>"${BACKUP_DIR}/.production-app-deploy.lock"
          flock -n 9 || {
            echo "ERROR: another host-level application deployment is active"
            exit 1
          }

          COMPOSE=(docker compose -p ragpincheng-prod \
            -f "${REPO_PATH}/docker/docker-compose.yml" \
            -f "${COMPOSE_OVERRIDE}" --env-file "${COMPOSE_ENV_FILE}")

          verify_gpu_identity() {
            curl -fsS --connect-timeout 10 --max-time 30 \
              "${GPU_SERVICE_URL}/health" | python3 -c \
              'import json,sys; d=json.load(sys.stdin); assert d.get("status") == "ok" and d.get("model_loaded") is True'
            curl -fsS --connect-timeout 10 --max-time 30 \
              "${GPU_SERVICE_URL}/model-info" | python3 -c '
          import json, os, sys
          d = json.load(sys.stdin)
          assert str(d.get("api_version")) == "1"
          assert d.get("embedding_dimension") == 1024
          assert d.get("device") == "cuda"
          assert d.get("runtime_release_id") == os.environ["EXPECTED_GPU_RELEASE_ID"]
          assert d.get("runtime_source_fingerprint") == os.environ["EXPECTED_GPU_SOURCE_FINGERPRINT"]
          assert d.get("runtime_lock_sha256") == os.environ["EXPECTED_GPU_LOCK_SHA256"]
          '
          }

          verify_gpu_inference() {
            curl -fsS --connect-timeout 10 --max-time 120 \
              -H "Authorization: Bearer ${GPU_SERVICE_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"texts":["app-only deployment probe"]}' \
              "${GPU_SERVICE_URL}/v1/embeddings" | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          assert len(d.get("embeddings", [])) == 1
          item = d["embeddings"][0]
          assert len(item.get("dense", [])) == 1024
          assert len(item.get("sparse_indices", [])) == len(item.get("sparse_values", []))
          '
            curl -fsS --connect-timeout 10 --max-time 120 \
              -H "Authorization: Bearer ${GPU_SERVICE_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"query":"deployment probe","passages":["deployment probe","unrelated text"]}' \
              "${GPU_SERVICE_URL}/v1/rerank" | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          scores = d.get("scores", [])
          assert len(scores) == 2 and all(isinstance(x, (int, float)) for x in scores)
          '
          }

          verify_sqlite_integrity() {
            SRC="${DATA_PATH}" python3 - <<'PY'
          import os
          import sqlite3
          from pathlib import Path

          for name in ("app.sqlite", "parents.sqlite"):
              path = Path(os.environ["SRC"]) / name
              with sqlite3.connect(f"file:{path}?mode=ro", uri=True) as database:
                  result = database.execute("PRAGMA integrity_check").fetchone()[0]
              if result != "ok":
                  raise SystemExit(f"{name} integrity check failed: {result}")
          PY
          }

          verify_transcription_admission() {
            [ "${TRANSCRIPTION_ADMISSION_ACTION}" = "ENABLE_FASTER_WHISPER" ] || return 0
            "${COMPOSE[@]}" exec -T backend python - <<'PY'
          from api.transcription_runtime import (
              RemoteAsrProviderFactory,
              build_phase4_profile_catalog,
              build_phase4_profile_registry,
          )
          from src.config import (
              ASR_CONNECT_TIMEOUT_SECONDS,
              ASR_ENABLED,
              ASR_EXPECTED_API_VERSION,
              ASR_POLL_INTERVAL_MS,
              ASR_REQUEST_TIMEOUT_SECONDS,
              ASR_SERVICE_TOKEN,
              ASR_SERVICE_URL,
              ASR_UPLOAD_PART_BYTES,
              TRANSCRIPTION_ADMITTED_PROFILE_IDS,
          )
          from src.transcription.profile import ProfileOperation
          from src.transcription.profile_catalog import (
              FASTER_WHISPER_PROFILE_ID,
              FASTER_WHISPER_PROVIDER_KEY,
              FUNASR_SENSEVOICE_PROFILE_ID,
              QWEN3_ASR_PROFILE_ID,
              WHISPERX_PROFILE_ID,
          )

          expected = {
              FASTER_WHISPER_PROFILE_ID,
              FUNASR_SENSEVOICE_PROFILE_ID,
          }
          assert ASR_ENABLED is True
          assert set(TRANSCRIPTION_ADMITTED_PROFILE_IDS) == expected
          capabilities = RemoteAsrProviderFactory(
              ASR_SERVICE_URL,
              ASR_SERVICE_TOKEN,
              ASR_CONNECT_TIMEOUT_SECONDS,
              ASR_REQUEST_TIMEOUT_SECONDS,
              FASTER_WHISPER_PROVIDER_KEY,
          ).capabilities()
          entries = build_phase4_profile_catalog(
              service_enabled=ASR_ENABLED,
              service_healthy=True,
              service_capabilities=capabilities,
              admitted_profile_ids=TRANSCRIPTION_ADMITTED_PROFILE_IDS,
          )
          states = {
              entry.profile.profile_id: (
                  entry.profile.admission.value,
                  entry.availability.value,
              )
              for entry in entries
          }
          assert states[FASTER_WHISPER_PROFILE_ID] == ("enabled", "available")
          assert states[FUNASR_SENSEVOICE_PROFILE_ID] == ("enabled", "available")
          assert states[QWEN3_ASR_PROFILE_ID][0] == "disabled"
          assert states[WHISPERX_PROFILE_ID][0] == "disabled"
          registry = build_phase4_profile_registry(
              upload_part_bytes=ASR_UPLOAD_PART_BYTES,
              poll_interval_ms=ASR_POLL_INTERVAL_MS,
              expected_api_version=ASR_EXPECTED_API_VERSION,
              admitted_profile_ids=TRANSCRIPTION_ADMITTED_PROFILE_IDS,
          )
          resolved = registry.resolve_profile(
              FASTER_WHISPER_PROFILE_ID,
              ProfileOperation.new_attempt,
          )
          assert resolved.profile.profile_id == FASTER_WHISPER_PROFILE_ID
          print("TRANSCRIPTION_ADMISSION status=verified profile=faster-whisper")
          PY
          }

          verify_gpu_identity
          verify_gpu_inference
          echo "APP_ONLY_GPU status=validated release=${EXPECTED_GPU_RELEASE_ID}"

          BACKUP_PATH="${BACKUP_DIR}/app-only-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "${BACKUP_PATH}"
          export TRANSCRIPTION_ADMISSION_STATE_FILE="${BACKUP_PATH}/transcription-admission-state.json"
          printf 'node=app\nprevious_commit=%s\ntarget_commit=%s\n' \
            "${REPOSITORY_HEAD}" "${DEPLOY_COMMIT_SHA}" \
            > "${BACKUP_PATH}/git-state.txt"
          SRC="${DATA_PATH}" DST="${BACKUP_PATH}" python3 - <<'PY'
          import os
          import sqlite3
          from pathlib import Path

          source_dir = Path(os.environ["SRC"])
          backup_dir = Path(os.environ["DST"])
          for name in ("app.sqlite", "parents.sqlite"):
              source_path = source_dir / name
              if not source_path.is_file():
                  raise SystemExit(f"Missing production database: {source_path}")
              backup_path = backup_dir / name
              with sqlite3.connect(f"file:{source_path}?mode=ro", uri=True) as source:
                  with sqlite3.connect(backup_path) as target:
                      source.backup(target)
                      result = target.execute("PRAGMA integrity_check").fetchone()[0]
                      if result != "ok":
                          raise SystemExit(f"{name} backup integrity failed: {result}")
              print(f"APP_ONLY_BACKUP status=ok database={name}")
          PY
          "${COMPOSE[@]}" exec -T backend curl -fsS -X POST \
            --connect-timeout 10 --max-time 30 \
            http://qdrant:6333/collections/pincheng_docs/snapshots \
            > "${BACKUP_PATH}/qdrant-snapshot.json"
          SNAPSHOT_PATH="${BACKUP_PATH}/qdrant-snapshot.json" python3 -c '
          import json, os
          from pathlib import Path
          d = json.loads(Path(os.environ["SNAPSHOT_PATH"]).read_text(encoding="utf-8"))
          assert d.get("status") == "ok"
          assert d.get("result", {}).get("name")
          '
          "${COMPOSE[@]}" exec -T backend curl -fsS \
            --connect-timeout 10 --max-time 30 \
            http://qdrant:6333/collections/pincheng_docs \
            > "${BACKUP_PATH}/qdrant-before.json"
          OLD_IMAGE_ID="$(docker image inspect pincheng-rag-backend:latest --format '{{.Id}}')"
          [ -n "${OLD_IMAGE_ID}" ] || {
            echo "ERROR: current backend image identity is missing"
            exit 1
          }
          printf '%s\n' "${OLD_IMAGE_ID}" > "${BACKUP_PATH}/backend-image.txt"
          echo "APP_ONLY_BACKUP status=complete path=${BACKUP_PATH}"

          rollback_backend() {
            echo "APP_ONLY_ROLLBACK status=starting"
            if [ -f "${TRANSCRIPTION_ADMISSION_STATE_FILE}" ]; then
              python3 "${REPO_PATH}/scripts/configure-transcription-admission.py" restore \
                --env-file "${COMPOSE_ENV_FILE}" \
                --state-file "${TRANSCRIPTION_ADMISSION_STATE_FILE}"
              echo "TRANSCRIPTION_ADMISSION rollback=restored"
            fi
            docker tag "${OLD_IMAGE_ID}" pincheng-rag-backend:latest
            "${COMPOSE[@]}" up -d --no-deps backend
            for ATTEMPT in $(seq 1 36); do
              CONTAINER_ID="$("${COMPOSE[@]}" ps -q backend)"
              HEALTH_STATUS="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "${CONTAINER_ID}" 2>/dev/null || true)"
              if [ "${HEALTH_STATUS}" = "healthy" ] && \
                curl -fsS --connect-timeout 5 --max-time 10 \
                  http://localhost/api/health >/dev/null 2>&1; then
                echo "APP_ONLY_ROLLBACK status=complete image=${OLD_IMAGE_ID}"
                return 0
              fi
              sleep 5
            done
            echo "APP_ONLY_ROLLBACK status=failed image=${OLD_IMAGE_ID}"
            return 1
          }

          if ! (
            set -euo pipefail
            git merge --ff-only "${DEPLOY_COMMIT_SHA}"
            if [ "${TRANSCRIPTION_ADMISSION_ACTION}" = "ENABLE_FASTER_WHISPER" ]; then
              python3 "${REPO_PATH}/scripts/configure-transcription-admission.py" set \
                --env-file "${COMPOSE_ENV_FILE}" \
                --state-file "${TRANSCRIPTION_ADMISSION_STATE_FILE}" \
                --value "funasr-sensevoice-zh-experimental-v1,faster-whisper-zh-experimental-v1"
              echo "TRANSCRIPTION_ADMISSION action=enable-faster-whisper status=configured"
            fi
            bash "${REPO_PATH}/scripts/deploy-app.sh"

            CONTAINER_ID="$("${COMPOSE[@]}" ps -q backend)"
            [ -n "${CONTAINER_ID}" ]
            EXPECTED_IMAGE_ID="$(docker image inspect pincheng-rag-backend:latest --format '{{.Id}}')"
            RUNNING_IMAGE_ID="$(docker inspect --format '{{.Image}}' "${CONTAINER_ID}")"
            [ "${RUNNING_IMAGE_ID}" = "${EXPECTED_IMAGE_ID}" ]

            HEALTH_STATUS=""
            for ATTEMPT in $(seq 1 36); do
              HEALTH_STATUS="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "${CONTAINER_ID}" 2>/dev/null || true)"
              [ "${HEALTH_STATUS}" = "healthy" ] && break
              sleep 5
            done
            [ "${HEALTH_STATUS}" = "healthy" ]
            curl -fsS --connect-timeout 5 --max-time 10 \
              http://localhost/api/health | python3 -c \
              'import json,sys; assert json.load(sys.stdin).get("status") == "ok"'
            "${COMPOSE[@]}" exec -T backend curl -fsS \
              --connect-timeout 10 --max-time 30 \
              http://qdrant:6333/collections/pincheng_docs | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          assert d.get("status") == "ok"
          assert d.get("result", {}).get("status") == "green"
          '
            verify_sqlite_integrity
            verify_gpu_identity
            verify_gpu_inference
            verify_transcription_admission
            [ "$(git rev-parse HEAD)" = "${DEPLOY_COMMIT_SHA}" ]
            echo "APP_ONLY_DEPLOY status=success target=${DEPLOY_COMMIT_SHA} image=${EXPECTED_IMAGE_ID}"
          ); then
            if ! rollback_backend; then
              echo "CRITICAL: previous backend image did not recover"
            fi
            echo "ERROR: App-only deployment failed strict verification"
            exit 1
          fi
