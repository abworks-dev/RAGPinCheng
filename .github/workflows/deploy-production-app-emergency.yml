name: Deploy Production App Manual

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: Select DEPLOY_APP to deploy the selected master commit
        required: true
        default: CANCEL
        type: choice
        options:
          - CANCEL
          - DEPLOY_APP
      transcription_admission:
        description: Preserve admission or activate qualified remote ASR Profiles
        required: true
        default: PRESERVE_CURRENT
        type: choice
        options:
          - PRESERVE_CURRENT
          - ENABLE_FASTER_WHISPER
          - ENABLE_FASTER_WHISPER_AND_WHISPERX
      content_root_policy:
        description: Require an empty first-use content root or preserve an initialized root
        required: true
        default: REQUIRE_EMPTY
        type: choice
        options:
          - REQUIRE_EMPTY
          - PRESERVE_EXISTING

permissions:
  contents: read

concurrency:
  group: production-app-manual-v1
  cancel-in-progress: false

jobs:
  deploy-app:
    environment: production-asr
    runs-on: [self-hosted, linux, ubuntu, production, app]
    timeout-minutes: 45
    env:
      GPU_SERVICE_URL: ${{ vars.GPU_SERVICE_URL }}
      GPU_SERVICE_TOKEN: ${{ secrets.GPU_SERVICE_TOKEN }}
      REPO_PATH: ${{ vars.PRODUCTION_APP_REPO_PATH }}
      BACKUP_DIR: ${{ vars.PRODUCTION_APP_BACKUP_DIRECTORY }}
      DATA_PATH: ${{ vars.PRODUCTION_APP_DATA_PATH }}
      COMPOSE_OVERRIDE: ${{ vars.PRODUCTION_APP_COMPOSE_OVERRIDE }}
      COMPOSE_ENV_FILE: ${{ vars.PRODUCTION_APP_ENV_FILE }}
      CONTENT_HOST_PATH: ${{ vars.PRODUCTION_CONTENT_ROOT }}
      DOCS_HOST_PATH: ${{ vars.PRODUCTION_DOCS_HOST_PATH }}
      MEDIA_HOST_PATH: ${{ vars.PRODUCTION_MEDIA_HOST_PATH }}
      TRANSCRIPTION_ARTIFACT_DIR: ${{ vars.PRODUCTION_TRANSCRIPTION_ARTIFACT_DIR }}
      SOURCE_DECOUPLING_COMPLETE: ${{ vars.SOURCE_DECOUPLING_COMPLETE }}
      CONTENT_MANAGEMENT_ENABLED: ${{ vars.CONTENT_MANAGEMENT_ENABLED }}
      CONTENT_HEAD_ENFORCEMENT: ${{ vars.CONTENT_HEAD_ENFORCEMENT }}
      DEPLOY_HTTP_PROXY: ${{ vars.DEPLOY_HTTP_PROXY }}
      GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SELECTED_REF: ${{ github.ref }}
      CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
      TRANSCRIPTION_ADMISSION_ACTION: ${{ inputs.transcription_admission }}
      CONTENT_ROOT_POLICY: ${{ inputs.content_root_policy }}
      CONFIGURED_TRANSCRIPTION_ADMITTED_PROFILE_IDS: ${{ vars.TRANSCRIPTION_ADMITTED_PROFILE_IDS }}
      DEPLOY_COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Back up, deploy, and strictly verify the selected App commit
        run: |
          set -euo pipefail

          [ "${CONFIRM_PRODUCTION}" = "DEPLOY_APP" ] || {
            echo "ERROR: App-only production deployment was not confirmed"
            exit 1
          }
          [ "${CONTENT_HOST_PATH}" = "/data/business/ragpincheng/content" ] || {
            echo "ERROR: production content root is not the approved fixed path"
            exit 1
          }
          case "${DOCS_HOST_PATH:-}" in
            ""|/data/business/ragpincheng/source/docs|/data/business/ragpincheng/content/legacy-docs) ;;
            *) echo "ERROR: production docs host path is outside the approved roots"; exit 1 ;;
          esac
          case "${MEDIA_HOST_PATH:-}" in
            ""|/data/business/ragpincheng/source/media|/data/business/ragpincheng/content/media) ;;
            *) echo "ERROR: production media host path is outside the approved roots"; exit 1 ;;
          esac
          case "${TRANSCRIPTION_ARTIFACT_DIR:-}" in
            ""|/app/data/transcription-artifacts|/app/content/transcription-artifacts) ;;
            *) echo "ERROR: production transcript artifact path is outside the approved roots"; exit 1 ;;
          esac
          [ "${CONTENT_MANAGEMENT_ENABLED}" = "true" ] || {
            echo "ERROR: managed content must be explicitly enabled for this deployment"
            exit 1
          }
          case "${CONTENT_HEAD_ENFORCEMENT}" in
            compat|strict) ;;
            *) echo "ERROR: invalid managed content head enforcement"; exit 1 ;;
          esac
          if [ "${CONTENT_HEAD_ENFORCEMENT}" = "strict" ] || \
             [ "${MEDIA_HOST_PATH:-}" = "/data/business/ragpincheng/content/media" ] || \
             [ "${TRANSCRIPTION_ARTIFACT_DIR:-}" = "/app/content/transcription-artifacts" ]; then
            [ "${SOURCE_DECOUPLING_COMPLETE:-}" = "true" ] || {
              echo "ERROR: source decoupling configuration requires the completed T12 marker"
              exit 1
            }
          fi
          [ -n "${CONFIGURED_TRANSCRIPTION_ADMITTED_PROFILE_IDS}" ] || {
            echo "ERROR: TRANSCRIPTION_ADMITTED_PROFILE_IDS repository variable must be configured"
            exit 1
          }
          PREVIOUS_TRANSCRIPTION_ADMITTED_PROFILE_IDS="${CONFIGURED_TRANSCRIPTION_ADMITTED_PROFILE_IDS}"
          case "${TRANSCRIPTION_ADMISSION_ACTION}" in
            PRESERVE_CURRENT)
              export TRANSCRIPTION_ADMITTED_PROFILE_IDS="${PREVIOUS_TRANSCRIPTION_ADMITTED_PROFILE_IDS}"
              ;;
            ENABLE_FASTER_WHISPER)
              export TRANSCRIPTION_ADMITTED_PROFILE_IDS="funasr-sensevoice-zh-experimental-v1,faster-whisper-zh-experimental-v1"
              ;;
            ENABLE_FASTER_WHISPER_AND_WHISPERX)
              export TRANSCRIPTION_ADMITTED_PROFILE_IDS="funasr-sensevoice-zh-experimental-v1,faster-whisper-zh-experimental-v1,whisperx-large-v3-zh-align-experimental-v1"
              ;;
            *)
              echo "ERROR: unsupported transcription admission action"
              exit 1
              ;;
          esac
          [ "${SELECTED_REF}" = "refs/heads/master" ] || {
            echo "ERROR: manual App deployment only accepts master"
            exit 1
          }
          [[ "${DEPLOY_COMMIT_SHA}" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "ERROR: selected master commit is not a full Git SHA"
            exit 1
          }
          command -v flock >/dev/null 2>&1 || {
            echo "ERROR: flock is required for host-level deployment exclusion"
            exit 1
          }

          cd "${REPO_PATH}"
          if [ "${TRANSCRIPTION_ADMISSION_ACTION}" = "PRESERVE_CURRENT" ]; then
            PYTHONPATH="${REPO_PATH}" python3 - <<'PY'
          import os
          from src.transcription_admission_config import parse_transcription_admitted_profile_ids

          parse_transcription_admitted_profile_ids(
              os.environ["TRANSCRIPTION_ADMITTED_PROFILE_IDS"]
          )
          PY
          fi
          BASIC_AUTH="$(printf 'x-access-token:%s' "${GIT_TOKEN}" | base64 | tr -d '\n')"
          PROXY_ARGS=()
          if [ -n "${DEPLOY_HTTP_PROXY:-}" ]; then
            PROXY_ARGS=(-c "http.proxy=${DEPLOY_HTTP_PROXY}")
          fi
          fetch_exact_commits() {
            for ATTEMPT in 1 2 3 4; do
              if git -c http.version=HTTP/1.1 "${PROXY_ARGS[@]}" \
                -c "http.extraHeader=AUTHORIZATION: basic ${BASIC_AUTH}" fetch \
                https://github.com/abworks-dev/RAGPinCheng.git "$@"; then
                return 0
              fi
              [ "${ATTEMPT}" -lt 4 ] || return 1
              sleep "$((2 ** ATTEMPT))"
            done
          }
          fetch_exact_commits "${DEPLOY_COMMIT_SHA}" || {
            echo "ERROR: selected master commit could not be fetched"
            exit 1
          }

          REPOSITORY_HEAD="$(git rev-parse HEAD)"
          REPOSITORY_BRANCH="$(git branch --show-current)"
          TRACKED_CHANGES="$(git status --porcelain --untracked-files=no)"
          [ "${REPOSITORY_BRANCH}" = "master" ] || {
            echo "ERROR: production application repository must be on master"
            exit 1
          }
          [ -z "${TRACKED_CHANGES}" ] || {
            echo "ERROR: production application repository has tracked local changes"
            exit 1
          }
          git merge-base --is-ancestor \
            "${REPOSITORY_HEAD}" "${DEPLOY_COMMIT_SHA}" || {
            echo "ERROR: selected master commit is not a fast-forward from production"
            exit 1
          }
          echo "APP_ONLY_GIT status=fast-forward-ready current=${REPOSITORY_HEAD} target=${DEPLOY_COMMIT_SHA}"

          LOCK_METADATA="$(git show "${DEPLOY_COMMIT_SHA}:services/gpu_service/runtime-lock.json")"
          VALIDATION_STATUS="$(printf '%s' "${LOCK_METADATA}" | python3 -c \
            'import json,sys; print(json.load(sys.stdin).get("validation_status", ""))')"
          QUALIFICATION_RUN_ID="$(printf '%s' "${LOCK_METADATA}" | python3 -c \
            'import json,sys; print(json.load(sys.stdin).get("qualification_run_id", ""))')"
          QUALIFIED_GPU_SOURCE_COMMIT="$(printf '%s' "${LOCK_METADATA}" | python3 -c \
            'import json,sys; print(json.load(sys.stdin).get("source_commit", ""))')"
          EXPECTED_GPU_SOURCE_FINGERPRINT="$(printf '%s' "${LOCK_METADATA}" | python3 -c \
            'import json,sys; print(json.load(sys.stdin).get("qualified_source_fingerprint", ""))')"
          EXPECTED_GPU_LOCK_SHA256="$(printf '%s' "${LOCK_METADATA}" | python3 -c \
            'import json,sys; print(json.load(sys.stdin).get("qualified_lock_sha256", ""))')"
          REQUIREMENTS_FILE="$(printf '%s' "${LOCK_METADATA}" | python3 -c \
            'import json,sys; print(json.load(sys.stdin).get("requirements_file", ""))')"
          [ "${VALIDATION_STATUS}" = "validated" ] || {
            echo "ERROR: selected commit does not contain validated GPU lock metadata"
            exit 1
          }
          [ -n "${QUALIFICATION_RUN_ID}" ] || {
            echo "ERROR: selected commit lacks a GPU qualification run"
            exit 1
          }
          [[ "${QUALIFIED_GPU_SOURCE_COMMIT}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "ERROR: selected commit has an invalid qualified GPU source"
            exit 1
          }
          [[ "${EXPECTED_GPU_SOURCE_FINGERPRINT}" =~ ^[0-9a-f]{64}$ ]] || {
            echo "ERROR: selected commit has an invalid qualified GPU fingerprint"
            exit 1
          }
          [[ "${EXPECTED_GPU_LOCK_SHA256}" =~ ^[0-9a-f]{64}$ ]] || {
            echo "ERROR: selected commit has an invalid qualified GPU lock hash"
            exit 1
          }
          [[ "${REQUIREMENTS_FILE}" =~ ^[A-Za-z0-9._-]+$ ]] || {
            echo "ERROR: selected commit has an invalid GPU requirements file"
            exit 1
          }
          fetch_exact_commits "${QUALIFIED_GPU_SOURCE_COMMIT}" || {
            echo "ERROR: qualified GPU source commit could not be fetched"
            exit 1
          }

          GPU_RUNTIME_FILES=(
            services/gpu_service/__init__.py
            services/gpu_service/app.py
            services/gpu_service/config.py
            services/gpu_service/models.py
            services/gpu_service/schemas.py
            scripts/start-gpu-service.ps1
            scripts/diagnose_gpu_reranker.py
            scripts/get-gpu-runtime-lock-hash.ps1
          )
          GPU_OBJECT_IDS=()
          for FILE in "${GPU_RUNTIME_FILES[@]}"; do
            OBJECT_ID="$(git rev-parse "${QUALIFIED_GPU_SOURCE_COMMIT}:${FILE}")"
            [[ "${OBJECT_ID}" =~ ^[0-9a-f]{40}$ ]] || {
              echo "ERROR: qualified GPU source inventory is incomplete"
              exit 1
            }
            GPU_OBJECT_IDS+=("${OBJECT_ID}")
          done
          FINGERPRINT_PAYLOAD="$(printf '%s\n' "${GPU_OBJECT_IDS[@]}")"
          COMPUTED_GPU_FINGERPRINT="$(printf '%s' "${FINGERPRINT_PAYLOAD}" | sha256sum | awk '{print $1}')"
          [ "${COMPUTED_GPU_FINGERPRINT}" = "${EXPECTED_GPU_SOURCE_FINGERPRINT}" ] || {
            echo "ERROR: qualified GPU source fingerprint does not match lock metadata"
            exit 1
          }
          COMPUTED_LOCK_SHA256="$(
            git show "${DEPLOY_COMMIT_SHA}:services/gpu_service/${REQUIREMENTS_FILE}" | python3 -c '
          import hashlib, sys
          content = sys.stdin.buffer.read().replace(b"\r\n", b"\n").replace(b"\r", b"\n")
          print(hashlib.sha256(content).hexdigest())
          '
          )"
          [ "${COMPUTED_LOCK_SHA256}" = "${EXPECTED_GPU_LOCK_SHA256}" ] || {
            echo "ERROR: selected commit GPU dependency lock does not match validated metadata"
            exit 1
          }
          EXPECTED_GPU_RELEASE_ID="${EXPECTED_GPU_SOURCE_FINGERPRINT:0:12}-${EXPECTED_GPU_LOCK_SHA256:0:12}"
          export EXPECTED_GPU_RELEASE_ID EXPECTED_GPU_SOURCE_FINGERPRINT EXPECTED_GPU_LOCK_SHA256

          CONTRACT_FILES=(
            src/providers.py
            services/__init__.py
            services/gpu_service/__init__.py
            services/gpu_service/app.py
            services/gpu_service/models.py
            services/gpu_service/schemas.py
          )
          for FILE in "${CONTRACT_FILES[@]}"; do
            TARGET_BLOB="$(git rev-parse "${DEPLOY_COMMIT_SHA}:${FILE}")"
            QUALIFIED_BLOB="$(git rev-parse "${QUALIFIED_GPU_SOURCE_COMMIT}:${FILE}")"
            [ "${TARGET_BLOB}" = "${QUALIFIED_BLOB}" ] || {
              echo "ERROR: App/GPU contract differs from the qualified runtime: ${FILE}"
              exit 1
            }
          done
          echo "APP_ONLY_CONTRACT status=identical files=${#CONTRACT_FILES[@]}"

          mkdir -p "${BACKUP_DIR}"
          exec 9>"${BACKUP_DIR}/.production-app-deploy.lock"
          flock -n 9 || {
            echo "ERROR: another host-level application deployment is active"
            exit 1
          }

          APP_DATABASE="${DATA_PATH}/app.sqlite"
          [ -f "${APP_DATABASE}" ] || {
            echo "ERROR: production application database is unavailable for active-job preflight"
            exit 1
          }
          APP_DATABASE="${APP_DATABASE}" python3 - <<'PY'
          import os
          import sqlite3

          active = {
              "content_index_jobs": ("pending", "parsing", "chunking", "summarizing", "embedding"),
              "index_jobs": ("pending", "running", "uploading", "queued_mineru", "parsing", "chunking", "embedding"),
              "transcript_publication_index_jobs": ("pending", "parsing", "chunking", "embedding"),
              "transcription_jobs": ("pending", "running", "processing"),
          }
          connection = sqlite3.connect(f"file:{os.environ['APP_DATABASE']}?mode=ro", uri=True)
          try:
              existing = {
                  row[0] for row in connection.execute(
                      "SELECT name FROM sqlite_master WHERE type='table'"
                  )
              }
              counts = {}
              for table, statuses in active.items():
                  if table not in existing:
                      counts[table] = 0
                      continue
                  placeholders = ",".join("?" for _ in statuses)
                  counts[table] = int(connection.execute(
                      f"SELECT count(*) FROM {table} WHERE status IN ({placeholders})",
                      statuses,
                  ).fetchone()[0])
          finally:
              connection.close()
          print("APP_ONLY_ACTIVE_JOB_PREFLIGHT " + " ".join(f"{name}={counts[name]}" for name in active))
          if any(counts.values()):
              raise SystemExit("ERROR: active application jobs must finish before deployment")
          PY

          if [ -L "${CONTENT_HOST_PATH}" ] || \
             { [ -e "${CONTENT_HOST_PATH}" ] && [ ! -d "${CONTENT_HOST_PATH}" ]; }; then
            echo "ERROR: production content root must be a real directory"
            exit 1
          fi
          CONTENT_ROOT_INITIAL_STATE="absent"
          if [ -d "${CONTENT_HOST_PATH}" ]; then
            CONTENT_ROOT_INITIAL_STATE="empty"
            if [ -n "$(find "${CONTENT_HOST_PATH}" -mindepth 1 -maxdepth 1 -print -quit)" ]; then
              CONTENT_ROOT_INITIAL_STATE="existing"
            fi
          fi
          case "${CONTENT_ROOT_POLICY}" in
            REQUIRE_EMPTY)
              [ "${CONTENT_ROOT_INITIAL_STATE}" != "existing" ] || {
                echo "ERROR: production content root is unexpectedly non-empty"
                exit 1
              }
              ;;
            PRESERVE_EXISTING) ;;
            *)
              echo "ERROR: unsupported production content root policy"
              exit 1
              ;;
          esac
          docker run --rm \
            --volume "${CONTENT_HOST_PATH}:/app/content" \
            pincheng-rag-backend:latest \
            sh -eu -c 'PROBE=/app/content/.deployment-write-probe; : > "${PROBE}"; rm -f "${PROBE}"'
          [ -d "${CONTENT_HOST_PATH}" ] && [ ! -L "${CONTENT_HOST_PATH}" ] || {
            echo "ERROR: Docker did not create a valid production content root"
            exit 1
          }

          if [ "${SOURCE_DECOUPLING_COMPLETE:-false}" = "true" ]; then
            SANITIZER="${BACKUP_DIR}/.sanitize-source-decoupled-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.py"
            SANITIZED_OVERRIDE="${BACKUP_DIR}/.compose-private-source-decoupled-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
            git show "${DEPLOY_COMMIT_SHA}:scripts/sanitize_source_decoupled_override.py" > "${SANITIZER}.tmp"
            mv "${SANITIZER}.tmp" "${SANITIZER}"
            docker compose -f "${REPO_PATH}/docker/docker-compose.yml" -f "${COMPOSE_OVERRIDE}" \
              --env-file "${COMPOSE_ENV_FILE}" \
              config --no-interpolate --no-env-resolution --no-consistency --format json \
              | python3 "${SANITIZER}" > "${SANITIZED_OVERRIDE}.tmp"
            mv "${SANITIZED_OVERRIDE}.tmp" "${SANITIZED_OVERRIDE}"
            COMPOSE_OVERRIDE="${SANITIZED_OVERRIDE}"
            export COMPOSE_OVERRIDE
          fi

          COMPOSE_FILES=(
            -f "${REPO_PATH}/docker/docker-compose.yml"
            -f "${COMPOSE_OVERRIDE}"
          )
          case "${SOURCE_DECOUPLING_COMPLETE:-false}" in
            true)
              SOURCE_DECOUPLED_COMPOSE="${BACKUP_DIR}/.compose-source-decoupled-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.yml"
              git show "${DEPLOY_COMMIT_SHA}:docker/compose.source-decoupled.yml" \
                > "${SOURCE_DECOUPLED_COMPOSE}.tmp"
              mv "${SOURCE_DECOUPLED_COMPOSE}.tmp" "${SOURCE_DECOUPLED_COMPOSE}"
              COMPOSE_FILES+=(-f "${SOURCE_DECOUPLED_COMPOSE}")
              ;;
            false|"") ;;
            *)
              echo "ERROR: SOURCE_DECOUPLING_COMPLETE must be true or false"
              exit 1
              ;;
          esac
          COMPOSE=(docker compose -p ragpincheng-prod \
            "${COMPOSE_FILES[@]}" --env-file "${COMPOSE_ENV_FILE}")

          remove_legacy_recovery_backend() {
            local candidate project service host_port container_port
            while IFS= read -r candidate; do
              [ -n "${candidate}" ] || continue
              project="$(docker inspect --format '{{index .Config.Labels "com.docker.compose.project"}}' "${candidate}")"
              service="$(docker inspect --format '{{index .Config.Labels "com.docker.compose.service"}}' "${candidate}")"
              host_port="$(docker inspect --format '{{(index (index .HostConfig.PortBindings "8000/tcp") 0).HostPort}}' "${candidate}" 2>/dev/null || true)"
              container_port="$(docker inspect --format '{{json (index .Config.ExposedPorts "8000/tcp")}}' "${candidate}" 2>/dev/null || true)"
              if [ "${project}" != "docker" ] || [ "${service}" != "backend" ] || \
                [ "${host_port}" != "80" ] || [ "${container_port}" != "{}" ]; then
                echo "ERROR: refusing to remove unverified port-80 container ${candidate}"
                return 1
              fi
              docker rm -f "${candidate}"
              echo "APP_ONLY_RECOVERY_HARNESS status=removed-legacy-container id=${candidate}"
            done < <(docker ps -aq \
              --filter 'label=com.docker.compose.project=docker' \
              --filter 'label=com.docker.compose.service=backend')
          }
          remove_legacy_recovery_backend

          PREVIOUS_ASR_ENABLED=""
          if PREVIOUS_ASR_ENABLED="$("${COMPOSE[@]}" exec -T backend python -c \
            'from src.config import ASR_ENABLED; print("true" if ASR_ENABLED else "false")' 2>/dev/null)"; then
            echo "APP_ONLY_ASR_STATE source=running-backend"
          else
            PREVIOUS_CONTAINER_ID="$("${COMPOSE[@]}" ps -aq backend)"
            [ -n "${PREVIOUS_CONTAINER_ID}" ] || {
              echo "ERROR: production backend container identity is missing"
              exit 1
            }
            PREVIOUS_ASR_ENABLED="$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' \
              "${PREVIOUS_CONTAINER_ID}" | python3 -c '
          import sys
          values = [line.split("=", 1)[1] for line in sys.stdin if line.startswith("ASR_ENABLED=")]
          assert len(values) == 1
          print(values[0].lower())
          ')"
            echo "APP_ONLY_ASR_STATE source=container-config"
          fi
          case "${PREVIOUS_ASR_ENABLED}" in
            true|false) ;;
            *)
              echo "ERROR: current backend ASR enable state is invalid"
              exit 1
              ;;
          esac
          if [ "${TRANSCRIPTION_ADMISSION_ACTION}" = "PRESERVE_CURRENT" ]; then
            if [ "${PREVIOUS_ASR_ENABLED}" = "false" ]; then
              echo "APP_ONLY_ASR_STATE configured-admission-requires-enabled"
              export ASR_ENABLED=true
            else
              export ASR_ENABLED="${PREVIOUS_ASR_ENABLED}"
            fi
          else
            export ASR_ENABLED=true
          fi

          verify_gpu_identity() {
            curl -fsS --connect-timeout 10 --max-time 30 \
              "${GPU_SERVICE_URL}/health" | python3 -c \
              'import json,sys; d=json.load(sys.stdin); assert d.get("status") == "ok" and d.get("model_loaded") is True'
            curl -fsS --connect-timeout 10 --max-time 30 \
              "${GPU_SERVICE_URL}/model-info" | python3 -c '
          import json, os, sys
          d = json.load(sys.stdin)
          assert str(d.get("api_version")) == "1"
          assert d.get("embedding_dimension") == 1024
          assert d.get("device") == "cuda"
          assert d.get("runtime_release_id") == os.environ["EXPECTED_GPU_RELEASE_ID"]
          assert d.get("runtime_source_fingerprint") == os.environ["EXPECTED_GPU_SOURCE_FINGERPRINT"]
          assert d.get("runtime_lock_sha256") == os.environ["EXPECTED_GPU_LOCK_SHA256"]
          '
          }

          verify_gpu_inference() {
            curl -fsS --connect-timeout 10 --max-time 120 \
              -H "Authorization: Bearer ${GPU_SERVICE_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"texts":["app-only deployment probe"]}' \
              "${GPU_SERVICE_URL}/v1/embeddings" | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          assert len(d.get("embeddings", [])) == 1
          item = d["embeddings"][0]
          assert len(item.get("dense", [])) == 1024
          assert len(item.get("sparse_indices", [])) == len(item.get("sparse_values", []))
          '
            curl -fsS --connect-timeout 10 --max-time 120 \
              -H "Authorization: Bearer ${GPU_SERVICE_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"query":"deployment probe","passages":["deployment probe","unrelated text"]}' \
              "${GPU_SERVICE_URL}/v1/rerank" | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          scores = d.get("scores", [])
          assert len(scores) == 2 and all(isinstance(x, (int, float)) for x in scores)
          '
          }

          verify_sqlite_integrity() {
            SRC="${DATA_PATH}" python3 - <<'PY'
          import os
          import sqlite3
          from pathlib import Path

          for name in ("app.sqlite", "parents.sqlite"):
              path = Path(os.environ["SRC"]) / name
              with sqlite3.connect(f"file:{path}?mode=ro", uri=True) as database:
                  result = database.execute("PRAGMA integrity_check").fetchone()[0]
              if result != "ok":
                  raise SystemExit(f"{name} integrity check failed: {result}")
          PY
          }

          verify_managed_content() {
            "${COMPOSE[@]}" exec -T backend python - <<'PY'
          from pathlib import Path

          from api.db import connect
          from api.db_migrations import CURRENT_SCHEMA_VERSION
          from src.config import (
              CONTENT_HEAD_ENFORCEMENT,
              CONTENT_MANAGEMENT_ENABLED,
              CONTENT_ROOT,
          )

          expected_categories = [
              ("01", "行业规范与标准"),
              ("02", "客户标准与要求"),
              ("03", "公司内部标准"),
              ("04", "项目资料"),
              ("05", "培训资料"),
              ("06", "项目经验与案例"),
              ("99", "待确认资料"),
          ]
          assert CONTENT_MANAGEMENT_ENABLED is True
          assert CONTENT_HEAD_ENFORCEMENT in {"compat", "strict"}
          assert CONTENT_ROOT == Path("/app/content")
          probe = CONTENT_ROOT / ".managed-content-deploy-probe"
          probe.write_text("ok", encoding="ascii")
          probe.unlink()
          with connect() as database:
              version = database.execute(
                  "SELECT max(version) FROM app_schema_migrations"
              ).fetchone()[0]
              categories = database.execute(
                  "SELECT display_code,display_name FROM category_nodes "
                  "WHERE parent_id IS NULL AND is_active=1 ORDER BY sort_order,id"
              ).fetchall()
              active_jobs = database.execute(
                  "SELECT count(*) FROM content_index_jobs "
                  "WHERE status IN ('pending','parsing','chunking','summarizing','embedding')"
              ).fetchone()[0]
              permission_groups = database.execute(
                  "SELECT g.group_key,g.display_name,i.permission "
                  "FROM content_permission_groups g "
                  "LEFT JOIN content_permission_group_items i ON i.group_id=g.id "
                  "WHERE g.is_system=1 AND g.is_active=1 "
                  "ORDER BY g.group_key,i.permission"
              ).fetchall()
          assert version == CURRENT_SCHEMA_VERSION
          assert [tuple(row) for row in categories] == expected_categories
          assert active_jobs == 0
          actual_groups = {}
          for group_key, display_name, permission in permission_groups:
              actual_groups.setdefault((group_key, display_name), [])
              if permission is not None:
                  actual_groups[(group_key, display_name)].append(permission)
          assert actual_groups == {
              ("member", "普通成员"): [],
              ("bim_engineer", "BIM工程师"): ["organize"],
              ("content_owner", "资料负责人"): ["review"],
              ("system_admin", "系统管理员"): [
                  "import_server", "manage_categories", "organize", "publish", "review"
              ],
          }

          print(
              f"MANAGED_CONTENT status=verified schema={CURRENT_SCHEMA_VERSION} "
              f"categories=7 permission_groups=4 mode={CONTENT_HEAD_ENFORCEMENT}"
          )
          PY
          }

          verify_source_decoupling_mounts() {
            [ "${SOURCE_DECOUPLING_COMPLETE:-}" = "true" ] || return 0
            [ "${CONTENT_HEAD_ENFORCEMENT}" = "strict" ]
            [ "${MEDIA_HOST_PATH}" = "/data/business/ragpincheng/content/media" ]
            [ "${TRANSCRIPTION_ARTIFACT_DIR}" = "/app/content/transcription-artifacts" ]
            CONTAINER_ID="$("${COMPOSE[@]}" ps -q backend)"
            docker inspect "${CONTAINER_ID}" | \
              EXPECTED_MEDIA="${MEDIA_HOST_PATH}" python3 -c '
          import json, os, sys
          from pathlib import Path
          container = json.load(sys.stdin)[0]
          mounts = {item["Destination"]: item for item in container.get("Mounts", [])}
          docs = mounts.get("/app/docs")
          assert docs is not None, "missing /app/docs mount"
          assert docs.get("Type") == "tmpfs", "unexpected docs mount type: %r" % docs.get("Type")
          media = mounts.get("/app/media", {})
          content = mounts.get("/app/content", {})
          assert media.get("Type") == "bind", "unexpected media mount type: %r" % media.get("Type")
          assert Path(media.get("Source", "")).resolve() == Path(os.environ["EXPECTED_MEDIA"]).resolve(), "unexpected media mount source: %r" % media.get("Source")
          assert content.get("Type") == "bind", "unexpected content mount type: %r" % content.get("Type")
          assert Path(content.get("Source", "")).resolve() == Path("/data/business/ragpincheng/content").resolve(), "unexpected content mount source: %r" % content.get("Source")
          assert all(not item.get("Source", "").startswith("/data/business/ragpincheng/source") for item in mounts.values())
          '
            if "${COMPOSE[@]}" exec -T backend sh -c ': > /app/docs/.write-probe' 2>/dev/null; then
              echo "ERROR: retired legacy docs runtime path is writable"
              return 1
            fi
            "${COMPOSE[@]}" exec -T backend python - <<'PY'
          from pathlib import Path
          from src.config import DOCS_DIR, MEDIA_DIR, TRANSCRIPTION_ARTIFACT_DIR

          assert DOCS_DIR == Path("/app/docs")
          assert MEDIA_DIR == Path("/app/media")
          assert TRANSCRIPTION_ARTIFACT_DIR == Path("/app/content/transcription-artifacts")
          mount = next(
              line for line in Path("/proc/self/mountinfo").read_text().splitlines()
              if line.split(" - ", 1)[0].split()[4] == "/app/docs"
          )
          left, right = mount.split(" - ", 1)
          assert right.split()[0] == "tmpfs"
          assert "ro" in left.split()[5].split(",")
          PY
          }

          verify_transcription_admission() {
            case "${TRANSCRIPTION_ADMISSION_ACTION}" in
              ENABLE_FASTER_WHISPER|ENABLE_FASTER_WHISPER_AND_WHISPERX) ;;
              *) return 0 ;;
            esac
            "${COMPOSE[@]}" exec -T backend python - <<'PY'
          from api.transcription_runtime import (
              RemoteAsrProviderFactory,
              build_phase4_profile_catalog,
              build_phase4_profile_registry,
          )
          from src.config import (
              ASR_CONNECT_TIMEOUT_SECONDS,
              ASR_ENABLED,
              ASR_EXPECTED_API_VERSION,
              ASR_POLL_INTERVAL_MS,
              ASR_REQUEST_TIMEOUT_SECONDS,
              ASR_SERVICE_TOKEN,
              ASR_SERVICE_URL,
              ASR_UPLOAD_PART_BYTES,
              TRANSCRIPTION_ADMITTED_PROFILE_IDS,
          )
          from src.transcription.profile import ProfileOperation
          from src.transcription.profile_catalog import (
              FASTER_WHISPER_PROFILE_ID,
              FASTER_WHISPER_PROVIDER_KEY,
              FUNASR_SENSEVOICE_PROFILE_ID,
              QWEN3_ASR_PROFILE_ID,
              WHISPERX_PROFILE_ID,
          )

          expected = {
              FASTER_WHISPER_PROFILE_ID,
              FUNASR_SENSEVOICE_PROFILE_ID,
          }
          if WHISPERX_PROFILE_ID in TRANSCRIPTION_ADMITTED_PROFILE_IDS:
              expected.add(WHISPERX_PROFILE_ID)
          assert ASR_ENABLED is True
          assert set(TRANSCRIPTION_ADMITTED_PROFILE_IDS) == expected
          capabilities = RemoteAsrProviderFactory(
              ASR_SERVICE_URL,
              ASR_SERVICE_TOKEN,
              ASR_CONNECT_TIMEOUT_SECONDS,
              ASR_REQUEST_TIMEOUT_SECONDS,
              FASTER_WHISPER_PROVIDER_KEY,
          ).capabilities()
          entries = build_phase4_profile_catalog(
              service_enabled=ASR_ENABLED,
              service_healthy=True,
              service_capabilities=capabilities,
              admitted_profile_ids=TRANSCRIPTION_ADMITTED_PROFILE_IDS,
          )
          states = {
              entry.profile.profile_id: (
                  entry.profile.admission.value,
                  entry.availability.value,
              )
              for entry in entries
          }
          assert states[FASTER_WHISPER_PROFILE_ID] == ("enabled", "available")
          assert states[FUNASR_SENSEVOICE_PROFILE_ID] == ("enabled", "available")
          assert states[QWEN3_ASR_PROFILE_ID][0] == "disabled"
          if WHISPERX_PROFILE_ID in expected:
              assert states[WHISPERX_PROFILE_ID] == ("enabled", "available")
          else:
              assert states[WHISPERX_PROFILE_ID][0] == "disabled"
          registry = build_phase4_profile_registry(
              upload_part_bytes=ASR_UPLOAD_PART_BYTES,
              poll_interval_ms=ASR_POLL_INTERVAL_MS,
              expected_api_version=ASR_EXPECTED_API_VERSION,
              admitted_profile_ids=TRANSCRIPTION_ADMITTED_PROFILE_IDS,
          )
          resolved = registry.resolve_profile(
              FASTER_WHISPER_PROFILE_ID,
              ProfileOperation.new_attempt,
          )
          assert resolved.profile.profile_id == FASTER_WHISPER_PROFILE_ID
          if WHISPERX_PROFILE_ID in expected:
              resolved = registry.resolve_profile(
                  WHISPERX_PROFILE_ID,
                  ProfileOperation.new_attempt,
              )
              assert resolved.profile.profile_id == WHISPERX_PROFILE_ID
          print("TRANSCRIPTION_ADMISSION status=verified profiles=" + ",".join(sorted(expected)))
          PY
          }

          verify_gpu_identity
          verify_gpu_inference
          echo "APP_ONLY_GPU status=validated release=${EXPECTED_GPU_RELEASE_ID}"

          BACKUP_PATH="${BACKUP_DIR}/app-only-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "${BACKUP_PATH}"
          printf 'path=%s\ninitial_state=%s\npolicy=%s\nmanagement_enabled=%s\nhead_enforcement=%s\n' \
            "${CONTENT_HOST_PATH}" "${CONTENT_ROOT_INITIAL_STATE}" "${CONTENT_ROOT_POLICY}" \
            "${CONTENT_MANAGEMENT_ENABLED}" "${CONTENT_HEAD_ENFORCEMENT}" \
            > "${BACKUP_PATH}/content-root-state.txt"
          printf 'node=app\nprevious_commit=%s\ntarget_commit=%s\n' \
            "${REPOSITORY_HEAD}" "${DEPLOY_COMMIT_SHA}" \
            > "${BACKUP_PATH}/git-state.txt"
          SRC="${DATA_PATH}" DST="${BACKUP_PATH}" python3 - <<'PY'
          import os
          import sqlite3
          from pathlib import Path

          source_dir = Path(os.environ["SRC"])
          backup_dir = Path(os.environ["DST"])
          for name in ("app.sqlite", "parents.sqlite"):
              source_path = source_dir / name
              if not source_path.is_file():
                  raise SystemExit(f"Missing production database: {source_path}")
              backup_path = backup_dir / name
              with sqlite3.connect(f"file:{source_path}?mode=ro", uri=True) as source:
                  with sqlite3.connect(backup_path) as target:
                      source.backup(target)
                      result = target.execute("PRAGMA integrity_check").fetchone()[0]
                      if result != "ok":
                          raise SystemExit(f"{name} backup integrity failed: {result}")
              print(f"APP_ONLY_BACKUP status=ok database={name}")
          PY
          "${COMPOSE[@]}" exec -T backend curl -fsS -X POST \
            --connect-timeout 10 --max-time 30 \
            http://qdrant:6333/collections/pincheng_docs/snapshots \
            > "${BACKUP_PATH}/qdrant-snapshot.json"
          SNAPSHOT_PATH="${BACKUP_PATH}/qdrant-snapshot.json" python3 -c '
          import json, os
          from pathlib import Path
          d = json.loads(Path(os.environ["SNAPSHOT_PATH"]).read_text(encoding="utf-8"))
          assert d.get("status") == "ok"
          assert d.get("result", {}).get("name")
          '
          "${COMPOSE[@]}" exec -T backend curl -fsS \
            --connect-timeout 10 --max-time 30 \
            http://qdrant:6333/collections/pincheng_docs \
            > "${BACKUP_PATH}/qdrant-before.json"
          OLD_IMAGE_ID="$(docker image inspect pincheng-rag-backend:latest --format '{{.Id}}')"
          [ -n "${OLD_IMAGE_ID}" ] || {
            echo "ERROR: current backend image identity is missing"
            exit 1
          }
          ROLLBACK_IMAGE_TAG="pincheng-rag-backend:app-only-rollback-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker tag "${OLD_IMAGE_ID}" "${ROLLBACK_IMAGE_TAG}"
          ROLLBACK_IMAGE_ID="$(docker image inspect "${ROLLBACK_IMAGE_TAG}" --format '{{.Id}}')"
          [ "${ROLLBACK_IMAGE_ID}" = "${OLD_IMAGE_ID}" ] || {
            echo "ERROR: rollback backend image could not be retained"
            exit 1
          }
          printf '%s\n' "${OLD_IMAGE_ID}" > "${BACKUP_PATH}/backend-image.txt"
          echo "APP_ONLY_BACKUP status=complete path=${BACKUP_PATH} rollback_image=retained"

          rollback_backend() {
            echo "APP_ONLY_ROLLBACK status=starting"
            export ASR_ENABLED="${PREVIOUS_ASR_ENABLED}"
            export TRANSCRIPTION_ADMITTED_PROFILE_IDS="${PREVIOUS_TRANSCRIPTION_ADMITTED_PROFILE_IDS}"
            if ! "${COMPOSE[@]}" stop backend; then
              echo "APP_ONLY_ROLLBACK status=failed stage=stop-backend"
              return 1
            fi
            if ! SRC="${BACKUP_PATH}" DST="${DATA_PATH}" python3 - <<'PY'
          import os
          import shutil
          import sqlite3
          from pathlib import Path

          source_dir = Path(os.environ["SRC"])
          target_dir = Path(os.environ["DST"])
          staged = []
          try:
              for name in ("app.sqlite", "parents.sqlite"):
                  source = source_dir / name
                  target = target_dir / name
                  temporary = target.with_name(f".{name}.rollback-{os.getpid()}.tmp")
                  if not source.is_file():
                      raise RuntimeError(f"missing rollback database: {source}")
                  with sqlite3.connect(f"file:{source}?mode=ro", uri=True) as database:
                      result = database.execute("PRAGMA integrity_check").fetchone()[0]
                  if result != "ok":
                      raise RuntimeError(f"{name} backup integrity failed: {result}")
                  shutil.copy2(source, temporary)
                  with sqlite3.connect(f"file:{temporary}?mode=ro", uri=True) as database:
                      result = database.execute("PRAGMA integrity_check").fetchone()[0]
                  if result != "ok":
                      raise RuntimeError(f"{name} staged integrity failed: {result}")
                  staged.append((temporary, target))
              for temporary, target in staged:
                  os.replace(temporary, target)
              print("APP_ONLY_ROLLBACK_DATABASES status=restored databases=app.sqlite,parents.sqlite")
          finally:
              for temporary, _target in staged:
                  temporary.unlink(missing_ok=True)
          PY
            then
              echo "APP_ONLY_ROLLBACK status=failed stage=restore-databases"
              return 1
            fi
            if ! docker tag "${ROLLBACK_IMAGE_TAG}" pincheng-rag-backend:latest; then
              echo "APP_ONLY_ROLLBACK status=failed stage=restore-image-tag"
              return 1
            fi
            if ! "${COMPOSE[@]}" up -d --no-deps --force-recreate backend; then
              echo "APP_ONLY_ROLLBACK status=failed stage=recreate-backend"
              return 1
            fi
            for ATTEMPT in $(seq 1 36); do
              if ! CONTAINER_ID="$("${COMPOSE[@]}" ps -q backend)" || [ -z "${CONTAINER_ID}" ]; then
                sleep 5
                continue
              fi
              RUNNING_IMAGE_ID="$(docker inspect --format '{{.Image}}' "${CONTAINER_ID}" 2>/dev/null || true)"
              HEALTH_STATUS="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "${CONTAINER_ID}" 2>/dev/null || true)"
              if [ "${HEALTH_STATUS}" = "healthy" ] && \
                [ "${RUNNING_IMAGE_ID}" = "${OLD_IMAGE_ID}" ] && \
                curl -fsS --connect-timeout 5 --max-time 10 \
                  http://localhost/api/health >/dev/null 2>&1; then
                if ! RUNNING_ASR_STATE="$("${COMPOSE[@]}" exec -T backend python -c \
                  'from src.config import ASR_ENABLED, TRANSCRIPTION_ADMITTED_PROFILE_IDS; print(("true" if ASR_ENABLED else "false") + "|" + ",".join(TRANSCRIPTION_ADMITTED_PROFILE_IDS))')"; then
                  echo "APP_ONLY_ROLLBACK status=failed stage=verify-admission"
                  return 1
                fi
                EXPECTED_ROLLBACK_ASR_STATE="${PREVIOUS_ASR_ENABLED}|${PREVIOUS_TRANSCRIPTION_ADMITTED_PROFILE_IDS}"
                if [ "${RUNNING_ASR_STATE}" != "${EXPECTED_ROLLBACK_ASR_STATE}" ]; then
                  echo "APP_ONLY_ROLLBACK status=failed stage=verify-admission"
                  return 1
                fi
                docker image rm "${ROLLBACK_IMAGE_TAG}" >/dev/null 2>&1 || \
                  echo "WARNING: retained rollback tag could not be removed"
                echo "APP_ONLY_ROLLBACK status=complete image=${OLD_IMAGE_ID}"
                return 0
              fi
              sleep 5
            done
            echo "APP_ONLY_ROLLBACK status=failed image=${OLD_IMAGE_ID}"
            return 1
          }

          set +e
          (
            set -euo pipefail
            git merge --ff-only "${DEPLOY_COMMIT_SHA}"
            echo "TRANSCRIPTION_ADMISSION action=${TRANSCRIPTION_ADMISSION_ACTION} source=workflow-environment"
            bash "${REPO_PATH}/scripts/deploy-app.sh"

            CONTAINER_ID="$("${COMPOSE[@]}" ps -q backend)"
            [ -n "${CONTAINER_ID}" ]
            EXPECTED_IMAGE_ID="$(docker image inspect pincheng-rag-backend:latest --format '{{.Id}}')"
            RUNNING_IMAGE_ID="$(docker inspect --format '{{.Image}}' "${CONTAINER_ID}")"
            [ "${RUNNING_IMAGE_ID}" = "${EXPECTED_IMAGE_ID}" ]

            HEALTH_STATUS=""
            for ATTEMPT in $(seq 1 36); do
              HEALTH_STATUS="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "${CONTAINER_ID}" 2>/dev/null || true)"
              [ "${HEALTH_STATUS}" = "healthy" ] && break
              sleep 5
            done
            [ "${HEALTH_STATUS}" = "healthy" ]
            curl -fsS --connect-timeout 5 --max-time 10 \
              http://localhost/api/health | python3 -c \
              'import json,sys; assert json.load(sys.stdin).get("status") == "ok"'
            "${COMPOSE[@]}" exec -T backend curl -fsS \
              --connect-timeout 10 --max-time 30 \
              http://qdrant:6333/collections/pincheng_docs | \
              QDRANT_BEFORE_PATH="${BACKUP_PATH}/qdrant-before.json" python3 -c '
          import json, os, sys
          from pathlib import Path
          before = json.loads(Path(os.environ["QDRANT_BEFORE_PATH"]).read_text(encoding="utf-8"))
          d = json.load(sys.stdin)
          assert d.get("status") == "ok"
          assert d.get("result", {}).get("status") == "green"
          assert d.get("result", {}).get("points_count") == before.get("result", {}).get("points_count")
          '
            verify_sqlite_integrity
            verify_managed_content
            verify_source_decoupling_mounts
            curl -fsS --connect-timeout 5 --max-time 10 http://localhost/admin >/dev/null
            verify_gpu_identity
            verify_gpu_inference
            verify_transcription_admission
            [ "$(git rev-parse HEAD)" = "${DEPLOY_COMMIT_SHA}" ]
            echo "APP_ONLY_DEPLOY status=success target=${DEPLOY_COMMIT_SHA} image=${EXPECTED_IMAGE_ID}"
          )
          DEPLOY_STATUS=$?
          set -e
          if [ "${DEPLOY_STATUS}" -ne 0 ]; then
            if ! rollback_backend; then
              echo "CRITICAL: previous backend image did not recover"
            fi
            echo "ERROR: App-only deployment failed strict verification"
            exit 1
          fi
          docker image rm "${ROLLBACK_IMAGE_TAG}" >/dev/null 2>&1 || \
            echo "WARNING: retained rollback tag could not be removed"
