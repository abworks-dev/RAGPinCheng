name: Extract Qwen3-ASR Qualification Failure Evidence Production

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Full 40-character merged master SHA to inspect"
        required: true
        type: string
      extract_evidence:
        description: "Read the fixed failed run and emit sanitized runner evidence"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-asr-qwen3-asr-qualification-failure-evidence
  cancel-in-progress: false

jobs:
  extract:
    environment: production-asr
    runs-on: [self-hosted, Windows, X64, asr-production]
    timeout-minutes: 10
    env:
      PRODUCTION_PYTHON311_PATH: ${{ vars.PRODUCTION_PYTHON311_PATH }}
      PRODUCTION_QWEN3_ASR_QUALIFICATION_ROOT: ${{ vars.PRODUCTION_QWEN3_ASR_QUALIFICATION_ROOT }}
    steps:
      - name: Validate immutable revision and explicit extraction gate
        shell: powershell
        run: |
          if ("${{ inputs.commit_sha }}" -notmatch '^[0-9a-fA-F]{40}$') {
            throw "commit_sha must be a full 40-character SHA"
          }
          if ("${{ inputs.commit_sha }}".ToLowerInvariant() -ne "${{ github.sha }}".ToLowerInvariant()) {
            throw "commit_sha must equal the workflow dispatch revision"
          }
          if ("${{ github.ref }}" -ne "refs/heads/master") {
            throw "evidence extraction must be dispatched from master"
          }
          if (-not [System.Convert]::ToBoolean("${{ inputs.extract_evidence }}")) {
            throw "extract_evidence must be explicitly enabled"
          }

      - name: Check out requested merged revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1

      - name: Extract fixed sanitized qualification failure evidence offline
        shell: powershell
        run: |
          $python = $env:PRODUCTION_PYTHON311_PATH
          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) {
            throw "Fixed Python 3.11 runtime is missing"
          }
          $version = & $python -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')"
          if ($LASTEXITCODE -ne 0 -or $version.Trim() -ne "3.11") {
            throw "Fixed Python runtime must be Python 3.11"
          }
          $root = "${{ runner.temp }}\qwen3-asr-qualification-failure-${{ github.run_id }}"
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $output = Join-Path $root "qualification-failure-evidence.json"
          & $python -m scripts.extract_qwen3_asr_qualification_failure_evidence --output $output
          if ($LASTEXITCODE -ne 0) {
            throw "Offline qualification failure evidence extraction failed"
          }

      - name: Publish sanitized evidence summary
        if: ${{ always() }}
        shell: powershell
        run: |
          $path = "${{ runner.temp }}\qwen3-asr-qualification-failure-${{ github.run_id }}\qualification-failure-evidence.json"
          if (Test-Path -LiteralPath $path -PathType Leaf) {
            $result = Get-Content -LiteralPath $path -Raw -Encoding UTF8 | ConvertFrom-Json
            $progress = @($result.progress_events | ForEach-Object { "$($_.event):$($_.sample_id)" }) -join ", "
            $errors = @($result.error_summaries | ForEach-Object { "$($_.exception_type): $($_.summary)" }) -join "; "
            @(
              "## Qwen3-ASR qualification failure evidence",
              "",
              "- Status: ``$($result.status)``",
              "- Source run: ``$($result.source_run_id)``",
              "- Last stage: ``$($result.last_stage)``",
              "- Progress: ``$progress``",
              "- Signals: ``$(@($result.signals) -join ',')``",
              "- Error summaries: ``$errors``",
              "- Qualification summary exists: ``$($result.qualification_summary_exists)``",
              "- Sample results exist: ``$($result.sample_results_exists)``",
              "- Profile admission: ``$($result.profile_admission)``",
              "- Production services modified: ``$($result.production_services_modified)``"
            ) -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding UTF8
          } else {
            "Offline extraction ended before sanitized evidence was written." |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding UTF8
          }

      - name: Upload sanitized evidence only
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-asr-qualification-failure-${{ github.run_id }}
          path: ${{ runner.temp }}\qwen3-asr-qualification-failure-${{ github.run_id }}\qualification-failure-evidence.json
          if-no-files-found: warn
          retention-days: 14
