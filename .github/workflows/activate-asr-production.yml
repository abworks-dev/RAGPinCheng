name: Activate Windows ASR Production

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Full 40-character master SHA to execute"
        required: true
        type: string
      operation:
        description: "Safe preflight, explicit activation, or rollback of a prior activation run"
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - activate
          - rollback
      activation_id:
        description: "Original activation run ID; required only for rollback"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-gpu-exclusive
  cancel-in-progress: false

jobs:
  manage-windows:
    environment: production-asr
    runs-on: [self-hosted, Windows, X64, asr-production]
    timeout-minutes: 30
    steps:
      - name: Validate immutable revision and operation
        shell: powershell
        run: |
          if ("${{ inputs.commit_sha }}" -notmatch '^[0-9a-fA-F]{40}$') {
            throw "commit_sha must be a full 40-character SHA"
          }
          if ("${{ inputs.commit_sha }}".ToLowerInvariant() -ne "${{ github.sha }}".ToLowerInvariant()) {
            throw "commit_sha must equal the workflow dispatch revision"
          }
          if ("${{ inputs.operation }}" -eq "rollback") {
            if ("${{ inputs.activation_id }}" -notmatch '^[0-9]{1,20}$') {
              throw "activation_id is required for rollback"
            }
          } elseif (-not [string]::IsNullOrWhiteSpace("${{ inputs.activation_id }}")) {
            throw "activation_id is accepted only for rollback"
          }

      - name: Check out requested revision
        if: ${{ inputs.operation != 'rollback' }}
        uses: actions/checkout@v4
        env:
          HTTP_PROXY: ${{ secrets.ASR_DEPENDENCY_PROXY }}
          HTTPS_PROXY: ${{ secrets.ASR_DEPENDENCY_PROXY }}
          NO_PROXY: ${{ vars.PRODUCTION_NO_PROXY }}
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1

      - name: Manage Windows ASR activation
        shell: powershell
        env:
          ASR_SERVICE_TOKEN: ${{ secrets.ASR_SERVICE_TOKEN }}
          BGE_PRIORITY_PROBE_TOKEN: ${{ secrets.GPU_SERVICE_TOKEN }}
          GPU_SERVICE_ACTIVITY_URL: ${{ vars.GPU_SERVICE_ACTIVITY_URL }}
          PRODUCTION_APP_NODE_IP: ${{ vars.PRODUCTION_APP_NODE_IP }}
          PRODUCTION_ASR_PROGRAM_ROOT: ${{ vars.PRODUCTION_ASR_PROGRAM_ROOT }}
          PRODUCTION_ASR_DATA_ROOT: ${{ vars.PRODUCTION_ASR_DATA_ROOT }}
          PRODUCTION_ASR_BACKUP_ROOT: ${{ vars.PRODUCTION_ASR_BACKUP_ROOT }}
        run: |
          $operation = "${{ inputs.operation }}"
          $activationId = if ($operation -eq "rollback") {
            "${{ inputs.activation_id }}"
          } else {
            "${{ github.run_id }}"
          }
          $scriptPath = if ($operation -eq "rollback") {
            (Join-Path $env:PRODUCTION_ASR_BACKUP_ROOT "$activationId\activate-asr-production.ps1")
          } else {
            "${{ github.workspace }}\scripts\activate-asr-production.ps1"
          }
          if (-not (Test-Path -LiteralPath $scriptPath -PathType Leaf)) {
            throw "ASR activation management script is missing"
          }
          $params = @{
            Mode = (Get-Culture).TextInfo.ToTitleCase($operation)
            CommitSha = "${{ inputs.commit_sha }}"
            ActivationId = $activationId
          }
          if ($operation -ne "rollback") {
            $params.SourceRoot = "${{ github.workspace }}"
          }
          & $scriptPath @params

  verify-ubuntu:
    if: ${{ inputs.operation == 'activate' }}
    needs: [manage-windows]
    environment: production-asr
    runs-on: [self-hosted, Linux, X64, ubuntu, production, app]
    timeout-minutes: 10
    steps:
      - name: Check out requested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1

      - name: Verify Windows ASR from Ubuntu while backend remains disabled
        env:
          ASR_SERVICE_TOKEN: ${{ secrets.ASR_SERVICE_TOKEN }}
          ASR_ENV_FILE: ${{ vars.PRODUCTION_APP_ENV_FILE }}
          ASR_SERVICE_URL: ${{ vars.PRODUCTION_ASR_SERVICE_URL }}
        run: |
          set -euo pipefail
          python3 scripts/verify_asr_from_ubuntu.py \
            --env-file "${ASR_ENV_FILE}" \
            --asr-url "${ASR_SERVICE_URL}"

  rollback-after-cross-node-failure:
    if: ${{ always() && inputs.operation == 'activate' && needs.manage-windows.result == 'success' && needs.verify-ubuntu.result != 'success' }}
    needs: [manage-windows, verify-ubuntu]
    environment: production-asr
    runs-on: [self-hosted, Windows, X64, asr-production]
    timeout-minutes: 10
    steps:
      - name: Roll back failed cross-node activation
        shell: powershell
        env:
          PRODUCTION_ASR_BACKUP_ROOT: ${{ vars.PRODUCTION_ASR_BACKUP_ROOT }}
          PRODUCTION_ASR_PROGRAM_ROOT: ${{ vars.PRODUCTION_ASR_PROGRAM_ROOT }}
          PRODUCTION_ASR_DATA_ROOT: ${{ vars.PRODUCTION_ASR_DATA_ROOT }}
        run: |
          $activationId = "${{ github.run_id }}"
          $scriptPath = Join-Path $env:PRODUCTION_ASR_BACKUP_ROOT "$activationId\activate-asr-production.ps1"
          if (-not (Test-Path -LiteralPath $scriptPath -PathType Leaf)) {
            throw "Protected ASR rollback script is missing"
          }
          $params = @{
            Mode = "Rollback"
            CommitSha = "${{ inputs.commit_sha }}"
            ActivationId = $activationId
          }
          & $scriptPath @params
