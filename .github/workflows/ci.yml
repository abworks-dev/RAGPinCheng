name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: python -m compileall -q api src scripts tests gpu_service asr_service

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run test:run
          npm run build

      - name: Validate Docker Compose configuration
        shell: bash
        run: |
          touch .env
          docker compose -f docker/docker-compose.yml config --quiet

  test-transcription-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install declared Python contract-test dependencies
        run: |
          pip install pytest requests httpx pypdf langchain-text-splitters qdrant-client openai python-dotenv tqdm fastapi sse-starlette passlib[argon2] python-multipart

      - name: Run Phase 1 transcription contract tests
        run: pytest tests/test_transcription*.py tests/test_transcript_manual_regression.py -v

  test-transcription-phase5:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install existing Phase 5 test dependencies
        run: |
          pip install pytest requests httpx pypdf langchain-text-splitters qdrant-client openai python-dotenv tqdm fastapi sse-starlette passlib[argon2] python-multipart

      - name: Run Phase 5 publication and visibility tests
        run: |
          pytest \
            tests/test_transcription_phase5_application_e2e.py \
            tests/test_transcription_publication_index_adapter.py \
            tests/test_transcription_retrieval_visibility.py \
            tests/test_transcript_retrieval_integration.py \
            tests/test_transcription_phase5_worker.py \
            tests/test_transcript_index_metadata.py \
            tests/test_transcription_phase5_static_boundaries.py -v

  test-providers:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install provider test dependencies
        run: pip install httpx pytest python-dotenv

      - name: Run provider unit tests
        run: pytest tests/test_providers.py -v

  test-asr-service-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest fastapi httpx requests python-dotenv
      - run: pytest tests/test_transcription_asr_service_contract.py tests/test_transcription_provider_registry.py tests/test_transcription_profile_catalog.py tests/test_transcription_remote_provider.py tests/test_asr_deployment_static.py tests/test_qwen3_asr_controlled_wheel.py tests/test_qwen3_asr_qualification_failure_evidence.py tests/test_qwen3_asr_performance_diagnostic.py tests/test_gpu_runtime_deployment_static.py tests/test_deploy_git_safety.py tests/test_asr_activation.py tests/test_faster_whisper_model_tls.py asr_service/tests -v

  test-gpu-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install GPU contract-test dependencies without GPU packages
        run: pip install fastapi uvicorn pydantic httpx pytest python-dotenv

      - name: Run GPU service contract tests with the test-local torch stub
        run: pytest gpu_service/tests/test_contract.py -v

  validate-migration-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify .env.example has all required GPU config keys
        run: |
          for key in GPU_SERVICE_URL GPU_SERVICE_TOKEN EMBED_PROVIDER RERANK_PROVIDER; do
            if grep -q "$key" .env.example; then
              echo "✅ $key found in .env.example"
            else
              echo "❌ $key MISSING from .env.example"
              exit 1
            fi
          done
