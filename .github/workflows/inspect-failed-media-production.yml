name: Inspect Failed Production Media

on:
  workflow_dispatch:
    inputs:
      confirm_inspection:
        description: Select INSPECT_FAILED_MEDIA to inspect one exact original filename
        required: true
        default: CANCEL
        type: choice
        options:
          - CANCEL
          - INSPECT_FAILED_MEDIA
      original_filename:
        description: Exact original filename to inspect
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-failed-media-inspection
  cancel-in-progress: false

jobs:
  inspect:
    if: ${{ inputs.confirm_inspection == 'INSPECT_FAILED_MEDIA' }}
    environment: production-asr
    runs-on: [self-hosted, linux, ubuntu, production, app]
    timeout-minutes: 10
    env:
      REPO_PATH: ${{ vars.PRODUCTION_APP_REPO_PATH }}
      COMPOSE_OVERRIDE: ${{ vars.PRODUCTION_APP_COMPOSE_OVERRIDE }}
      COMPOSE_ENV_FILE: ${{ vars.PRODUCTION_APP_ENV_FILE }}
      ORIGINAL_FILENAME: ${{ inputs.original_filename }}
    steps:
      - name: Inspect exact failed media without mutation
        run: |
          set -euo pipefail
          [ "${{ github.ref }}" = "refs/heads/master" ] || {
            echo "ERROR: production media inspection must run from master"
            exit 1
          }
          COMPOSE=(docker compose -p ragpincheng-prod \
            -f "${REPO_PATH}/docker/docker-compose.yml" \
            -f "${COMPOSE_OVERRIDE}" --env-file "${COMPOSE_ENV_FILE}")
          "${COMPOSE[@]}" exec -T -e ORIGINAL_FILENAME backend python - <<'PY'
          import json
          import os

          from api.db import connect

          filename = os.environ["ORIGINAL_FILENAME"]
          conn = connect()
          try:
              rows = conn.execute(
                  """SELECT media_id, status,
                     (SELECT COUNT(*) FROM transcription_jobs WHERE media_id=media_assets.media_id) AS job_count,
                     (SELECT COUNT(*) FROM transcript_versions WHERE media_id=media_assets.media_id) AS version_count
                     FROM media_assets WHERE original_filename=?""",
                  (filename,),
              ).fetchall()
          finally:
              conn.close()
          print("FAILED_MEDIA_INSPECTION " + json.dumps([dict(row) for row in rows], sort_keys=True))
          PY
