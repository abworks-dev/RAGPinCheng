name: Qualify WhisperX Production

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Full merged master SHA to qualify"
        required: true
        type: string
      execute_qualification:
        description: "Run isolated WhisperX CUDA quality qualification"
        required: true
        default: false
        type: boolean
      manifest_preflight:
        description: "Read and validate only the shared qualification manifest and WAV identities"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-asr-whisperx-qualification
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate immutable revision and exclusive execution mode
        shell: bash
        run: |
          if [[ ! "${{ inputs.commit_sha }}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "commit_sha must be a full SHA" >&2
            exit 1
          fi
          if [[ "${{ inputs.commit_sha }}" != "${{ github.sha }}" ]]; then
            echo "commit_sha must equal the workflow dispatch revision" >&2
            exit 1
          fi
          if [[ "${{ github.ref }}" != "refs/heads/master" ]]; then
            echo "qualification must run from master" >&2
            exit 1
          fi
          if [[ "${{ inputs.execute_qualification }}" == "${{ inputs.manifest_preflight }}" ]]; then
            echo "enable exactly one of execute_qualification or manifest_preflight" >&2
            exit 1
          fi

  manifest-preflight:
    needs: gate
    if: ${{ inputs.manifest_preflight }}
    environment: production-asr
    runs-on: [self-hosted, Windows, X64, asr-production]
    timeout-minutes: 10
    env:
      PRODUCTION_PYTHON311_PATH: ${{ vars.PRODUCTION_PYTHON311_PATH }}
      PRODUCTION_ASR_QUALIFICATION_ROOT: ${{ vars.PRODUCTION_ASR_QUALIFICATION_ROOT }}
      PRODUCTION_ASR_QUALIFICATION_MANIFEST_PATH: ${{ vars.PRODUCTION_ASR_QUALIFICATION_MANIFEST_PATH }}
      PRODUCTION_QWEN3_ASR_MANIFEST_PATH: ${{ vars.PRODUCTION_QWEN3_ASR_MANIFEST_PATH }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1

      - name: Validate shared corpus identity read-only
        shell: powershell
        run: |
          $python = $env:PRODUCTION_PYTHON311_PATH
          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) {
            throw "Machine-wide Python 3.11 is missing"
          }
          $json = @(& $python "${{ github.workspace }}\scripts\asr_qualification_manifest.py" --engine whisperx)
          if ($LASTEXITCODE -ne 0 -or $json.Count -ne 1) {
            throw "Shared corpus preflight failed"
          }
          $identity = ([string]$json[0]) | ConvertFrom-Json
          [System.IO.File]::WriteAllText(
            "${{ runner.temp }}\whisperx-manifest-preflight-${{ github.run_id }}.json",
            ([string]$json[0]) + "`n",
            (New-Object System.Text.UTF8Encoding($false))
          )
          @(
            "## WhisperX manifest preflight",
            "",
            "- Source: ``$($identity.manifest_source)``",
            "- Manifest SHA-256: ``$($identity.manifest_sha256)``",
            "- Sample set: ``$($identity.sample_set_id)``",
            "- Annotation version: ``$($identity.annotation_version)``",
            "- Samples: ``$($identity.sample_count)``"
          ) -join "`n" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding UTF8

      - name: Upload sanitized corpus identity
        uses: actions/upload-artifact@v4
        with:
          name: whisperx-manifest-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}\whisperx-manifest-preflight-${{ github.run_id }}.json
          if-no-files-found: error
          retention-days: 14

  qualify:
    needs: gate
    if: ${{ inputs.execute_qualification }}
    environment: production-asr
    runs-on: [self-hosted, Windows, X64, asr-production]
    timeout-minutes: 180
    env:
      PRODUCTION_PYTHON311_PATH: ${{ vars.PRODUCTION_PYTHON311_PATH }}
      PRODUCTION_NO_PROXY: ${{ vars.PRODUCTION_NO_PROXY }}
      PRODUCTION_ASR_QUALIFICATION_ROOT: ${{ vars.PRODUCTION_ASR_QUALIFICATION_ROOT }}
      PRODUCTION_ASR_QUALIFICATION_MANIFEST_PATH: ${{ vars.PRODUCTION_ASR_QUALIFICATION_MANIFEST_PATH }}
      PRODUCTION_QWEN3_ASR_MANIFEST_PATH: ${{ vars.PRODUCTION_QWEN3_ASR_MANIFEST_PATH }}
      PRODUCTION_WHISPERX_MODEL_ROOT: ${{ vars.PRODUCTION_WHISPERX_MODEL_ROOT }}
      PRODUCTION_WHISPERX_NLTK_ROOT: ${{ vars.PRODUCTION_WHISPERX_NLTK_ROOT }}
      PRODUCTION_WHISPERX_QUALIFICATION_ROOT: ${{ vars.PRODUCTION_WHISPERX_QUALIFICATION_ROOT }}
      PRODUCTION_WHISPERX_WHEEL_CACHE_ROOT: ${{ vars.PRODUCTION_WHISPERX_WHEEL_CACHE_ROOT }}
      PRODUCTION_WHISPERX_REPORT_ROOT: ${{ vars.PRODUCTION_WHISPERX_REPORT_ROOT }}
      GPU_SERVICE_URL: ${{ vars.GPU_SERVICE_URL }}
      GPU_SERVICE_ACTIVITY_URL: ${{ vars.GPU_SERVICE_ACTIVITY_URL }}
    steps:
      - name: Validate immutable revision and explicit R3 gate
        shell: powershell
        run: |
          if ("${{ inputs.commit_sha }}" -notmatch '^[0-9a-fA-F]{40}$') {
            throw "commit_sha must be a full SHA"
          }
          if ("${{ inputs.commit_sha }}".ToLowerInvariant() -ne "${{ github.sha }}".ToLowerInvariant()) {
            throw "commit_sha must equal the dispatch revision"
          }
          if ("${{ github.ref }}" -ne "refs/heads/master") {
            throw "qualification must run from master"
          }
          if (-not [Convert]::ToBoolean("${{ inputs.execute_qualification }}")) {
            throw "execute_qualification must be explicitly enabled"
          }

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1

      - name: Run isolated WhisperX qualification
        shell: powershell
        env:
          ASR_DEPENDENCY_PROXY: ${{ secrets.ASR_DEPENDENCY_PROXY }}
          ASR_MODEL_DOWNLOAD_PROXY: ${{ secrets.ASR_MODEL_DOWNLOAD_PROXY }}
        run: |
          & "${{ github.workspace }}\scripts\qualify-whisperx-production.ps1" `
            -CommitSha "${{ inputs.commit_sha }}" `
            -SourceRoot "${{ github.workspace }}" `
            -RunId "${{ github.run_id }}" `
            -ExecuteQualification $true `
            -SummaryPath (Join-Path $env:PRODUCTION_WHISPERX_REPORT_ROOT "runs\${{ github.run_id }}\reports\verdict.json")

      - name: Publish sanitized qualification summary
        if: ${{ always() }}
        shell: powershell
        run: |
          $path = Join-Path $env:PRODUCTION_WHISPERX_REPORT_ROOT "runs\${{ github.run_id }}\reports\verdict.json"
          if (Test-Path -LiteralPath $path -PathType Leaf) {
            $v = Get-Content -LiteralPath $path -Raw -Encoding UTF8 | ConvertFrom-Json
            @(
              "## WhisperX qualification",
              "",
              "- Status: ``$($v.status)``",
              "- Failure code: ``$($v.failure_code)``",
              "- Commit: ``$($v.commit_sha)``",
              "- Samples: ``$($v.sample_count)``",
              "- Selected candidate: ``$($v.selected_candidate)``",
              "- Full candidate passed: ``$($v.selection.full_candidate_passed)``",
              "- Standard code recall improved: ``$($v.selection.standard_code_recall_improved)``",
              "- Noisy BIM CER improved: ``$($v.selection.noisy_bim_cer_improved)``",
              "- Negative false positives zero: ``$($v.selection.negative_false_positives_zero)``",
              "- Peak GPU memory: ``$($v.peak_gpu_memory_mib) MiB``",
              "- License audit: ``$($v.license_audit_status)``",
              "- Profile admission: ``$($v.profile_admission)``",
              "- Production services modified: ``$($v.production_services_modified)``"
            ) -join "`n" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding UTF8
          }

      - name: Upload sanitized verdict
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: whisperx-qualification-verdict-${{ github.run_id }}
          path: ${{ vars.PRODUCTION_WHISPERX_REPORT_ROOT }}\runs\${{ github.run_id }}\reports
          if-no-files-found: warn
          retention-days: 14
