name: Preflight Source Decoupling T12

on:
  workflow_dispatch:
    inputs:
      confirm_read_only:
        description: Select PREFLIGHT_T12 to inventory source dependencies without writes
        required: true
        default: CANCEL
        type: choice
        options:
          - CANCEL
          - PREFLIGHT_T12
      expected_commit:
        description: Full master commit approved for the read-only T12 preflight
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: managed-content-t12-preflight
  cancel-in-progress: false

jobs:
  preflight:
    environment: production-asr
    runs-on: [self-hosted, linux, ubuntu, production, app]
    timeout-minutes: 60
    env:
      REPO_PATH: ${{ vars.PRODUCTION_APP_REPO_PATH }}
      DATA_PATH: ${{ vars.PRODUCTION_APP_DATA_PATH }}
      BACKUP_ROOT: ${{ vars.PRODUCTION_APP_BACKUP_DIRECTORY }}
      CONTENT_ROOT: ${{ vars.PRODUCTION_CONTENT_ROOT }}
      COMPOSE_OVERRIDE: ${{ vars.PRODUCTION_APP_COMPOSE_OVERRIDE }}
      COMPOSE_ENV_FILE: ${{ vars.PRODUCTION_APP_ENV_FILE }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      CONFIRM_READ_ONLY: ${{ inputs.confirm_read_only }}
      EXPECTED_HEAD_ENFORCEMENT: ${{ vars.CONTENT_HEAD_ENFORCEMENT }}
    steps:
      - name: Check out the approved preflight implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_commit }}
          persist-credentials: false

      - name: Inventory source dependencies without production writes
        shell: bash
        run: |
          set -euo pipefail

          [ "${CONFIRM_READ_ONLY}" = "PREFLIGHT_T12" ] || {
            echo "ERROR: T12 read-only preflight was not confirmed"
            exit 1
          }
          [[ "${EXPECTED_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
          [ "${GITHUB_REF}" = "refs/heads/master" ]
          [ "${GITHUB_SHA}" = "${EXPECTED_COMMIT}" ]
          [ "$(git rev-parse HEAD)" = "${EXPECTED_COMMIT}" ]
          [ "${EXPECTED_HEAD_ENFORCEMENT}" = "compat" ]
          [ "${REPO_PATH}" = "/data/workspace/projects/ragpincheng" ]
          [ "${DATA_PATH}" = "/data/services/docker/data/ragpincheng/prod/app" ]
          [ "${BACKUP_ROOT}" = "/data/backup/databases/ragpincheng" ]
          [ "${CONTENT_ROOT}" = "/data/business/ragpincheng/content" ]
          [ "${COMPOSE_OVERRIDE}" = "/data/services/docker/compose/ragpincheng/prod/compose.prod.yaml" ]
          [ "${COMPOSE_ENV_FILE}" = "/data/secrets/ragpincheng/prod.env" ]

          for path in "${REPO_PATH}" "${DATA_PATH}" "${BACKUP_ROOT}" "${CONTENT_ROOT}"; do
            [ -d "${path}" ] && [ ! -L "${path}" ] || {
              echo "ERROR: required production path is not a real directory"
              exit 1
            }
          done
          for path in "${DATA_PATH}/app.sqlite" "${DATA_PATH}/parents.sqlite"; do
            [ -f "${path}" ] && [ ! -L "${path}" ] || {
              echo "ERROR: required production database is not a regular file"
              exit 1
            }
          done
          [ "$(git -C "${REPO_PATH}" branch --show-current)" = "master" ]
          [ -z "$(git -C "${REPO_PATH}" status --porcelain --untracked-files=no)" ]

          [ -e "${BACKUP_ROOT}/.managed-content-t9.lock" ]
          [ -e "${BACKUP_ROOT}/.production-app-deploy.lock" ]
          exec 9<"${BACKUP_ROOT}/.managed-content-t9.lock"
          flock -s -n 9 || { echo "ERROR: another managed-content operation is active"; exit 1; }
          exec 8<"${BACKUP_ROOT}/.production-app-deploy.lock"
          flock -s -n 8 || { echo "ERROR: an application deployment is active"; exit 1; }

          REPORT_ROOT="${RUNNER_TEMP}/t12-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-summary"
          mkdir -m 700 "${REPORT_ROOT}"
          COMPOSE=(docker compose -p ragpincheng-prod -f "${REPO_PATH}/docker/docker-compose.yml" -f "${COMPOSE_OVERRIDE}" --env-file "${COMPOSE_ENV_FILE}")
          BACKEND_CONTAINER="$("${COMPOSE[@]}" ps -q backend)"
          [ -n "${BACKEND_CONTAINER}" ]
          [ "$(docker inspect --format '{{.State.Health.Status}}' "${BACKEND_CONTAINER}")" = "healthy" ]

          "${COMPOSE[@]}" exec -T backend curl -fsS \
            http://qdrant:6333/collections/pincheng_docs > "${REPORT_ROOT}/qdrant.json"
          REPORT_ROOT_ENV="${REPORT_ROOT}" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["REPORT_ROOT_ENV"]) / "qdrant.json"
          payload = json.loads(path.read_text(encoding="utf-8"))
          result = payload.get("result", {})
          if payload.get("status") != "ok" or result.get("status") != "green":
              raise SystemExit("Qdrant collection is not green")
          path.unlink()
          PY

          "${COMPOSE[@]}" exec -T backend python - \
            --app-database /app/data/app.sqlite \
            --parents-database /app/data/parents.sqlite \
            --qdrant-url http://qdrant:6333 \
            --collection pincheng_docs \
            --docs-root /app/docs \
            --media-root /app/media \
            --expected-managed-heads 116 \
            < scripts/preflight_source_decoupling_t12.py \
            > "${REPORT_ROOT}/summary.json"

          REPORT="${REPORT_ROOT}/summary.json" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["REPORT"])
          report = json.loads(path.read_text(encoding="utf-8"))
          if report.get("status") != "ready":
              raise SystemExit("T12 preflight did not reach ready state")
          if report.get("managed", {}).get("head_versions") != 116:
              raise SystemExit("managed head baseline changed")
          if any(report.get("active_jobs", {}).values()):
              raise SystemExit("active jobs appeared during preflight")
          digest = report.get("retirement_candidates", {}).get("plan_digest", "")
          if len(digest) != 64:
              raise SystemExit("invalid T12 plan digest")
          path.write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          printf '%s\n' \
            'Aggregated read-only inventory. No filenames, paths, business hashes, record IDs, or file contents are included.' \
            > "${REPORT_ROOT}/README.txt"
          chmod -R go-rwx "${REPORT_ROOT}"
          echo "T12_PREFLIGHT status=ready managed_heads=116"

      - name: Upload redacted T12 summary
        uses: actions/upload-artifact@v4
        with:
          name: source-decoupling-t12-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/t12-${{ github.run_id }}-${{ github.run_attempt }}-summary
          if-no-files-found: error
          retention-days: 30
