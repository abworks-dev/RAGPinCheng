name: Cleanup Production

on:
  workflow_call:
    inputs:
      target:
        description: Cleanup target
        required: true
        type: string
      apply:
        description: Delete approved candidates instead of previewing
        required: true
        type: boolean
      confirm_production_cleanup:
        description: Confirm this cleanup run on the production Windows host
        required: true
        type: boolean
      allow_unconfirmed_dry_run:
        description: Permit a non-destructive dry-run without production confirmation
        required: false
        default: false
        type: boolean
      reason:
        description: Trigger reason for the audit report
        required: false
        default: reusable-call
        type: string
      asr_manifest_run_id:
        description: Workflow run containing the approved ASR batch manifest
        required: false
        default: ''
        type: string
      asr_manifest_sha256:
        description: SHA-256 of the approved ASR batch manifest
        required: false
        default: ''
        type: string
    outputs:
      asr_manifest_sha256:
        description: SHA-256 of the ASR batch manifest generated or applied by this run
        value: ${{ jobs.cleanup.outputs.asr_manifest_sha256 }}

permissions:
  contents: read
  actions: read

concurrency:
  group: production-gpu-exclusive
  cancel-in-progress: false

env:
  ASR_DATA_ROOT: ${{ vars.PRODUCTION_ASR_DATA_ROOT }}
  ASR_PROGRAM_ROOT: ${{ vars.PRODUCTION_ASR_PROGRAM_ROOT }}
  FASTER_WHISPER_QUALIFICATION_ROOT: ${{ vars.PRODUCTION_FASTER_WHISPER_QUALIFICATION_ROOT }}
  QWEN3_ASR_QUALIFICATION_ROOT: ${{ vars.PRODUCTION_QWEN3_ASR_QUALIFICATION_ROOT }}
  WHISPERX_ROOT: ${{ vars.PRODUCTION_WHISPERX_ROOT }}
  RUNTIME_ROOT: ${{ vars.PRODUCTION_RUNTIME_ROOT }}
  BACKUP_DIRECTORY: ${{ vars.PRODUCTION_BACKUP_DIRECTORY }}

jobs:
  cleanup:
    if: >-
      inputs.confirm_production_cleanup == true ||
      (inputs.allow_unconfirmed_dry_run == true && inputs.apply == false)
    runs-on: [self-hosted, windows, production, gpu]
    environment: production-asr
    timeout-minutes: 30
    outputs:
      asr_manifest_sha256: ${{ steps.cleanup.outputs.asr_manifest_sha256 }}
    env:
      INPUT_TARGET: ${{ inputs.target }}
      INPUT_APPLY: ${{ inputs.apply }}
      INPUT_CONFIRM: ${{ inputs.confirm_production_cleanup }}
      INPUT_REASON: ${{ inputs.reason }}
      INPUT_ASR_MANIFEST_SHA256: ${{ inputs.asr_manifest_sha256 }}
    steps:
      - name: Check out cleanup revision
        uses: actions/checkout@v4

      - name: Verify cleanup checkout
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $scriptPath = Join-Path "${{ github.workspace }}" 'scripts\cleanup-production.ps1'
          if (-not (Test-Path -LiteralPath $scriptPath -PathType Leaf)) {
            throw "Unified cleanup script is missing: $scriptPath"
          }
          Write-Host "Using cleanup script: $scriptPath"

      - name: Download approved ASR batch manifest
        if: ${{ inputs.apply == true && (inputs.target == 'all' || inputs.target == 'asr') }}
        uses: actions/download-artifact@v4
        with:
          name: production-cleanup-${{ inputs.asr_manifest_run_id }}
          path: ${{ runner.temp }}/ragpincheng-approved-cleanup
          github-token: ${{ github.token }}
          run-id: ${{ inputs.asr_manifest_run_id }}

      - name: Run production cleanup
        id: cleanup
        shell: powershell
        env:
          REPORT_ROOT: ${{ runner.temp }}\ragpincheng-production-cleanup
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $target = if ($env:INPUT_TARGET) { $env:INPUT_TARGET } else { 'all' }
          $apply = $env:INPUT_APPLY -eq 'true' -and $env:INPUT_CONFIRM -eq 'true'
          $arguments = @{
            Target                         = $target
            AsrDataRoot                    = $env:ASR_DATA_ROOT
            AsrProgramRoot                 = $env:ASR_PROGRAM_ROOT
            FasterWhisperQualificationRoot = $env:FASTER_WHISPER_QUALIFICATION_ROOT
            Qwen3AsrQualificationRoot       = $env:QWEN3_ASR_QUALIFICATION_ROOT
            WhisperXRoot                    = $env:WHISPERX_ROOT
            RuntimeRoot                     = $env:RUNTIME_ROOT
            BackupDirectory                 = $env:BACKUP_DIRECTORY
            ReportRoot                      = $env:REPORT_ROOT
            Confirm                         = $false
          }
          if ($apply) { $arguments.Apply = $true }
          if ($apply -and ($target -eq 'all' -or $target -eq 'asr')) {
            if (-not $env:INPUT_ASR_MANIFEST_SHA256) {
              throw 'ASR apply requires an approved manifest SHA-256'
            }
            $manifests = @(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'ragpincheng-approved-cleanup') `
              -Filter 'asr-batch-manifest.json' -File -Recurse)
            if ($manifests.Count -ne 1) {
              throw "Expected exactly one approved ASR batch manifest, found $($manifests.Count)"
            }
            $arguments.AsrBatchManifestPath = $manifests[0].FullName
            $arguments.ExpectedAsrBatchManifestSha256 = $env:INPUT_ASR_MANIFEST_SHA256
          }
          & (Join-Path "${{ github.workspace }}" 'scripts\cleanup-production.ps1') @arguments
          if ($target -eq 'all' -or $target -eq 'asr') {
            $manifestSha256 = if ($apply) {
              $env:INPUT_ASR_MANIFEST_SHA256.ToLowerInvariant()
            } else {
              $manifests = @(Get-ChildItem -LiteralPath $env:REPORT_ROOT `
                -Filter 'asr-batch-manifest.json' -File -Recurse)
              if ($manifests.Count -ne 1) {
                throw "Expected exactly one generated ASR batch manifest, found $($manifests.Count)"
              }
              (Get-FileHash -LiteralPath $manifests[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "asr_manifest_sha256=$manifestSha256"
          }

      - name: Upload cleanup preview report
        if: ${{ always() && inputs.apply == false }}
        uses: actions/upload-artifact@v4
        with:
          name: production-cleanup-${{ github.run_id }}
          path: ${{ runner.temp }}/ragpincheng-production-cleanup
          if-no-files-found: warn

      - name: Upload cleanup apply report
        if: ${{ always() && inputs.apply == true }}
        uses: actions/upload-artifact@v4
        with:
          name: production-cleanup-${{ github.run_id }}-apply
          path: ${{ runner.temp }}/ragpincheng-production-cleanup
          if-no-files-found: warn
