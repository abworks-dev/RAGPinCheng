name: Qualify GPU Runtime Candidate

on:
  workflow_dispatch:
    inputs:
      confirm_qualification:
        description: Confirm D-drive isolated CUDA candidate qualification
        required: true
        default: false
        type: boolean
      suspend_production_service:
        description: Confirm temporary stop and automatic restore of the current validated GPU service
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-gpu-exclusive
  cancel-in-progress: false

jobs:
  qualify:
    if: ${{ inputs.confirm_qualification == true }}
    environment: production-asr
    runs-on: [self-hosted, windows, production, gpu]
    timeout-minutes: 90
    steps:
      - name: Snapshot and qualify an isolated GPU runtime candidate
        shell: powershell
        env:
          GPU_MODEL_CACHE_SOURCE: ${{ vars.GPU_MODEL_CACHE_SOURCE }}
          REPO_PATH: ${PRODUCTION_REPO_PATH}
          # Candidate releases are run-local so a stale or interrupted release
          # can never be mistaken for the current qualification input.
          RUNTIME_ROOT: ${PRODUCTION_REPO_PATH}\runtime\qualification\${{ github.run_id }}
          TORCH_WHEEL_SEED_ROOT: ${PRODUCTION_REPO_PATH}\runtime\wheel-seed\torch-2.7.0-cu128-cp310-win_amd64
          BACKUP_DIR: ${PRODUCTION_BACKUP_DIRECTORY}
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPU_SERVICE_TOKEN: ${{ secrets.GPU_SERVICE_TOKEN }}
          DEPLOY_COMMIT_SHA: ${{ github.sha }}
          DEPLOY_HTTP_PROXY: ${{ vars.DEPLOY_HTTP_PROXY }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          if (-not [Convert]::ToBoolean("${{ inputs.confirm_qualification }}")) {
            throw "confirm_qualification must be explicitly enabled"
          }
          if (-not [Convert]::ToBoolean("${{ inputs.suspend_production_service }}")) {
            throw "suspend_production_service must be explicitly enabled"
          }
          if ([string]::IsNullOrWhiteSpace($env:GPU_SERVICE_TOKEN)) {
            throw "GPU_SERVICE_TOKEN is required to restore the current validated GPU service"
          }
          Set-Location $env:REPO_PATH
          $basic = [Convert]::ToBase64String(
            [Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GIT_TOKEN")
          )
          $proxyArgs = @()
          if ($env:DEPLOY_HTTP_PROXY) {
            $proxyArgs = @("-c", "http.proxy=$env:DEPLOY_HTTP_PROXY")
            $env:HTTP_PROXY = $env:DEPLOY_HTTP_PROXY
            $env:HTTPS_PROXY = $env:DEPLOY_HTTP_PROXY
          }
          $fetched = $false
          foreach ($attempt in 1..4) {
            $gitArgs = @("-c", "http.version=HTTP/1.1") + $proxyArgs + @(
              "-c", "http.extraHeader=AUTHORIZATION: basic $basic", "fetch",
              "https://github.com/abworks-dev/RAGPinCheng.git", $env:DEPLOY_COMMIT_SHA
            )
            & git @gitArgs
            if ($LASTEXITCODE -eq 0) { $fetched = $true; break }
            if ($attempt -lt 4) { Start-Sleep -Seconds ([math]::Pow(2, $attempt)) }
          }
          if (-not $fetched) { throw "Candidate fetch failed after 4 attempts" }
          git merge --ff-only $env:DEPLOY_COMMIT_SHA
          if ($LASTEXITCODE -ne 0) { throw "Candidate fast-forward failed" }
          if ((git rev-parse HEAD).Trim() -ne $env:DEPLOY_COMMIT_SHA) {
            throw "Candidate repository HEAD mismatch"
          }

          $runtimeRoot = "${PRODUCTION_REPO_PATH}\runtime"
          $backupRoot = "${PRODUCTION_BACKUP_DIRECTORY}"
          $productionTaskName = "RAGPinCheng-GPU"
          $productionSuspended = $false
          $currentReleaseRoot = ""
          try {
            $currentReleasePath = Join-Path $runtimeRoot "current-release.json"
            if (-not (Test-Path -LiteralPath $currentReleasePath -PathType Leaf)) {
              throw "No current validated GPU release is recorded"
            }
            $currentRelease = Get-Content -LiteralPath $currentReleasePath -Encoding UTF8 | ConvertFrom-Json
            $currentReleaseRoot = [string]$currentRelease.release_root
            if (-not (Test-Path -LiteralPath $currentReleaseRoot -PathType Container)) {
              throw "Current validated GPU release root is missing"
            }
            $task = Get-ScheduledTask -TaskName $productionTaskName -ErrorAction SilentlyContinue
            $listeners = @(Get-NetTCPConnection -LocalPort 8100 -State Listen -ErrorAction SilentlyContinue)
            $taskRunning = $null -ne $task -and [string]$task.State -eq "Running"
            if ($listeners.Count -gt 0 -or $taskRunning) {
              if ($null -eq $task) {
                throw "GPU port 8100 is listening without the owned production task"
              }
              Stop-ScheduledTask -TaskName $productionTaskName -ErrorAction Stop
              $productionSuspended = $true
              $deadline = [DateTimeOffset]::Now.AddSeconds(180)
              do {
                Start-Sleep -Seconds 5
                $listeners = @(Get-NetTCPConnection -LocalPort 8100 -State Listen -ErrorAction SilentlyContinue)
              } while ($listeners.Count -gt 0 -and [DateTimeOffset]::Now -lt $deadline)
              if ($listeners.Count -gt 0) {
                throw "GPU production port 8100 did not close after the scheduled task was stopped"
              }
              Write-Host "GPU_PRODUCTION_SUSPEND status=stopped"
            }

            $modelCacheSource = & "${env:REPO_PATH}\scripts\resolve-gpu-model-cache-source.ps1" `
            -RepositoryPath $env:REPO_PATH `
            -ConfiguredPath $env:GPU_MODEL_CACHE_SOURCE
            if (@($modelCacheSource).Count -ne 1) {
              throw "GPU model cache source resolution did not return exactly one path"
            }
            & "${env:REPO_PATH}\scripts\snapshot-gpu-runtime.ps1" `
            -RepositoryPath $env:REPO_PATH `
            -ModelCacheSource $modelCacheSource `
            -BackupRoot $env:BACKUP_DIR

            $fingerprint = & "${env:REPO_PATH}\scripts\get-gpu-runtime-fingerprint.ps1" `
            -RepositoryPath $env:REPO_PATH -Commit $env:DEPLOY_COMMIT_SHA
            & "${env:REPO_PATH}\scripts\build-gpu-runtime.ps1" `
            -RepositoryPath $env:REPO_PATH `
            -RuntimeRoot $env:RUNTIME_ROOT `
            -ModelCacheSource $modelCacheSource `
            -TorchWheelSeedRoot $env:TORCH_WHEEL_SEED_ROOT `
            -CommitSha $env:DEPLOY_COMMIT_SHA `
            -SourceFingerprint $fingerprint `
            -RequalifyValidated

            $metadata = Get-Content "${env:REPO_PATH}\gpu_service\runtime-lock.json" -Encoding UTF8 | ConvertFrom-Json
          $requirementsPath = "${env:REPO_PATH}\gpu_service\$($metadata.requirements_file)"
          $lockHash = & "${env:REPO_PATH}\scripts\get-gpu-runtime-lock-hash.ps1" `
            -Path $requirementsPath
          $releaseId = $fingerprint.Substring(0, 12) + "-" + $lockHash.Substring(0, 12)
          $releaseRoot = Join-Path $env:RUNTIME_ROOT "releases\$releaseId"
          "GPU_CANDIDATE_RELEASE_ROOT=$releaseRoot" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding UTF8
          & "${env:REPO_PATH}\scripts\qualify-gpu-runtime.ps1" `
            -RuntimeRoot $env:RUNTIME_ROOT `
            -ReleaseRoot $releaseRoot `
            -QualificationRunId "${{ github.run_id }}"

          $result = Get-Content (Join-Path $releaseRoot "qualification.json") -Encoding UTF8 | ConvertFrom-Json
            Write-Host "GPU_RUNTIME_CANDIDATE status=$($result.status) device=$($result.device) reranker_precision=$($result.reranker_precision) source_fingerprint=$fingerprint lock_sha256=$lockHash qualification_run_id=${{ github.run_id }}"
          } finally {
            if ($productionSuspended) {
              Write-Host "GPU_PRODUCTION_RESTORE status=starting release=$currentReleaseRoot"
              $global:LASTEXITCODE = 0
              & "${env:REPO_PATH}\scripts\promote-gpu-runtime.ps1" `
                -RepositoryPath $env:REPO_PATH `
                -RuntimeRoot $runtimeRoot `
                -BackupDirectory $backupRoot `
                -ReleaseRoot $currentReleaseRoot `
                -GpuServiceToken $env:GPU_SERVICE_TOKEN
              if ($LASTEXITCODE -ne 0) {
                throw "GPU production restore failed (exit $LASTEXITCODE)"
              }
              Write-Host "GPU_PRODUCTION_RESTORE status=complete"
            }
          }

      - name: Upload candidate qualification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: gpu-runtime-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.GPU_CANDIDATE_RELEASE_ROOT }}\runtime-manifest.json
            ${{ env.GPU_CANDIDATE_RELEASE_ROOT }}\qualification.json
            ${{ env.GPU_CANDIDATE_RELEASE_ROOT }}\source-files.sha256.json
            ${{ env.GPU_CANDIDATE_RELEASE_ROOT }}\wheelhouse.sha256.json
            ${{ env.GPU_CANDIDATE_RELEASE_ROOT }}\pip-freeze.txt
            ${{ env.GPU_CANDIDATE_RELEASE_ROOT }}\qualification\fp16\stages.log
            ${{ env.GPU_CANDIDATE_RELEASE_ROOT }}\qualification\fp16\stdout.log
            ${{ env.GPU_CANDIDATE_RELEASE_ROOT }}\qualification\fp16\stderr.log
            ${{ env.GPU_CANDIDATE_RELEASE_ROOT }}\qualification\fp32\stages.log
            ${{ env.GPU_CANDIDATE_RELEASE_ROOT }}\qualification\fp32\stdout.log
            ${{ env.GPU_CANDIDATE_RELEASE_ROOT }}\qualification\fp32\stderr.log
          if-no-files-found: error
          retention-days: 30
