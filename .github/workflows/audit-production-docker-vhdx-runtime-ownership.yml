name: Audit Production Docker VHDX Runtime Ownership

on:
  workflow_dispatch:
    inputs:
      confirm_read_only_audit:
        description: Confirm read-only Docker VHDX runtime ownership audit
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-gpu-exclusive
  cancel-in-progress: false

jobs:
  audit:
    if: ${{ inputs.confirm_read_only_audit == true }}
    runs-on: [self-hosted, windows, production, gpu]
    environment: production-asr
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Audit VHDX references and runtime ownership
        shell: powershell
        timeout-minutes: 10
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'docker-vhdx-runtime-ownership'
          & .\scripts\audit-docker-vhdx-references.ps1 -ReportPath (Join-Path $root 'references.json')
          & .\scripts\audit-docker-vhdx-runtime-ownership.ps1 -ReportPath (Join-Path $root 'runtime.json')
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-vhdx-runtime-ownership-${{ github.run_id }}
          path: ${{ runner.temp }}/docker-vhdx-runtime-ownership
          if-no-files-found: warn
