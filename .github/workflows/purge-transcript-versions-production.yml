name: Purge Transcript Versions Production

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Full 40-character merged master SHA to execute"
        required: true
        type: string
      operation:
        description: "Generate the inventory manifest, apply an approved purge, or restore a pre-purge backup"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - apply
          - restore
      preview_manifest_sha256:
        description: "Exact preview manifest SHA-256; required for apply"
        required: false
        type: string
      backup_file:
        description: "Pre-purge backup file name inside the app data directory; required for restore"
        required: false
        type: string
      confirm_purge:
        description: "Confirm the destructive transcript version purge"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-app-manual-v1
  cancel-in-progress: false

jobs:
  purge:
    if: ${{ inputs.confirm_purge == true }}
    environment: production-asr
    runs-on: [self-hosted, linux, ubuntu, production, app]
    timeout-minutes: 30
    env:
      COMPOSE_OVERRIDE: ${{ vars.PRODUCTION_APP_COMPOSE_OVERRIDE }}
      COMPOSE_ENV_FILE: ${{ vars.PRODUCTION_APP_ENV_FILE }}
      REPO_PATH: ${{ vars.PRODUCTION_APP_REPO_PATH }}
      OPERATION: ${{ inputs.operation }}
      EXPECTED_MANIFEST_SHA256: ${{ inputs.preview_manifest_sha256 }}
      BACKUP_FILE: ${{ inputs.backup_file }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - name: Validate immutable revision and operation
        run: |
          if [[ ! "${{ inputs.commit_sha }}" =~ ^[0-9a-fA-F]{40}$ ]]; then echo "commit_sha must be a full SHA"; exit 1; fi
          if [[ "${{ inputs.commit_sha }}" != "${{ github.sha }}" ]]; then echo "commit_sha must equal the dispatch revision"; exit 1; fi
          if [[ "${{ github.ref }}" != "refs/heads/master" ]]; then echo "purge must run from master"; exit 1; fi
          if [[ "$OPERATION" == "apply" && ! "$EXPECTED_MANIFEST_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]; then echo "apply requires preview_manifest_sha256"; exit 1; fi
          if [[ "$OPERATION" == "restore" && ! "$BACKUP_FILE" =~ ^[A-Za-z0-9._-]+$ ]]; then echo "restore requires backup_file"; exit 1; fi

      - name: Check out requested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1

      - name: Run the inventory preview
        if: ${{ inputs.operation == 'preview' }}
        run: |
          set -euo pipefail
          COMPOSE=(docker compose -p ragpincheng-prod \
            -f "${REPO_PATH}/docker/docker-compose.yml" \
            -f "${COMPOSE_OVERRIDE}" --env-file "${COMPOSE_ENV_FILE}")
          "${COMPOSE[@]}" ps -q backend | grep -q . || { echo "production backend container is not running"; exit 1; }
          "${COMPOSE[@]}" exec -T -e OPERATION=preview backend python - <<'PY' | tee "$RUNNER_TEMP/purge-preview.txt"
          import hashlib
          import json
          import sqlite3

          from src.config import APP_DB_PATH

          TARGET = "transcript_versions"


          def connect_readonly():
              connection = sqlite3.connect(f"file:{APP_DB_PATH}?mode=ro", uri=True)
              connection.row_factory = sqlite3.Row
              return connection


          def referencing_tables(connection):
              """Return (table, column) pairs whose column references transcript_versions."""
              tables = []
              for row in connection.execute(
                  "SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%'"
              ):
                  name = row["name"]
                  if name == TARGET:
                      continue
                  for fk in connection.execute(f"PRAGMA foreign_key_list({name})"):
                      if fk["table"] == TARGET:
                          tables.append((name, fk["from"]))
                          break
              return tables


          def build_manifest(connection):
              versions = connection.execute(f"SELECT count(*) AS n FROM {TARGET}").fetchone()["n"]
              media = connection.execute(
                  f"SELECT count(DISTINCT media_id) AS n FROM {TARGET}"
              ).fetchone()["n"]
              published = connection.execute(
                  f"SELECT count(*) AS n FROM {TARGET} WHERE publication_status='published'"
              ).fetchone()["n"]
              heads = connection.execute("SELECT count(*) AS n FROM media_transcript_heads").fetchone()["n"]
              referencing = {}
              referencing_columns = {}
              for name, column in referencing_tables(connection):
                  referencing[name] = connection.execute(
                      f"SELECT count(*) AS n FROM {name} WHERE {column} IS NOT NULL"
                      f" AND {column} IN (SELECT id FROM {TARGET})"
                  ).fetchone()["n"]
                  referencing_columns[name] = column
              per_media = [
                  {
                      "title": row["title"],
                      "versions": row["versions"],
                      "published": row["published"],
                      "has_head": bool(row["has_head"]),
                  }
                  for row in connection.execute(
                      f"""SELECT m.title,
                                 count(v.id) AS versions,
                                 sum(CASE WHEN v.publication_status='published' THEN 1 ELSE 0 END) AS published,
                                 (SELECT count(*) FROM media_transcript_heads h WHERE h.media_id=m.media_id) AS has_head
                          FROM {TARGET} v JOIN media_assets m ON m.media_id=v.media_id
                          GROUP BY m.media_id ORDER BY m.title LIMIT 60"""
                  )
              ]
              return {
                  "schema_version": "transcript-version-purge/1",
                  "target_table": TARGET,
                  "versions": versions,
                  "media": media,
                  "published_versions": published,
                  "head_rows": heads,
                  "referencing_tables": referencing,
                  "referencing_columns": referencing_columns,
                  "per_media": per_media,
              }


          connection = connect_readonly()
          manifest = build_manifest(connection)
          connection.close()
          canonical = json.dumps(manifest, ensure_ascii=False, sort_keys=True, separators=(",", ":"))
          digest = hashlib.sha256(canonical.encode("utf-8")).hexdigest()
          print("PURGE_MANIFEST_JSON:" + canonical)
          print("PURGE_MANIFEST_SHA256:" + digest)
          PY

      - name: Extract the approved preview manifest
        if: ${{ inputs.operation == 'preview' }}
        run: |
          set -euo pipefail
          sed -n 's/^PURGE_MANIFEST_JSON://p' "$RUNNER_TEMP/purge-preview.txt" | head -n 1 > "$RUNNER_TEMP/purge-manifest.json"
          manifest_sha="$(sha256sum "$RUNNER_TEMP/purge-manifest.json" | cut -d' ' -f1)"
          echo "approved_preview_manifest_sha256=$manifest_sha" >> "$GITHUB_STEP_SUMMARY"
          echo "PURGE_MANIFEST_FILE_SHA256:$manifest_sha"
          python3 - "$RUNNER_TEMP/purge-manifest.json" <<'PY'
          import json
          import sys

          manifest = json.load(open(sys.argv[1], encoding="utf-8"))
          print(json.dumps({
              "versions": manifest["versions"],
              "media": manifest["media"],
              "published_versions": manifest["published_versions"],
              "head_rows": manifest["head_rows"],
              "referencing_tables": manifest["referencing_tables"],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Apply the approved purge
        if: ${{ inputs.operation == 'apply' }}
        run: |
          set -euo pipefail
          COMPOSE=(docker compose -p ragpincheng-prod \
            -f "${REPO_PATH}/docker/docker-compose.yml" \
            -f "${COMPOSE_OVERRIDE}" --env-file "${COMPOSE_ENV_FILE}")
          "${COMPOSE[@]}" ps -q backend | grep -q . || { echo "production backend container is not running"; exit 1; }
          "${COMPOSE[@]}" exec -T -e OPERATION=apply -e EXPECTED_MANIFEST_SHA256="${EXPECTED_MANIFEST_SHA256}" \
            -e RUN_ID="${RUN_ID}" backend python - <<'PY'
          import hashlib
          import json
          import os
          import sqlite3
          import time
          from pathlib import Path

          from src.config import APP_DB_PATH

          TARGET = "transcript_versions"


          def connect_readonly():
              connection = sqlite3.connect(f"file:{APP_DB_PATH}?mode=ro", uri=True)
              connection.row_factory = sqlite3.Row
              return connection


          def referencing_tables(connection):
              """Return (table, column) pairs whose column references transcript_versions."""
              tables = []
              for row in connection.execute(
                  "SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%'"
              ):
                  name = row["name"]
                  if name == TARGET:
                      continue
                  for fk in connection.execute(f"PRAGMA foreign_key_list({name})"):
                      if fk["table"] == TARGET:
                          tables.append((name, fk["from"]))
                          break
              return tables


          def build_manifest(connection):
              versions = connection.execute(f"SELECT count(*) AS n FROM {TARGET}").fetchone()["n"]
              media = connection.execute(
                  f"SELECT count(DISTINCT media_id) AS n FROM {TARGET}"
              ).fetchone()["n"]
              published = connection.execute(
                  f"SELECT count(*) AS n FROM {TARGET} WHERE publication_status='published'"
              ).fetchone()["n"]
              heads = connection.execute("SELECT count(*) AS n FROM media_transcript_heads").fetchone()["n"]
              referencing = {}
              referencing_columns = {}
              for name, column in referencing_tables(connection):
                  referencing[name] = connection.execute(
                      f"SELECT count(*) AS n FROM {name} WHERE {column} IS NOT NULL"
                      f" AND {column} IN (SELECT id FROM {TARGET})"
                  ).fetchone()["n"]
                  referencing_columns[name] = column
              per_media = [
                  {
                      "title": row["title"],
                      "versions": row["versions"],
                      "published": row["published"],
                      "has_head": bool(row["has_head"]),
                  }
                  for row in connection.execute(
                      f"""SELECT m.title,
                                 count(v.id) AS versions,
                                 sum(CASE WHEN v.publication_status='published' THEN 1 ELSE 0 END) AS published,
                                 (SELECT count(*) FROM media_transcript_heads h WHERE h.media_id=m.media_id) AS has_head
                          FROM {TARGET} v JOIN media_assets m ON m.media_id=v.media_id
                          GROUP BY m.media_id ORDER BY m.title LIMIT 60"""
                  )
              ]
              return {
                  "schema_version": "transcript-version-purge/1",
                  "target_table": TARGET,
                  "versions": versions,
                  "media": media,
                  "published_versions": published,
                  "head_rows": heads,
                  "referencing_tables": referencing,
                  "referencing_columns": referencing_columns,
                  "per_media": per_media,
              }


          connection = connect_readonly()
          current = build_manifest(connection)
          canonical = json.dumps(current, ensure_ascii=False, sort_keys=True, separators=(",", ":"))
          if hashlib.sha256(canonical.encode("utf-8")).hexdigest() != os.environ["EXPECTED_MANIFEST_SHA256"].lower():
              raise SystemExit("inventory changed since the approved preview; refusing to purge")
          referencing = [(name, current["referencing_columns"][name], count)
                         for name, count in current["referencing_tables"].items()]
          connection.close()

          data_dir = Path(APP_DB_PATH).parent
          stamp = time.strftime("%Y%m%d-%H%M%S")
          backup_path = data_dir / f"app.sqlite.pre-purge-{os.environ['RUN_ID']}"
          snapshot_path = data_dir / f"transcript-versions-purge-{os.environ['RUN_ID']}.jsonl"

          with sqlite3.connect(f"file:{APP_DB_PATH}?mode=ro", uri=True) as source:
              with sqlite3.connect(backup_path) as target:
                  source.backup(target)
                  integrity = target.execute("PRAGMA integrity_check").fetchone()[0]
                  if integrity != "ok":
                      raise SystemExit(f"backup integrity failed: {integrity}")

          snapshot = connect_readonly()
          with open(snapshot_path, "w", encoding="utf-8") as handle:
              handle.write(json.dumps({"schema_version": "transcript-version-purge-snapshot/1",
                                       "backup_file": backup_path.name,
                                       "captured_at": stamp}, ensure_ascii=False) + "\n")
              for row in snapshot.execute("SELECT * FROM media_transcript_heads"):
                  handle.write(json.dumps({"table": "media_transcript_heads", "row": dict(row)},
                                          ensure_ascii=False, default=str) + "\n")
              for name, column, _count in referencing:
                  if name == "media_transcript_heads":
                      continue
                  for row in snapshot.execute(
                      f"SELECT * FROM {name} WHERE {column} IS NOT NULL AND {column} IN (SELECT id FROM {TARGET})"
                  ):
                      handle.write(json.dumps({"table": name, "row": dict(row)},
                                              ensure_ascii=False, default=str) + "\n")
              for row in snapshot.execute(f"SELECT * FROM {TARGET}"):
                  handle.write(json.dumps({"table": TARGET, "row": dict(row)},
                                          ensure_ascii=False, default=str) + "\n")
          snapshot.close()

          connection = sqlite3.connect(APP_DB_PATH)
          connection.execute("PRAGMA foreign_keys=ON")
          deleted = {}
          try:
              connection.execute("BEGIN IMMEDIATE")
              cursor = connection.execute("DELETE FROM media_transcript_heads")
              deleted["media_transcript_heads"] = cursor.rowcount
              for name, column, _count in referencing:
                  if name == "media_transcript_heads":
                      continue
                  cursor = connection.execute(
                      f"DELETE FROM {name} WHERE {column} IS NOT NULL AND {column} IN (SELECT id FROM {TARGET})"
                  )
                  deleted[name] = cursor.rowcount
              cursor = connection.execute(f"DELETE FROM {TARGET}")
              deleted[TARGET] = cursor.rowcount
              connection.commit()
          except Exception:
              connection.rollback()
              raise
          remaining = connection.execute(f"SELECT count(*) FROM {TARGET}").fetchone()[0]
          heads_remaining = connection.execute("SELECT count(*) FROM media_transcript_heads").fetchone()[0]
          fk_violations = connection.execute("PRAGMA foreign_key_check").fetchall()
          connection.execute("PRAGMA wal_checkpoint(TRUNCATE)")
          connection.close()
          print(json.dumps({
              "operation": "apply",
              "deleted": deleted,
              "remaining_versions": remaining,
              "remaining_heads": heads_remaining,
              "foreign_key_violations": len(fk_violations),
              "backup_file": backup_path.name,
              "snapshot_file": snapshot_path.name,
              "backup_bytes": backup_path.stat().st_size,
              "snapshot_bytes": snapshot_path.stat().st_size,
          }, ensure_ascii=False))
          PY

      - name: Restore the pre-purge database
        if: ${{ inputs.operation == 'restore' }}
        run: |
          set -euo pipefail
          COMPOSE=(docker compose -p ragpincheng-prod \
            -f "${REPO_PATH}/docker/docker-compose.yml" \
            -f "${COMPOSE_OVERRIDE}" --env-file "${COMPOSE_ENV_FILE}")
          echo "stopping backend before restoring the pre-purge database"
          "${COMPOSE[@]}" stop backend
          "${COMPOSE[@]}" run --rm -T -e BACKUP_FILE="${BACKUP_FILE}" backend python - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path

          from src.config import APP_DB_PATH

          backup = Path(APP_DB_PATH).parent / os.environ["BACKUP_FILE"]
          if not backup.is_file():
              raise SystemExit(f"backup file not found: {backup.name}")
          shutil.copy2(backup, APP_DB_PATH)
          print(json.dumps({"operation": "restore", "restored_from": backup.name}, ensure_ascii=False))
          PY
          "${COMPOSE[@]}" up -d backend

      - name: Upload the preview manifest
        if: ${{ always() && inputs.operation == 'preview' }}
        uses: actions/upload-artifact@v4
        with:
          name: transcript-purge-preview-${{ github.run_id }}
          path: ${{ runner.temp }}/purge-manifest.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publish sanitized summary
        if: ${{ always() }}
        run: |
          {
            echo "## Transcript version purge"
            echo ""
            echo "- Operation: \`$OPERATION\`"
            echo "- See the job log for the inventory manifest, deleted row counts, and backup/snapshot file names."
          } >> "$GITHUB_STEP_SUMMARY"
