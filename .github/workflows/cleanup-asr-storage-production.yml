name: Cleanup ASR Storage Production

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Full 40-character merged master SHA to execute"
        required: true
        type: string
      mode:
        description: "Audit the reclaimable ASR storage, or apply the audited batch"
        required: true
        default: audit
        type: choice
        options:
          - audit
          - apply
      batch_manifest_sha256:
        description: "Batch manifest SHA-256 printed by the approved audit run; required for apply"
        required: false
        type: string
      max_delete_gb:
        description: "Maximum bytes this batch may delete, in GiB"
        required: true
        default: "20"
        type: string
      batch_max_gb:
        description: "Maximum batch size the audited manifest may cover, in GiB"
        required: true
        default: "18"
        type: string
      confirm_cleanup:
        description: "Confirm the destructive ASR storage cleanup"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-gpu-exclusive
  cancel-in-progress: false

jobs:
  cleanup:
    if: ${{ inputs.confirm_cleanup == true }}
    environment: production-asr
    runs-on: [self-hosted, Windows, X64, asr-production]
    timeout-minutes: 120
    env:
      PRODUCTION_ASR_DATA_ROOT: ${{ vars.PRODUCTION_ASR_DATA_ROOT }}
      PRODUCTION_ASR_PROGRAM_ROOT: ${{ vars.PRODUCTION_ASR_PROGRAM_ROOT }}
      PRODUCTION_FASTER_WHISPER_QUALIFICATION_ROOT: ${{ vars.PRODUCTION_FASTER_WHISPER_QUALIFICATION_ROOT }}
      PRODUCTION_QWEN3_ASR_QUALIFICATION_ROOT: ${{ vars.PRODUCTION_QWEN3_ASR_QUALIFICATION_ROOT }}
      PRODUCTION_WHISPERX_ROOT: ${{ vars.PRODUCTION_WHISPERX_ROOT }}
      MODE: ${{ inputs.mode }}
      EXPECTED_BATCH_SHA256: ${{ inputs.batch_manifest_sha256 }}
      MAX_DELETE_GB: ${{ inputs.max_delete_gb }}
      BATCH_MAX_GB: ${{ inputs.batch_max_gb }}
    steps:
      - name: Validate immutable revision and cleanup gate
        shell: powershell
        run: |
          if ("${{ inputs.commit_sha }}" -notmatch '^[0-9a-fA-F]{40}$') { throw "commit_sha must be a full SHA" }
          if ("${{ inputs.commit_sha }}".ToLowerInvariant() -ne "${{ github.sha }}".ToLowerInvariant()) { throw "commit_sha must equal the dispatch revision" }
          if ("${{ github.ref }}" -ne "refs/heads/master") { throw "cleanup must run from master" }
          foreach ($value in @($env:MAX_DELETE_GB, $env:BATCH_MAX_GB)) {
            if ($value -notmatch '^[0-9]{1,3}$') { throw "storage limits must be plain integers" }
          }
          if ([int]$env:BATCH_MAX_GB -gt [int]$env:MAX_DELETE_GB) { throw "batch_max_gb must not exceed max_delete_gb" }
          if ($env:MODE -eq 'apply' -and $env:EXPECTED_BATCH_SHA256 -notmatch '^[0-9a-fA-F]{64}$') { throw "apply requires batch_manifest_sha256" }

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1

      - name: Audit the reclaimable ASR storage
        shell: powershell
        run: |
          $manifest = Join-Path $env:RUNNER_TEMP "asr-storage-batch-${{ github.run_id }}.json"
          $audit = Join-Path $env:RUNNER_TEMP "asr-storage-audit-${{ github.run_id }}.json"
          & "${{ github.workspace }}\scripts\cleanup-asr-storage.ps1" `
            -DataRoot $env:PRODUCTION_ASR_DATA_ROOT `
            -ProgramRoot $env:PRODUCTION_ASR_PROGRAM_ROOT `
            -FasterWhisperQualificationRoot $env:PRODUCTION_FASTER_WHISPER_QUALIFICATION_ROOT `
            -Qwen3AsrQualificationRoot $env:PRODUCTION_QWEN3_ASR_QUALIFICATION_ROOT `
            -WhisperXRoot $env:PRODUCTION_WHISPERX_ROOT `
            -MaxDeleteGB ([int]$env:MAX_DELETE_GB) `
            -BatchMaxGB ([int]$env:BATCH_MAX_GB) `
            -BatchManifestPath $manifest `
            -AuditPath $audit
          # 不要用 $LASTEXITCODE 判断 .ps1 调用是否成功：脚本调用不会更新它，新会话里
          # 它是 $null，`$null -ne 0` 恒为真，使这一步必然失败（实测 audit 已成功打印
          # 摘要仍报 "storage audit failed"）。脚本内部用 throw 终止，真失败会让本步骤
          # 自然失败；这里再校验两份证据文件确实写出。
          if (-not (Test-Path -LiteralPath $manifest -PathType Leaf)) { throw "batch manifest was not written" }
          if (-not (Test-Path -LiteralPath $audit -PathType Leaf)) { throw "storage audit evidence was not written" }
          $sha = (Get-FileHash -LiteralPath $manifest -Algorithm SHA256).Hash.ToLowerInvariant()
          echo "ASR_STORAGE_BATCH_SHA256:$sha" >> $env:GITHUB_STEP_SUMMARY
          Write-Host "ASR_STORAGE_BATCH_SHA256:$sha"
          (Get-Content -LiteralPath $manifest -Raw -Encoding UTF8)

      - name: Apply the audited storage batch
        if: ${{ inputs.mode == 'apply' }}
        shell: powershell
        run: |
          $manifest = Join-Path $env:RUNNER_TEMP "asr-storage-batch-${{ github.run_id }}.json"
          $applyAudit = Join-Path $env:RUNNER_TEMP "asr-storage-apply-${{ github.run_id }}.json"
          $sha = (Get-FileHash -LiteralPath $manifest -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne $env:EXPECTED_BATCH_SHA256.ToLowerInvariant()) {
            throw "storage usage changed since the approved audit; refusing to delete"
          }
          & "${{ github.workspace }}\scripts\cleanup-asr-storage.ps1" `
            -DataRoot $env:PRODUCTION_ASR_DATA_ROOT `
            -ProgramRoot $env:PRODUCTION_ASR_PROGRAM_ROOT `
            -FasterWhisperQualificationRoot $env:PRODUCTION_FASTER_WHISPER_QUALIFICATION_ROOT `
            -Qwen3AsrQualificationRoot $env:PRODUCTION_QWEN3_ASR_QUALIFICATION_ROOT `
            -WhisperXRoot $env:PRODUCTION_WHISPERX_ROOT `
            -MaxDeleteGB ([int]$env:MAX_DELETE_GB) `
            -BatchMaxGB ([int]$env:BATCH_MAX_GB) `
            -BatchManifestPath $manifest `
            -ExpectedBatchManifestSha256 $env:EXPECTED_BATCH_SHA256 `
            -AuditPath $applyAudit `
            -Apply
          # 同上：用证据文件替代不可靠的 $LASTEXITCODE，并核对选中对象确实全部删除。
          if (-not (Test-Path -LiteralPath $applyAudit -PathType Leaf)) { throw "storage cleanup evidence was not written" }
          $applied = Get-Content -LiteralPath $applyAudit -Raw -Encoding UTF8 | ConvertFrom-Json
          $deleted = @($applied.selected_candidates | Where-Object { $_.Deleted }).Count
          if ([int]$applied.selected_count -ne $deleted) {
            throw "only $deleted of $($applied.selected_count) selected candidates were deleted"
          }
          Write-Host "ASR_STORAGE_CLEANUP applied=$deleted bytes=$($applied.selected_bytes)"

      - name: Report free space
        if: ${{ always() }}
        shell: powershell
        run: |
          Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Name -eq 'D' } | ForEach-Object {
            $line = "D: used={0} GB free={1} GB" -f [math]::Round($_.Used / 1GB, 1), [math]::Round($_.Free / 1GB, 2)
            Write-Host $line
            echo $line >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload the audit evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: asr-storage-cleanup-${{ github.run_id }}
          path: ${{ runner.temp }}/asr-storage-*${{ github.run_id }}.json
          if-no-files-found: warn
          retention-days: 30
