name: Diagnose Production App ASR

on:
  workflow_dispatch:
    inputs:
      confirm_diagnostic:
        description: Confirm read-only backend ASR capability diagnostics
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-app-asr-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    if: ${{ inputs.confirm_diagnostic == true }}
    environment: production-asr
    runs-on: [self-hosted, linux, ubuntu, production, app]
    timeout-minutes: 10
    env:
      REPO_PATH: ${{ vars.PRODUCTION_APP_REPO_PATH }}
      COMPOSE_OVERRIDE: ${{ vars.PRODUCTION_APP_COMPOSE_OVERRIDE }}
      COMPOSE_ENV_FILE: ${{ vars.PRODUCTION_APP_ENV_FILE }}
    steps:
      - name: Diagnose running backend ASR capability without mutation
        run: |
          set -euo pipefail
          [ "${{ github.ref }}" = "refs/heads/master" ] || {
            echo "ERROR: production App ASR diagnostics must run from master"
            exit 1
          }
          [ -d "${REPO_PATH}" ] || {
            echo "ERROR: production application repository is unavailable"
            exit 1
          }
          COMPOSE=(docker compose -p ragpincheng-prod \
            -f "${REPO_PATH}/docker/docker-compose.yml" \
            -f "${COMPOSE_OVERRIDE}" --env-file "${COMPOSE_ENV_FILE}")
          "${COMPOSE[@]}" ps -q backend | grep -q . || {
            echo "ERROR: production backend container is not running"
            exit 1
          }
          "${COMPOSE[@]}" exec -T backend python - <<'PY'
          import json

          from api.transcription_runtime import (
              RemoteAsrProviderFactory,
              build_phase4_profile_catalog,
          )
          from src.config import (
              ASR_CONNECT_TIMEOUT_SECONDS,
              ASR_ENABLED,
              ASR_REQUEST_TIMEOUT_SECONDS,
              ASR_SERVICE_TOKEN,
              ASR_SERVICE_URL,
              TRANSCRIPTION_ADMITTED_PROFILE_IDS,
          )
          from src.transcription.profile_catalog import FUNASR_SENSEVOICE_PROVIDER_KEY

          payload = {
              "asr_enabled": ASR_ENABLED,
              "asr_service_url_configured": bool(ASR_SERVICE_URL),
              "asr_service_token_configured": bool(ASR_SERVICE_TOKEN),
              "admitted_profile_ids": sorted(TRANSCRIPTION_ADMITTED_PROFILE_IDS),
              "capabilities": None,
              "capabilities_error_type": None,
              "diagnostics": None,
              "diagnostics_error_type": None,
              "profile_identities": None,
              "profile_identities_error_type": None,
              "profile_states": None,
          }
          capabilities = None
          if ASR_ENABLED and ASR_SERVICE_TOKEN:
              factory = RemoteAsrProviderFactory(
                  ASR_SERVICE_URL,
                  ASR_SERVICE_TOKEN,
                  ASR_CONNECT_TIMEOUT_SECONDS,
                  ASR_REQUEST_TIMEOUT_SECONDS,
                  FUNASR_SENSEVOICE_PROVIDER_KEY,
              )
              try:
                  capabilities = factory.capabilities()
                  payload["capabilities"] = {
                      "api_version": capabilities.api_version,
                      "service_profiles": sorted(capabilities.service_profiles),
                  }
              except Exception as exc:
                  payload["capabilities_error_type"] = type(exc).__name__
              try:
                  diagnostics = factory.diagnostics()
                  payload["diagnostics"] = {
                      "enabled": diagnostics.get("enabled"),
                      "queue_depth": diagnostics.get("queue_depth"),
                      "queue_limit": diagnostics.get("queue_limit"),
                      "pause_reason": diagnostics.get("pause_reason"),
                  }
              except Exception as exc:
                  payload["diagnostics_error_type"] = type(exc).__name__
              try:
                  identities = factory.profile_identities()
                  payload["profile_identities"] = {
                      "schema_version": identities.schema_version,
                      "service_profiles": [
                          item.service_profile_id for item in identities.profiles
                      ],
                  }
              except Exception as exc:
                  payload["profile_identities_error_type"] = type(exc).__name__
          entries = build_phase4_profile_catalog(
              service_enabled=ASR_ENABLED,
              service_healthy=capabilities is not None,
              service_capabilities=capabilities,
              admitted_profile_ids=TRANSCRIPTION_ADMITTED_PROFILE_IDS,
          )
          payload["profile_states"] = {
              entry.profile.profile_id: {
                  "admission": entry.profile.admission.value,
                  "availability": entry.availability.value,
                  "unavailable_reason_code": entry.unavailable_reason_code,
              }
              for entry in entries
          }
          print("APP_ASR_DIAGNOSTIC " + json.dumps(payload, sort_keys=True))
          PY
