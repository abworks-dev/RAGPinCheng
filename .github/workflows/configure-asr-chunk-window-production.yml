name: Configure ASR Chunk Window Production

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Full 40-character merged master SHA to execute"
        required: true
        type: string
      target:
        description: "ASR environment file to update"
        required: true
        default: active-release
        type: choice
        options:
          - active-release
          - legacy
      duration_ms:
        description: "Chunk window duration in milliseconds"
        required: true
        default: "30000"
        type: string
      overlap_ms:
        description: "Chunk window overlap in milliseconds"
        required: true
        default: "500"
        type: string
      operation:
        description: "Generate the preview manifest or apply an approved preview"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - apply
      preview_run_id:
        description: "Preview workflow run ID; required for apply"
        required: false
        type: string
      manifest_sha256:
        description: "Exact preview manifest SHA-256; required for apply"
        required: false
        type: string
      confirm_configuration:
        description: "Confirm the chunk window configuration change"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: production-gpu-exclusive
  cancel-in-progress: false

jobs:
  configure:
    if: ${{ inputs.confirm_configuration == true }}
    runs-on: [self-hosted, Windows, X64, asr-production]
    environment: production-asr
    timeout-minutes: 20
    env:
      PRODUCTION_ASR_DATA_ROOT: ${{ vars.PRODUCTION_ASR_DATA_ROOT }}
      PRODUCTION_ASR_BACKUP_ROOT: ${{ vars.PRODUCTION_ASR_BACKUP_ROOT }}
      TARGET: ${{ inputs.target }}
      DURATION_MS: ${{ inputs.duration_ms }}
      OVERLAP_MS: ${{ inputs.overlap_ms }}
      OPERATION: ${{ inputs.operation }}
      EXPECTED_SHA256: ${{ inputs.manifest_sha256 }}
    steps:
      - name: Validate immutable revision and approved values
        shell: powershell
        run: |
          if ("${{ inputs.commit_sha }}" -notmatch '^[0-9a-fA-F]{40}$') { throw "commit_sha must be a full SHA" }
          if ("${{ inputs.commit_sha }}".ToLowerInvariant() -ne "${{ github.sha }}".ToLowerInvariant()) { throw "commit_sha must equal the dispatch revision" }
          if ("${{ github.ref }}" -ne "refs/heads/master") { throw "chunk window configuration must run from master" }
          if ($env:DURATION_MS -notmatch '^\d{4,6}$' -or [int]$env:DURATION_MS -lt 5000 -or [int]$env:DURATION_MS -gt 120000) { throw "duration_ms is out of range" }
          if ($env:OVERLAP_MS -notmatch '^\d{1,4}$' -or [int]$env:OVERLAP_MS -lt 0 -or [int]$env:OVERLAP_MS -ge [int]$env:DURATION_MS) { throw "overlap_ms is out of range" }
          if ($env:OPERATION -eq "apply" -and ('${{ inputs.preview_run_id }}' -notmatch '^[0-9]{1,20}$' -or $env:EXPECTED_SHA256 -notmatch '^[0-9a-fA-F]{64}$')) {
            throw "apply requires preview_run_id and manifest_sha256"
          }
          if ($env:OPERATION -ne "apply" -and (-not [string]::IsNullOrWhiteSpace('${{ inputs.preview_run_id }}') -or -not [string]::IsNullOrWhiteSpace($env:EXPECTED_SHA256))) {
            throw "preview_run_id and manifest_sha256 are accepted only for apply"
          }

      - name: Check out requested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1

      - name: Download approved preview manifest
        if: ${{ inputs.operation == 'apply' }}
        uses: actions/download-artifact@v4
        with:
          name: asr-chunk-window-${{ inputs.preview_run_id }}
          path: ${{ runner.temp }}/asr-chunk-window
          github-token: ${{ github.token }}
          run-id: ${{ inputs.preview_run_id }}

      - name: Preview or apply the chunk window configuration
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP "asr-chunk-window"
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $manifest = Join-Path $root "manifest.json"
          $common = @{
            Target = $env:TARGET
            DurationMs = [int]$env:DURATION_MS
            OverlapMs = [int]$env:OVERLAP_MS
            DataRoot = $env:PRODUCTION_ASR_DATA_ROOT
            BackupRoot = $env:PRODUCTION_ASR_BACKUP_ROOT
            ManifestPath = $manifest
            OperationId = "${{ github.run_id }}"
          }
          if ($env:OPERATION -eq "preview") {
            & "${{ github.workspace }}\scripts\configure-asr-chunk-window-production.ps1" -Mode Preview @common
            (Get-FileHash -LiteralPath $manifest -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content (Join-Path $root "manifest.sha256") -Encoding ascii
            return
          }
          & "${{ github.workspace }}\scripts\configure-asr-chunk-window-production.ps1" -Mode Apply @common -ExpectedPreviewManifestSha256 $env:EXPECTED_SHA256 -Confirm:$false

      - name: Publish sanitized summary
        if: ${{ always() }}
        shell: powershell
        run: |
          $manifest = Join-Path $env:RUNNER_TEMP "asr-chunk-window/manifest.json"
          if (Test-Path -LiteralPath $manifest -PathType Leaf) {
            $result = Get-Content -LiteralPath $manifest -Raw -Encoding UTF8 | ConvertFrom-Json
            @(
              "## ASR chunk window configuration",
              "",
              "- Operation: ``$env:OPERATION``",
              "- Target: ``$($result.target)``",
              "- Duration: ``$($result.current_duration_ms)`` -> ``$($result.planned_duration_ms)``",
              "- Overlap: ``$($result.current_overlap_ms)`` -> ``$($result.planned_overlap_ms)``"
            ) -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding UTF8
          } else {
            "Chunk window configuration ended before a sanitized plan was written; no change passed the preview gate." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding UTF8
          }

      - name: Upload sanitized evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: asr-chunk-window-${{ github.run_id }}
          path: ${{ runner.temp }}/asr-chunk-window
          if-no-files-found: warn
          retention-days: 30
