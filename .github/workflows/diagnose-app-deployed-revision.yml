name: Diagnose App Deployed Revision

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Full 40-character merged master SHA to inspect"
        required: true
        type: string
      confirm_diagnostic:
        description: "Confirm the read-only deployed revision inspection"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-app-manual-v1
  cancel-in-progress: false

jobs:
  diagnose:
    if: ${{ inputs.confirm_diagnostic == true }}
    environment: production-asr
    runs-on: [self-hosted, linux, ubuntu, production, app]
    timeout-minutes: 15
    env:
      COMPOSE_OVERRIDE: ${{ vars.PRODUCTION_APP_COMPOSE_OVERRIDE }}
      COMPOSE_ENV_FILE: ${{ vars.PRODUCTION_APP_ENV_FILE }}
      REPO_PATH: ${{ vars.PRODUCTION_APP_REPO_PATH }}
    steps:
      - name: Validate immutable revision and diagnostic gate
        run: |
          if [[ ! "${{ inputs.commit_sha }}" =~ ^[0-9a-fA-F]{40}$ ]]; then echo "commit_sha must be a full SHA"; exit 1; fi
          if [[ "${{ inputs.commit_sha }}" != "${{ github.sha }}" ]]; then echo "commit_sha must equal the dispatch revision"; exit 1; fi
          if [[ "${{ github.ref }}" != "refs/heads/master" ]]; then echo "diagnostic must run from master"; exit 1; fi

      - name: Check out requested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1

      - name: Compare the running backend markers with the requested revision
        run: |
          set -euo pipefail
          COMPOSE=(docker compose -p ragpincheng-prod \
            -f "${REPO_PATH}/docker/docker-compose.yml" \
            -f "${COMPOSE_OVERRIDE}" --env-file "${COMPOSE_ENV_FILE}")
          "${COMPOSE[@]}" ps -q backend | grep -q . || { echo "production backend container is not running"; exit 1; }
          "${COMPOSE[@]}" exec -T backend python - <<'PY' | tee "$RUNNER_TEMP/deployed-markers.txt"
          import hashlib
          import importlib.util
          import inspect
          import json
          from pathlib import Path

          MARKERS = {
              "prompt_echo_guard_module": ("api/transcript_prompt_echo_guard.py", None),
              "publication_calls_guard": ("api/transcription_publication.py", "assert_publishable"),
              "routes_block_on_echo": ("api/routes_transcription.py", "PromptEchoPublicationBlocked"),
              "content_routes_block_on_echo": ("api/routes_content.py", "PromptEchoPublicationBlocked"),
              "retry_allows_permanent_retranscribe": ("api/routes_admin.py", "re_transcribe"),
              "remote_provider_reenqueues_paused": ("src/transcription/remote_provider.py", "paused"),
              "scheduler_chunk_window_default": ("services/asr_service/scheduler.py", "DEFAULT_CHUNK_DURATION_MS = 120_000"),
              "audio_decodes_with_pyav": ("services/asr_service/audio.py", "decode_audio_samples"),
          }

          report = {"schema_version": "app-deployed-revision/1", "read_only": True, "markers": {}}
          for name, (relative, needle) in MARKERS.items():
              path = Path("/app") / relative
              if not path.is_file():
                  report["markers"][name] = {"present": False, "reason": "file missing in image"}
                  continue
              text = path.read_text(encoding="utf-8", errors="replace")
              entry = {
                  "present": True,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  "needle_found": True if needle is None else needle in text,
              }
              report["markers"][name] = entry

          report["guard_importable"] = importlib.util.find_spec("api.transcript_prompt_echo_guard") is not None
          try:
              import api.transcription_publication as publication

              report["publication_has_guard_import"] = (
                  "transcript_prompt_echo_guard" in inspect.getsource(publication)
              )
          except Exception as exc:  # pragma: no cover - diagnostic only
              report["publication_import_error"] = f"{type(exc).__name__}: {exc}"[:200]

          print("APP_DEPLOYED_MARKERS:" + json.dumps(report, ensure_ascii=False, sort_keys=True))
          PY

      - name: Inspect the container registry path read-only
        if: ${{ always() }}
        run: |
          set -uo pipefail
          echo ">> /etc/resolv.conf"
          cat /etc/resolv.conf 2>/dev/null || echo "resolv.conf unreadable"
          echo ">> resolvectl status (head)"
          resolvectl status 2>/dev/null | head -20 || echo "resolvectl unavailable"
          for host in docker.m.daocloud.io registry-1.docker.io docker.io; do
            echo ">> getent hosts ${host}"
            getent hosts "${host}" || echo "getent failed for ${host}"
          done
          echo ">> resolver comparison (1.1.1.1)"
          getent hosts docker.m.daocloud.io >/dev/null 2>&1 && echo "system resolver OK" || echo "system resolver FAILED"
          (command -v dig >/dev/null && dig +short +time=3 +tries=1 docker.m.daocloud.io @1.1.1.1) || echo "dig unavailable"
          echo ">> docker daemon registry configuration (values only, no credentials)"
          python3 - <<'PY' || true
          import json, pathlib
          path = pathlib.Path("/etc/docker/daemon.json")
          try:
              data = json.loads(path.read_text(encoding="utf-8"))
          except Exception as exc:
              print(f"daemon.json unavailable: {type(exc).__name__}: {exc}")
              raise SystemExit
          allowed = ("registry-mirrors", "insecure-registries", "dns", "max-concurrent-downloads")
          print(json.dumps({k: data[k] for k in allowed if k in data}, ensure_ascii=False))
          PY
          echo ">> docker info registry mirrors"
          docker info --format '{{json .RegistryConfig.Mirrors}}' 2>/dev/null || echo "docker info unavailable"
          echo ">> locally available base images"
          docker images --format '{{.Repository}}:{{.Tag}} {{.ID}}' 2>/dev/null | grep -E '^(ubuntu|pincheng-libreoffice|python)' || echo "no matching local images"

      - name: Publish sanitized summary
        if: ${{ always() }}
        run: |
          echo "Read-only deployed revision marker check; see the job log line prefixed APP_DEPLOYED_MARKERS. No production state was modified." >> "$GITHUB_STEP_SUMMARY"
          echo "Read-only container registry inspection; see the 'Inspect the container registry path read-only' step log. No production state was modified." >> "$GITHUB_STEP_SUMMARY"
