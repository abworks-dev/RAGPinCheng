name: Cleanup Production Current Only

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full merged master SHA containing the reviewed cleanup implementation
        required: true
        type: string
      operation:
        description: Preview first; apply only the exact reviewed manifest
        required: true
        default: preview
        type: choice
        options: [preview, apply]
      expected_asr_candidate_id:
        description: Exact current live ASR candidate to retain
        required: true
        type: string
      expected_gpu_release_id:
        description: Exact current live GPU runtime release to retain
        required: true
        type: string
      preview_run_id:
        description: Preview run containing the approved manifest (apply only)
        required: false
        type: string
      preview_artifact_name:
        description: Exact attempt-aware preview artifact name (apply only)
        required: false
        type: string
      manifest_sha256:
        description: Exact manifest file SHA-256 from preview (apply only)
        required: false
        type: string
      confirm_no_backup:
        description: Confirm production deletion without backup or old-version rollback
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: production-gpu-exclusive
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: [self-hosted, Windows, X64, asr-production]
    environment: production-asr
    timeout-minutes: 120
    env:
      EXPECTED_COMMIT: ${{ inputs.commit_sha }}
      OPERATION: ${{ inputs.operation }}
      EXPECTED_ASR: ${{ inputs.expected_asr_candidate_id }}
      EXPECTED_GPU: ${{ inputs.expected_gpu_release_id }}
      PREVIEW_RUN_ID: ${{ inputs.preview_run_id }}
      PREVIEW_ARTIFACT: ${{ inputs.preview_artifact_name }}
      MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
      CONFIRM_NO_BACKUP: ${{ inputs.confirm_no_backup }}
      ASR_DATA_ROOT: ${{ vars.PRODUCTION_ASR_DATA_ROOT }}
      ASR_PROGRAM_ROOT: ${{ vars.PRODUCTION_ASR_PROGRAM_ROOT }}
      RUNTIME_ROOT: ${{ vars.PRODUCTION_RUNTIME_ROOT }}
      WHISPERX_ROOT: ${{ vars.PRODUCTION_WHISPERX_ROOT }}
      FASTER_WHISPER_ROOT: ${{ vars.PRODUCTION_FASTER_WHISPER_QUALIFICATION_ROOT }}
      QWEN3_ASR_ROOT: ${{ vars.PRODUCTION_QWEN3_ASR_QUALIFICATION_ROOT }}
      GPU_MODEL_CACHE_ROOT: ${{ vars.GPU_MODEL_CACHE_SOURCE }}
      ASR_SERVICE_BASE_URL: ${{ vars.PRODUCTION_ASR_SERVICE_URL }}
      GPU_SERVICE_BASE_URL: ${{ vars.GPU_SERVICE_URL }}
    steps:
      - name: Validate immutable revision and no-backup gate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -ne 'refs/heads/master') { throw 'Cleanup must run from merged master' }
          if ($env:EXPECTED_COMMIT -notmatch '^[0-9a-f]{40}$' -or $env:EXPECTED_COMMIT -ne $env:GITHUB_SHA) { throw 'Dispatch SHA must equal the reviewed immutable commit' }
          if ($env:EXPECTED_ASR -notmatch '^[0-9]{1,20}$' -or $env:EXPECTED_GPU -notmatch '^[0-9a-f]{12}-[0-9a-f]{12}$') { throw 'Invalid pinned live identities' }
          if ($env:OPERATION -eq 'apply') {
            if ($env:CONFIRM_NO_BACKUP -ne 'true') { throw 'Apply requires explicit no-backup confirmation' }
            if ($env:PREVIEW_RUN_ID -notmatch '^[0-9]{1,20}$' -or $env:MANIFEST_SHA256 -notmatch '^[0-9a-f]{64}$') { throw 'Apply requires preview run and manifest SHA-256' }
            if ($env:PREVIEW_ARTIFACT -notmatch ('^production-current-only-' + [regex]::Escape($env:PREVIEW_RUN_ID) + '-[0-9]+-preview$')) { throw 'Invalid exact preview artifact name' }
          }

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1

      - name: Verify successful preview provenance
        if: inputs.operation == 'apply'
        shell: powershell
        env:
          WORKFLOW_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:PREVIEW_RUN_ID -notmatch '^[0-9]{1,20}$') { throw 'Invalid preview run ID' }
          $headers = @{ Authorization = 'Bearer ' + $env:WORKFLOW_TOKEN; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $url = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:PREVIEW_RUN_ID"
          try { $run = Invoke-RestMethod -Uri $url -Headers $headers -Method Get -TimeoutSec 30 }
          catch { throw 'Unable to verify preview provenance; refusing cleanup' }
          if ($run.conclusion -ne 'success' -or $run.event -ne 'workflow_dispatch' -or
              $run.head_sha -ne $env:EXPECTED_COMMIT -or $run.head_branch -ne 'master' -or
              $run.path -ne '.github/workflows/cleanup-production-current-only.yml') {
            throw 'Preview must be successful manual execution of the same reviewed master implementation'
          }

      - name: Download exact preview manifest
        if: inputs.operation == 'apply'
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.preview_artifact_name }}
          path: ${{ runner.temp }}/current-only-approved-${{ github.run_id }}-${{ github.run_attempt }}
          github-token: ${{ github.token }}
          run-id: ${{ inputs.preview_run_id }}

      - name: Preview or apply current-only cleanup
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $reportRoot = Join-Path $env:RUNNER_TEMP 'current-only-${{ github.run_id }}-${{ github.run_attempt }}'
          New-Item -ItemType Directory -Path $reportRoot -Force | Out-Null
          $arguments = @{
            Mode = if ($env:OPERATION -eq 'apply') { 'Apply' } else { 'Preview' }
            AsrDataRoot = $env:ASR_DATA_ROOT
            AsrProgramRoot = $env:ASR_PROGRAM_ROOT
            RuntimeRoot = $env:RUNTIME_ROOT
            WhisperXRoot = $env:WHISPERX_ROOT
            FasterWhisperQualificationRoot = $env:FASTER_WHISPER_ROOT
            Qwen3AsrQualificationRoot = $env:QWEN3_ASR_ROOT
            GpuConfiguredModelCachePath = $env:GPU_MODEL_CACHE_ROOT
            ExpectedAsrCandidateId = $env:EXPECTED_ASR
            ExpectedGpuReleaseId = $env:EXPECTED_GPU
            ManifestPath = Join-Path $reportRoot 'manifest.json'
            AuditPath = Join-Path $reportRoot 'audit.json'
            MaxDeleteGB = 600
            AsrHealthUrl = $env:ASR_SERVICE_BASE_URL.TrimEnd('/') + '/health'
            GpuHealthUrl = $env:GPU_SERVICE_BASE_URL.TrimEnd('/') + '/health'
          }
          if ($env:OPERATION -eq 'apply') {
            $approvedRoot = Join-Path $env:RUNNER_TEMP 'current-only-approved-${{ github.run_id }}-${{ github.run_attempt }}'
            $approved = Join-Path $approvedRoot 'manifest.json'
            if (-not (Test-Path -LiteralPath $approved -PathType Leaf)) { throw 'Approved manifest missing' }
            Copy-Item -LiteralPath $approved -Destination $arguments.ManifestPath
            $arguments.ExpectedManifestSha256 = $env:MANIFEST_SHA256
            $arguments.ConfirmNoBackup = $true
          }
          & .\scripts\cleanup-production-current-only.ps1 @arguments
          if ($env:OPERATION -eq 'preview') {
            $sha = (Get-FileHash -LiteralPath $arguments.ManifestPath -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Host "CURRENT_ONLY_MANIFEST_SHA256:$sha"
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "CURRENT_ONLY_MANIFEST_SHA256:$sha"
            Get-Content -LiteralPath $arguments.ManifestPath -Raw -Encoding UTF8
          }

      - name: Report individual unauthenticated health evidence
        if: always()
        shell: powershell
        run: |
          # Binding evidence only; the actual guard checks the validated configured local interface.
          foreach ($service in @(@{name='asr';port=8200},@{name='gpu';port=8100})) {
            $row = [ordered]@{ service=$service.name; scope='loopback-only'; http_status=$null; status=$null; api_version=$null; model_loaded=$null; error_type=$null }
            try {
              $response = Invoke-WebRequest -UseBasicParsing -Uri ('http://127.0.0.1:{0}/health' -f $service.port) -Method Get -TimeoutSec 10 -MaximumRedirection 0
              $row.http_status = [int]$response.StatusCode
              $body = $response.Content | ConvertFrom-Json
              foreach ($field in @('status','api_version','model_loaded')) {
                if ($body.PSObject.Properties[$field]) { $row[$field] = $body.$field }
              }
            } catch {
              $row.error_type = $_.Exception.GetType().Name
              if ($_.Exception.PSObject.Properties['Response'] -and $_.Exception.Response) {
                $row.http_status = [int]$_.Exception.Response.StatusCode
              }
            }
            $line = 'CURRENT_ONLY_HEALTH ' + ($row | ConvertTo-Json -Compress)
            Write-Host $line
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $line
          }

      - name: Report physical disk usage
        if: always()
        shell: powershell
        run: |
          Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Name -eq 'D' } | ForEach-Object {
            $line = 'D: used={0:N2} GiB free={1:N2} GiB' -f ($_.Used / 1GB), ($_.Free / 1GB)
            Write-Host $line
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $line
          }

      - name: Upload immutable cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-current-only-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.operation }}
          path: ${{ runner.temp }}/current-only-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 90
