name: Diagnose GPU Runtime Production

on:
  workflow_dispatch:
    inputs:
      confirm_diagnostic:
        description: "Confirm read-only PyTorch/CUDA runtime diagnostics on the GPU host"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  diagnose:
    environment: production-asr
    runs-on: [self-hosted, windows, production, gpu]
    timeout-minutes: 10
    steps:
      - name: Run bounded PyTorch and CUDA diagnostics
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          if (-not [System.Convert]::ToBoolean("${{ inputs.confirm_diagnostic }}")) {
            throw "confirm_diagnostic must be explicitly enabled"
          }

          $Python = "C:\Program Files\Python310\python.exe"
          if (-not (Test-Path -LiteralPath $Python -PathType Leaf)) {
            throw "GPU Python executable is missing"
          }
          $diagnosticRoot = Join-Path "${{ runner.temp }}" "gpu-runtime-diagnostic-${{ github.run_id }}"
          New-Item -ItemType Directory -Path $diagnosticRoot -Force | Out-Null

          function Invoke-ReadOnlyProbe {
            param(
              [Parameter(Mandatory = $true)][string]$Name,
              [Parameter(Mandatory = $true)][string]$FilePath,
              [Parameter(Mandatory = $true)][string]$ArgumentLine
            )
            $stdout = Join-Path $diagnosticRoot "$Name.stdout.log"
            $stderr = Join-Path $diagnosticRoot "$Name.stderr.log"
            $process = Start-Process `
              -FilePath $FilePath `
              -ArgumentList $ArgumentLine `
              -RedirectStandardOutput $stdout `
              -RedirectStandardError $stderr `
              -WindowStyle Hidden `
              -PassThru
            if (-not $process.WaitForExit(60000)) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              throw "GPU_RUNTIME_PROBE name=$Name status=timeout"
            }
            $output = @(
              Get-Content -LiteralPath $stdout -ErrorAction SilentlyContinue
              Get-Content -LiteralPath $stderr -ErrorAction SilentlyContinue
            ) | Where-Object { $_ -match '\S' }
            foreach ($line in $output) {
              $safeLine = $line -replace '(?i)(https?://)[^/\s:@]+:[^@\s]+@', '$1[REDACTED]@'
              Write-Host "GPU_RUNTIME_PROBE name=$Name $safeLine"
            }
            Write-Host "GPU_RUNTIME_PROBE name=$Name exit_code=$($process.ExitCode)"
            return [int]$process.ExitCode
          }

          $results = @()
          $results += Invoke-ReadOnlyProbe `
            -Name "nvidia_smi" `
            -FilePath "nvidia-smi.exe" `
            -ArgumentLine "--query-gpu=name,driver_version,cuda_version,memory.total --format=csv,noheader"
          $results += Invoke-ReadOnlyProbe `
            -Name "torch_import" `
            -FilePath $Python `
            -ArgumentLine '-X faulthandler -c "import torch; print(''torch='' + torch.__version__); print(''cuda_available='' + str(torch.cuda.is_available()))"'
          $results += Invoke-ReadOnlyProbe `
            -Name "cuda_tensor" `
            -FilePath $Python `
            -ArgumentLine '-X faulthandler -c "import torch; assert torch.cuda.is_available(); x=torch.ones(1,device=''cuda''); torch.cuda.synchronize(); print(''device='' + torch.cuda.get_device_name(0)); print(''tensor_device='' + str(x.device))"'
          $results += Invoke-ReadOnlyProbe `
            -Name "flag_embedding_import" `
            -FilePath $Python `
            -ArgumentLine '-X faulthandler -c "import FlagEmbedding; print(''flag_embedding_import=ok'')"'

          if (@($results | Where-Object { $_ -ne 0 }).Count -ne 0) {
            throw "One or more read-only GPU runtime probes failed"
          }
