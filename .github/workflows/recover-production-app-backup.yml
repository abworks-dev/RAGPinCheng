name: Recover Production App From Approved Backup

on:
  workflow_dispatch:
    inputs:
      confirm_recovery:
        description: Type RESTORE_APP_ONLY_31552723068_1 to restore the approved backup
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-app-manual-v1
  cancel-in-progress: false

jobs:
  recover-app:
    environment: production-asr
    runs-on: [self-hosted, linux, ubuntu, production, app]
    timeout-minutes: 15
    env:
      REPO_PATH: ${{ vars.PRODUCTION_APP_REPO_PATH }}
      BACKUP_DIR: ${{ vars.PRODUCTION_APP_BACKUP_DIRECTORY }}
      DATA_PATH: ${{ vars.PRODUCTION_APP_DATA_PATH }}
      CONTENT_HOST_PATH: ${{ vars.PRODUCTION_CONTENT_ROOT }}
      COMPOSE_OVERRIDE: ${{ vars.PRODUCTION_APP_COMPOSE_OVERRIDE }}
      COMPOSE_ENV_FILE: ${{ vars.PRODUCTION_APP_ENV_FILE }}
      DOCS_HOST_PATH: ${{ vars.PRODUCTION_DOCS_HOST_PATH }}
      MEDIA_HOST_PATH: ${{ vars.PRODUCTION_MEDIA_HOST_PATH }}
      SOURCE_DECOUPLING_COMPLETE: ${{ vars.SOURCE_DECOUPLING_COMPLETE }}
      CONFIRM_RECOVERY: ${{ inputs.confirm_recovery }}
    steps:
      - name: Restore approved databases and previous backend image
        run: |
          set -euo pipefail

          [ "${CONFIRM_RECOVERY}" = "RESTORE_APP_ONLY_31552723068_1" ] || {
            echo "ERROR: approved production recovery was not confirmed"
            exit 1
          }
          BACKUP_PATH="${BACKUP_DIR}/app-only-31552723068-1"
          [ -d "${BACKUP_PATH}" ] || { echo "ERROR: approved backup is missing"; exit 1; }
          cd "${REPO_PATH}"
          if [ "${SOURCE_DECOUPLING_COMPLETE:-false}" = "true" ]; then
            SANITIZED_OVERRIDE="${BACKUP_DIR}/.compose-private-source-decoupled-recovery-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
            docker compose -f "${COMPOSE_OVERRIDE}" --env-file "${COMPOSE_ENV_FILE}" \
              config --no-interpolate --no-env-resolution --no-consistency --format json \
              | python3 scripts/sanitize_source_decoupled_override.py \
                  > "${SANITIZED_OVERRIDE}.tmp"
            mv "${SANITIZED_OVERRIDE}.tmp" "${SANITIZED_OVERRIDE}"
            COMPOSE_OVERRIDE="${SANITIZED_OVERRIDE}"
            export COMPOSE_OVERRIDE
          fi
          COMPOSE_FILES=(-f docker/docker-compose.yml -f "${COMPOSE_OVERRIDE}")
          case "${SOURCE_DECOUPLING_COMPLETE:-false}" in
            true)
              [ "${MEDIA_HOST_PATH}" = "/data/business/ragpincheng/content/media" ]
              SOURCE_DECOUPLED_COMPOSE="${REPO_PATH}/docker/compose.source-decoupled.yml"
              [ -f "${SOURCE_DECOUPLED_COMPOSE}" ] || {
                echo "ERROR: source-decoupled Compose overlay is missing"
                exit 1
              }
              COMPOSE_FILES+=(-f "${SOURCE_DECOUPLED_COMPOSE}")
              ;;
            false|"") ;;
            *)
              echo "ERROR: SOURCE_DECOUPLING_COMPLETE must be true or false"
              exit 1
              ;;
          esac
          COMPOSE=(docker compose -p ragpincheng-prod \
            "${COMPOSE_FILES[@]}" --env-file "${COMPOSE_ENV_FILE}")

          OLD_IMAGE_ID="$(tr -d '\r\n' < "${BACKUP_PATH}/backend-image.txt")"
          [[ "${OLD_IMAGE_ID}" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "ERROR: approved backup image identity is invalid"
            exit 1
          }
          docker image inspect "${OLD_IMAGE_ID}" >/dev/null

          SRC="${BACKUP_PATH}" python3 - <<'PY'
          import os
          import sqlite3
          from pathlib import Path

          source_dir = Path(os.environ["SRC"])
          for name in ("app.sqlite", "parents.sqlite"):
              path = source_dir / name
              if not path.is_file():
                  raise SystemExit(f"missing approved backup database: {name}")
              with sqlite3.connect(f"file:{path}?mode=ro", uri=True) as database:
                  result = database.execute("PRAGMA integrity_check").fetchone()[0]
              if result != "ok":
                  raise SystemExit(f"{name} backup integrity failed: {result}")
          print("APP_BACKUP_RECOVERY status=validated databases=app.sqlite,parents.sqlite")
          PY

          "${COMPOSE[@]}" stop backend
          SRC="${BACKUP_PATH}" DST="${DATA_PATH}" python3 - <<'PY'
          import os
          import shutil
          import sqlite3
          from pathlib import Path

          source_dir = Path(os.environ["SRC"])
          target_dir = Path(os.environ["DST"])
          staged = []
          try:
              for name in ("app.sqlite", "parents.sqlite"):
                  source = source_dir / name
                  target = target_dir / name
                  temporary = target.with_name(f".{name}.approved-recovery-{os.getpid()}.tmp")
                  shutil.copy2(source, temporary)
                  with sqlite3.connect(f"file:{temporary}?mode=ro", uri=True) as database:
                      result = database.execute("PRAGMA integrity_check").fetchone()[0]
                  if result != "ok":
                      raise RuntimeError(f"{name} staged integrity failed: {result}")
                  staged.append((temporary, target))
              for temporary, target in staged:
                  os.replace(temporary, target)
          finally:
              for temporary, _target in staged:
                  temporary.unlink(missing_ok=True)
          print("APP_BACKUP_RECOVERY status=restored databases=app.sqlite,parents.sqlite")
          PY

          docker tag "${OLD_IMAGE_ID}" pincheng-rag-backend:latest
          "${COMPOSE[@]}" up -d --no-deps --force-recreate backend
          for ATTEMPT in $(seq 1 36); do
            CONTAINER_ID="$("${COMPOSE[@]}" ps -q backend)"
            HEALTH_STATUS="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "${CONTAINER_ID}" 2>/dev/null || true)"
            RUNNING_IMAGE_ID="$(docker inspect --format '{{.Image}}' "${CONTAINER_ID}" 2>/dev/null || true)"
            if [ "${HEALTH_STATUS}" = "healthy" ] && [ "${RUNNING_IMAGE_ID}" = "${OLD_IMAGE_ID}" ] && \
              curl -fsS --connect-timeout 5 --max-time 10 http://localhost/api/health | \
              python3 -c 'import json,sys; assert json.load(sys.stdin).get("status") == "ok"'; then
              "${COMPOSE[@]}" exec -T backend python - <<'PY'
          from api.db import connect
          from api.db_migrations import CURRENT_SCHEMA_VERSION
          assert CURRENT_SCHEMA_VERSION == 5
          with connect() as database:
              version = database.execute("SELECT max(version) FROM app_schema_migrations").fetchone()[0]
          assert version == CURRENT_SCHEMA_VERSION
          print("APP_BACKUP_RECOVERY status=verified schema=5")
          PY
              echo "APP_BACKUP_RECOVERY status=complete image=${OLD_IMAGE_ID}"
              exit 0
            fi
            sleep 5
          done
          "${COMPOSE[@]}" ps backend || true
          CONTAINER_ID="$("${COMPOSE[@]}" ps -aq backend)"
          if [ -n "${CONTAINER_ID}" ]; then
            docker inspect --format 'APP_BACKUP_RECOVERY container_status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{end}} exit={{.State.ExitCode}} error={{.State.Error}}' "${CONTAINER_ID}" || true
            "${COMPOSE[@]}" logs --no-color --tail 200 backend || true
          fi
          echo "CRITICAL: approved App backup recovery did not become healthy"
          exit 1
