name: Recover GPU Service Production

on:
  workflow_dispatch:
    inputs:
      confirm_recovery:
        description: Confirm restart of the current validated GPU release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-gpu-exclusive
  cancel-in-progress: false

jobs:
  recover:
    if: ${{ inputs.confirm_recovery == true }}
    environment: production-asr
    runs-on: [self-hosted, windows, production, gpu]
    timeout-minutes: 10
    steps:
      - name: Restart the current validated GPU release
        shell: powershell
        env:
          GPU_SERVICE_TOKEN: ${{ secrets.GPU_SERVICE_TOKEN }}
          REPO_PATH: ${{ vars.PRODUCTION_REPO_PATH }}
          RUNTIME_ROOT: ${{ vars.PRODUCTION_RUNTIME_ROOT }}
          BACKUP_DIR: ${{ vars.PRODUCTION_BACKUP_DIRECTORY }}
          GPU_SERVICE_URL: ${{ vars.GPU_SERVICE_URL }}
          GPU_SERVICE_HOST: ${{ vars.GPU_SERVICE_HOST }}
          GPU_MODEL_CACHE_SOURCE: ${{ vars.GPU_MODEL_CACHE_SOURCE }}
          GPU_BASE_PYTHON: ${{ vars.PRODUCTION_GPU_PYTHON_PATH }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          if (-not [Convert]::ToBoolean("${{ inputs.confirm_recovery }}")) {
            throw "confirm_recovery must be explicitly enabled"
          }
          if ([string]::IsNullOrWhiteSpace($env:GPU_SERVICE_TOKEN)) {
            throw "GPU_SERVICE_TOKEN is required"
          }
          $currentPath = Join-Path $env:RUNTIME_ROOT "current-release.json"
          if (-not (Test-Path -LiteralPath $currentPath -PathType Leaf)) {
            throw "No validated current GPU release is recorded"
          }
          $current = Get-Content -LiteralPath $currentPath -Encoding UTF8 | ConvertFrom-Json
          try {
            & "${env:REPO_PATH}\scripts\promote-gpu-runtime.ps1" `
              -RepositoryPath $env:REPO_PATH -RuntimeRoot $env:RUNTIME_ROOT -BackupDirectory $env:BACKUP_DIR `
              -ReleaseRoot ([string]$current.release_root) -GpuServiceToken $env:GPU_SERVICE_TOKEN
          } catch {
            & "${env:REPO_PATH}\scripts\restore-gpu-legacy-release.ps1" `
              -ReleaseRoot ([string]$current.release_root) -RuntimeRoot $env:RUNTIME_ROOT `
              -GpuServiceToken $env:GPU_SERVICE_TOKEN -GpuServiceUrl $env:GPU_SERVICE_URL `
              -GpuServiceHost $env:GPU_SERVICE_HOST -BasePython $env:GPU_BASE_PYTHON `
              -RepositoryPath $env:REPO_PATH -ModelCacheSource $env:GPU_MODEL_CACHE_SOURCE
          }
