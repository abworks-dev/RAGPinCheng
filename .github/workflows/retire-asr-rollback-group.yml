name: Retire ASR Rollback Group

on:
  workflow_dispatch:
    inputs:
      candidate_id:
        description: Exact approved candidate workflow run ID
        required: true
        type: string
      activation_id:
        description: Exact approved activation workflow run ID
        required: true
        type: string
      operation:
        description: Generate preview manifest or apply an approved preview
        required: true
        default: preview
        type: choice
        options: [preview, apply]
      preview_run_id:
        description: Preview workflow run ID; required for apply
        required: false
        type: string
      manifest_sha256:
        description: Exact preview manifest SHA-256; required for apply
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: production-gpu-exclusive
  cancel-in-progress: false

jobs:
  retire:
    runs-on: [self-hosted, windows, production, gpu]
    environment: production-asr
    timeout-minutes: 45
    env:
      ASR_DATA_ROOT: ${{ vars.PRODUCTION_ASR_DATA_ROOT }}
      ASR_PROGRAM_ROOT: ${{ vars.PRODUCTION_ASR_PROGRAM_ROOT }}
      ASR_BACKUP_ROOT: ${{ vars.PRODUCTION_ASR_BACKUP_ROOT }}
      CANDIDATE_ID: ${{ inputs.candidate_id }}
      ACTIVATION_ID: ${{ inputs.activation_id }}
      OPERATION: ${{ inputs.operation }}
      EXPECTED_SHA256: ${{ inputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact approved group
        shell: powershell
        run: |
          $approved = @{
            '31512225203' = '31513770886'
            '31516434826' = '31517785623'
            '31877287791' = '31877991737'
          }
          if (-not $approved.ContainsKey($env:CANDIDATE_ID) -or $approved[$env:CANDIDATE_ID] -ne $env:ACTIVATION_ID) { throw 'Requested group is outside the approved retirement boundary' }
          if ($env:OPERATION -eq 'apply' -and ('${{ inputs.preview_run_id }}' -notmatch '^[0-9]{1,20}$' -or $env:EXPECTED_SHA256 -notmatch '^[0-9a-fA-F]{64}$')) { throw 'apply requires preview_run_id and manifest_sha256' }
      - name: Download approved manifest
        if: ${{ inputs.operation == 'apply' }}
        uses: actions/download-artifact@v4
        with:
          name: asr-rollback-retirement-${{ inputs.preview_run_id }}
          path: ${{ runner.temp }}/asr-rollback-retirement
          github-token: ${{ github.token }}
          run-id: ${{ inputs.preview_run_id }}
      - name: Preview or apply rollback group retirement
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $reportRoot = Join-Path $env:RUNNER_TEMP 'asr-rollback-retirement'
          New-Item -ItemType Directory -Path $reportRoot -Force | Out-Null
          $manifest = Join-Path $reportRoot 'manifest.json'
          $common = @{ CandidateId=$env:CANDIDATE_ID; ActivationId=$env:ACTIVATION_ID; DataRoot=$env:ASR_DATA_ROOT; ProgramRoot=$env:ASR_PROGRAM_ROOT; BackupRoot=$env:ASR_BACKUP_ROOT; ManifestPath=$manifest; OperationId='${{ github.run_id }}' }
          if ($env:OPERATION -eq 'preview') {
            & .\scripts\retire-asr-rollback-group.ps1 -Mode Preview @common
            (Get-FileHash -LiteralPath $manifest -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content (Join-Path $reportRoot 'manifest.sha256') -Encoding ascii
            return
          }
          try {
            & .\scripts\retire-asr-rollback-group.ps1 -Mode Quarantine @common -ExpectedManifestSha256 $env:EXPECTED_SHA256 -Confirm:$false
            . .\scripts\asr-release.ps1
            $active = Get-Content (Join-Path $env:ASR_DATA_ROOT 'release-state\active.json') -Raw -Encoding UTF8 | ConvertFrom-Json
            if ([string]$active.candidate_id -ne '31879196389') { throw 'Active candidate changed outside the approved production identity' }
            $release = Read-AsrReleaseManifest -ProgramRoot $env:ASR_PROGRAM_ROOT -DataRoot $env:ASR_DATA_ROOT -CandidateId ([string]$active.candidate_id) -ExpectedSha256 ([string]$active.release_manifest_sha256)
            $approved = Get-Content -LiteralPath $manifest -Raw -Encoding UTF8 | ConvertFrom-Json
            $task = Get-ScheduledTask -TaskName 'RAGPinCheng-ASR' -ErrorAction Stop
            $action = @($task.Actions)
            if ($action.Count -ne 1) { throw 'ASR Scheduled Task action count changed' }
            $identity = [ordered]@{ task_name=[string]$task.TaskName; task_path=[string]$task.TaskPath; execute=[string]$action[0].Execute; arguments=[string]$action[0].Arguments; user_id=[string]$task.Principal.UserId; logon_type=[string]$task.Principal.LogonType; run_level=[string]$task.Principal.RunLevel }
            if (($approved.scheduled_task | ConvertTo-Json -Compress) -ne ($identity | ConvertTo-Json -Compress)) { throw 'ASR Scheduled Task identity changed during retirement' }
            & .\scripts\verify-asr-service.ps1 -DataRoot $env:ASR_DATA_ROOT -ConfigPath $release.layout.config_path -ExpectedProfiles @($release.manifest.expected_profiles)
            & .\scripts\retire-asr-rollback-group.ps1 -Mode Finalize @common -Confirm:$false
          } catch {
            & .\scripts\retire-asr-rollback-group.ps1 -Mode Restore @common -Confirm:$false
            throw
          }
      - name: Upload retirement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asr-rollback-retirement-${{ github.run_id }}
          path: ${{ runner.temp }}/asr-rollback-retirement
          if-no-files-found: warn
