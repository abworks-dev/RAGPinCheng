# Production deployment — two-node topology
#
# 1. deploy-gpu:  Windows GPU host  — update inference service
# 2. deploy-app:  Ubuntu app host   — update backend + Qdrant (depends on 1)
#
# Triggered by:
#   - CI success on master (auto)
#   - workflow_dispatch (manual)

name: Deploy production

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: Confirm deployment of origin/master to production
        required: true
        type: boolean
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  # ── Job 1: Windows GPU inference service ────────────────────────────────
  deploy-gpu:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.confirm_production == true) || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    runs-on:
      - self-hosted
      - windows
      - production
      - gpu
    timeout-minutes: 30

    steps:
      - name: Deploy GPU inference service
        shell: powershell
        env:
          DEPLOY_HTTP_PROXY: ${{ vars.DEPLOY_HTTP_PROXY }}
          GPU_SERVICE_TOKEN: ${{ secrets.GPU_SERVICE_TOKEN }}
          REPO_PATH: D:\RAGPinCheng
          BACKUP_DIR: D:\RAGBackups
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          # Bootstrap the runner checkout before invoking the repository script.
          # The HTTP header is process-local; origin and .git/config are untouched.
          Set-Location $env:REPO_PATH
          $basic = [Convert]::ToBase64String(
            [Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GIT_TOKEN")
          )
          $proxyArgs = @()
          if ($env:DEPLOY_HTTP_PROXY) {
            $proxyArgs = @("-c", "http.proxy=$env:DEPLOY_HTTP_PROXY")
          }
          $fetched = $false
          foreach ($attempt in 1..4) {
            $gitArgs = @("-c", "http.version=HTTP/1.1") + $proxyArgs + @(
              "-c", "http.extraHeader=AUTHORIZATION: basic $basic", "fetch",
              "https://github.com/abworks-dev/RAGPinCheng.git", $env:DEPLOY_COMMIT_SHA
            )
            & git @gitArgs
            if ($LASTEXITCODE -eq 0) {
              $fetched = $true
              break
            }
            if ($attempt -lt 4) {
              $delay = [math]::Pow(2, $attempt)
              Write-Warning "Bootstrap fetch attempt $attempt/4 failed; retrying in ${delay}s"
              Start-Sleep -Seconds $delay
            }
          }
          if (-not $fetched) { throw "Bootstrap fetch failed after 4 attempts" }
          git merge --ff-only $env:DEPLOY_COMMIT_SHA
          if ($LASTEXITCODE -ne 0) { throw "Bootstrap fast-forward failed" }

          & "${env:REPO_PATH}\scripts\deploy-gpu.ps1" `
            -RepositoryPath $env:REPO_PATH `
            -BackupDirectory $env:BACKUP_DIR `
            -ProxyUrl $env:DEPLOY_HTTP_PROXY `
            -CommitSha $env:DEPLOY_COMMIT_SHA

  # ── Job 2: Ubuntu application node (backend + Qdrant) ───────────────────
  deploy-app:
    if: ${{ needs.deploy-gpu.result == 'success' }}
    needs: [deploy-gpu]
    runs-on:
      - self-hosted
      - linux
      - ubuntu
      - production
      - app
    timeout-minutes: 30

    steps:
      - name: Deploy Ubuntu application node
        env:
          GPU_SERVICE_URL: ${{ vars.GPU_SERVICE_URL }}
          REPO_PATH: /data/workspace/projects/ragpincheng
          BACKUP_DIR: /data/backup/databases/ragpincheng
          DATA_PATH: /data/services/docker/data/ragpincheng/prod/app
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          DEPLOY_HTTP_PROXY: ${{ vars.DEPLOY_HTTP_PROXY }}
        run: |
          set -euo pipefail
          cd "${REPO_PATH}"
          BASIC_AUTH="$(printf 'x-access-token:%s' "${GIT_TOKEN}" | base64 | tr -d '\n')"
          PROXY_ARGS=()
          if [ -n "${DEPLOY_HTTP_PROXY:-}" ]; then
            PROXY_ARGS=(-c "http.proxy=${DEPLOY_HTTP_PROXY}")
          fi
          for ATTEMPT in 1 2 3 4; do
            if git -c http.version=HTTP/1.1 "${PROXY_ARGS[@]}" \
              -c "http.extraHeader=AUTHORIZATION: basic ${BASIC_AUTH}" fetch \
              https://github.com/abworks-dev/RAGPinCheng.git "${DEPLOY_COMMIT_SHA}"; then
              break
            fi
            if [ "${ATTEMPT}" -eq 4 ]; then
              echo "ERROR: bootstrap fetch failed after 4 attempts"
              exit 1
            fi
            DELAY=$((2 ** ATTEMPT))
            echo "Bootstrap fetch attempt ${ATTEMPT}/4 failed; retrying in ${DELAY}s"
            sleep "${DELAY}"
          done
          git merge --ff-only "${DEPLOY_COMMIT_SHA}"
          bash "${REPO_PATH}/scripts/deploy-app.sh"
