# Manual production deployment
name: Deploy production

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: Confirm deployment of origin/master to production
        required: true
        type: boolean
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.confirm_production == true) || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    runs-on:
      - self-hosted
      - windows
      - production
      - gpu
    timeout-minutes: 60

    steps:
      - name: Deploy master on production server
        shell: powershell
        env:
          DEPLOY_HTTP_PROXY: ${{ vars.DEPLOY_HTTP_PROXY }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $parameters = @{
            RepositoryPath = '${PRODUCTION_REPO_PATH}'
            BackupDirectory = '${PRODUCTION_BACKUP_DIRECTORY}'
          }

          if ($env:DEPLOY_HTTP_PROXY) {
            $parameters.ProxyUrl = $env:DEPLOY_HTTP_PROXY
          }

          & '${PRODUCTION_REPO_PATH}\scripts\deploy-production.ps1' @parameters
