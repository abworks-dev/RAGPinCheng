name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: Confirm deployment of the selected commit to production
        required: true
        default: false
        type: boolean
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - master

permissions:
  contents: read

jobs:
  deploy-gpu:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.confirm_production == true) || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && vars.PRODUCTION_AUTO_DEPLOY_ENABLED == 'true') }}
    environment: production-asr
    concurrency:
      group: production-gpu-exclusive
      cancel-in-progress: false
    runs-on: [self-hosted, windows, production, gpu]
    timeout-minutes: 90
    steps:
      - name: Deploy immutable GPU runtime when its fingerprint changed
        shell: powershell
        env:
          DEPLOY_HTTP_PROXY: ${{ vars.DEPLOY_HTTP_PROXY }}
          GPU_MODEL_CACHE_SOURCE: ${{ vars.GPU_MODEL_CACHE_SOURCE }}
          GPU_SERVICE_TOKEN: ${{ secrets.GPU_SERVICE_TOKEN }}
          REPO_PATH: ${{ vars.PRODUCTION_REPO_PATH }}
          BACKUP_DIR: ${{ vars.PRODUCTION_BACKUP_DIRECTORY }}
          RUNTIME_ROOT: ${{ vars.PRODUCTION_RUNTIME_ROOT }}
          GPU_SERVICE_URL: ${{ vars.GPU_SERVICE_URL }}
          GPU_SERVICE_ACTIVITY_URL: ${{ vars.GPU_SERVICE_ACTIVITY_URL }}
          GPU_SERVICE_HOST: ${{ vars.GPU_SERVICE_HOST }}
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          Set-Location $env:REPO_PATH
          $basic = [Convert]::ToBase64String(
            [Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GIT_TOKEN")
          )
          $proxyArgs = @()
          if ($env:DEPLOY_HTTP_PROXY) {
            $proxyArgs = @("-c", "http.proxy=$env:DEPLOY_HTTP_PROXY")
          }
          $fetched = $false
          foreach ($attempt in 1..4) {
            $gitArgs = @("-c", "http.version=HTTP/1.1") + $proxyArgs + @(
              "-c", "http.extraHeader=AUTHORIZATION: basic $basic", "fetch",
              "https://github.com/abworks-dev/RAGPinCheng.git", $env:DEPLOY_COMMIT_SHA
            )
            & git @gitArgs
            if ($LASTEXITCODE -eq 0) { $fetched = $true; break }
            if ($attempt -lt 4) { Start-Sleep -Seconds ([math]::Pow(2, $attempt)) }
          }
          if (-not $fetched) { throw "Bootstrap fetch failed after 4 attempts" }
          git merge --ff-only $env:DEPLOY_COMMIT_SHA
          if ($LASTEXITCODE -ne 0) { throw "Bootstrap fast-forward failed" }

          & "${env:REPO_PATH}\scripts\deploy-gpu.ps1" `
            -RepositoryPath $env:REPO_PATH `
            -BackupDirectory $env:BACKUP_DIR `
            -RuntimeRoot $env:RUNTIME_ROOT `
            -ProxyUrl $env:DEPLOY_HTTP_PROXY `
            -CommitSha $env:DEPLOY_COMMIT_SHA

  deploy-app:
    if: ${{ needs.deploy-gpu.result == 'success' }}
    needs: [deploy-gpu]
    environment: production-asr
    concurrency:
      group: production-app-deployment
      cancel-in-progress: false
    runs-on: [self-hosted, linux, ubuntu, production, app]
    timeout-minutes: 30
    steps:
      - name: Deploy Ubuntu application node
        env:
          GPU_SERVICE_URL: ${{ vars.GPU_SERVICE_URL }}
          REPO_PATH: ${{ vars.PRODUCTION_APP_REPO_PATH }}
          BACKUP_DIR: ${{ vars.PRODUCTION_APP_BACKUP_DIRECTORY }}
          DATA_PATH: ${{ vars.PRODUCTION_APP_DATA_PATH }}
          COMPOSE_OVERRIDE: ${{ vars.PRODUCTION_APP_COMPOSE_OVERRIDE }}
          COMPOSE_ENV_FILE: ${{ vars.PRODUCTION_APP_ENV_FILE }}
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          DEPLOY_HTTP_PROXY: ${{ vars.DEPLOY_HTTP_PROXY }}
        run: |
          set -euo pipefail
          cd "${REPO_PATH}"
          BASIC_AUTH="$(printf 'x-access-token:%s' "${GIT_TOKEN}" | base64 | tr -d '\n')"
          PROXY_ARGS=()
          if [ -n "${DEPLOY_HTTP_PROXY:-}" ]; then
            PROXY_ARGS=(-c "http.proxy=${DEPLOY_HTTP_PROXY}")
          fi
          for ATTEMPT in 1 2 3 4; do
            if git -c http.version=HTTP/1.1 "${PROXY_ARGS[@]}" \
              -c "http.extraHeader=AUTHORIZATION: basic ${BASIC_AUTH}" fetch \
              https://github.com/abworks-dev/RAGPinCheng.git "${DEPLOY_COMMIT_SHA}"; then
              break
            fi
            if [ "${ATTEMPT}" -eq 4 ]; then
              echo "ERROR: bootstrap fetch failed after 4 attempts"
              exit 1
            fi
            DELAY=$((2 ** ATTEMPT))
            sleep "${DELAY}"
          done
          git merge --ff-only "${DEPLOY_COMMIT_SHA}"
          bash "${REPO_PATH}/scripts/deploy-app.sh"

  cleanup-after-deploy:
    if: ${{ needs.deploy-gpu.result == 'success' && needs.deploy-app.result == 'success' }}
    needs: [deploy-gpu, deploy-app]
    uses: ./.github/workflows/cleanup-production.yml
    with:
      target: backups
      apply: true
      confirm_production_cleanup: true
      reason: post-deploy
    secrets: inherit
