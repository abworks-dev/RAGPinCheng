name: Delivery Policy

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request number to validate
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: delivery-policy-${{ github.event.pull_request.number || inputs.pull_request_number }}
  cancel-in-progress: true

jobs:
  delivery-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted default-branch policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Validate pull request delivery policy
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request_number }}
        run: |
          ./scripts/Test-CodexDelivery.ps1 `
            -Repository $env:REPOSITORY `
            -PullRequestNumber ([int]$env:PULL_REQUEST_NUMBER)
