name: Diagnose Transcript Terminology Production

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Full 40-character merged master SHA to inspect"
        required: true
        type: string
      confirm_diagnostic:
        description: "Confirm the read-only transcript terminology diagnostic"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-app-asr-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    if: ${{ inputs.confirm_diagnostic == true }}
    environment: production-asr
    runs-on: [self-hosted, linux, ubuntu, production, app]
    timeout-minutes: 10
    env:
      COMPOSE_OVERRIDE: ${{ vars.PRODUCTION_APP_COMPOSE_OVERRIDE }}
      COMPOSE_ENV_FILE: ${{ vars.PRODUCTION_APP_ENV_FILE }}
      REPO_PATH: ${{ vars.PRODUCTION_APP_REPO_PATH }}
    steps:
      - name: Validate immutable revision and diagnostic gate
        run: |
          if [[ ! "${{ inputs.commit_sha }}" =~ ^[0-9a-fA-F]{40}$ ]]; then echo "commit_sha must be a full SHA"; exit 1; fi
          if [[ "${{ inputs.commit_sha }}" != "${{ github.sha }}" ]]; then echo "commit_sha must equal the dispatch revision"; exit 1; fi
          if [[ "${{ github.ref }}" != "refs/heads/master" ]]; then echo "diagnostic must run from master"; exit 1; fi

      - name: Check out requested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1

      - name: Exercise the deployed terminology cleanup on the reported text
        run: |
          set -euo pipefail
          COMPOSE=(docker compose -p ragpincheng-prod \
            -f "${REPO_PATH}/docker/docker-compose.yml" \
            -f "${COMPOSE_OVERRIDE}" --env-file "${COMPOSE_ENV_FILE}")
          "${COMPOSE[@]}" ps -q backend | grep -q . || { echo "production backend container is not running"; exit 1; }
          "${COMPOSE[@]}" exec -T backend python - <<'PY'
          import json

          from src.transcription.terminology import (
              clean_hallucinated_standard,
              correct_terminology,
          )
          from src.transcription.types import TerminologyCorrectionConfig

          config = TerminologyCorrectionConfig("bim-engineering-v1")


          def cleaned(text: str) -> tuple[str, bool]:
              corrected, _changed = correct_terminology(text, config)
              return clean_hallucinated_standard(corrected)


          def corrected_text(text: str) -> str:
              return correct_terminology(text, config)[0]


          cases = []

          def expect(name: str, actual, expected) -> None:
              cases.append({"case": name, "ok": actual == expected, "actual": actual, "expected": expected})

          # The three filler segments observed in the stair inspection transcript.
          expect("pure filler segment", cleaned("构件碰撞 净高分析 钢结构 焊缝 螺栓"), ("", True))
          expect(
              "filler run merged with real speech",
              cleaned("构件碰撞 净高分析 钢结构 焊缝 螺栓 1毫米的差值"),
              ("1毫米的差值", False),
          )
          expect(
              "misrecognised variant with fabricated code",
              cleaned("建筑抗震设计规范 GB 50011-2014 建筒碰撞 净高分析 复核 焊缝 螺栓"),
              ("", True),
          )
          expect("trailing filler run", cleaned("1毫米的差值 构件碰撞 净高分析 钢结构"), ("1毫米的差值", False))

          # Real sentences and genuine citations must survive untouched.
          keep = "楼梯的净高是否满足规范要求 建筑信息模型用于碰撞检测和施工图审查。"
          expect("real sentence kept", cleaned(keep), (keep, False))

          # Misrecognition corrections observed in the same transcript.
          expect(
              "misrecognitions corrected",
              corrected_text("结枅面标高 梨柱 三围 头面 踢断 楼成平台 题面 检察"),
              "结构面标高 梯柱 三维 剖面 梯段 楼层平台 踏面 检查",
          )
          expect(
              "correct text untouched",
              corrected_text("结构面标高 梯柱 三维 剖面 梯段 楼层平台 踏面 检查"),
              "结构面标高 梯柱 三维 剖面 梯段 楼层平台 踏面 检查",
          )

          failed = [item for item in cases if not item["ok"]]
          print("TERMINOLOGY_DIAGNOSTIC " + json.dumps({
              "schema_version": "transcript-terminology-diagnostic/1",
              "read_only": True,
              "case_count": len(cases),
              "failed_count": len(failed),
              "status": "pass" if not failed else "fail",
              "cases": cases,
          }, ensure_ascii=False, sort_keys=True))
          PY

      - name: Publish sanitized summary
        if: ${{ always() }}
        run: |
          echo "Read-only transcript terminology check; see the job log line prefixed TERMINOLOGY_DIAGNOSTIC." >> "$GITHUB_STEP_SUMMARY"
