name: Inspect Leftover Production Media

on:
  workflow_dispatch:
    inputs:
      confirm_inspection:
        description: Select INSPECT_LEFT_OVER_MEDIA to inventory leftover media records (read-only)
        required: true
        default: CANCEL
        type: choice
        options:
          - CANCEL
          - INSPECT_LEFT_OVER_MEDIA
      expected_commit:
        description: Full master commit containing the inspection tooling
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-leftover-media-inspection
  cancel-in-progress: false

jobs:
  inspect:
    if: ${{ inputs.confirm_inspection == 'INSPECT_LEFT_OVER_MEDIA' }}
    environment: production-asr
    runs-on: [self-hosted, linux, ubuntu, production, app]
    timeout-minutes: 30
    env:
      REPO_PATH: ${{ vars.PRODUCTION_APP_REPO_PATH }}
      DATA_PATH: ${{ vars.PRODUCTION_APP_DATA_PATH }}
      BACKUP_ROOT: ${{ vars.PRODUCTION_APP_BACKUP_DIRECTORY }}
      CONTENT_ROOT: ${{ vars.PRODUCTION_CONTENT_ROOT }}
      COMPOSE_OVERRIDE: ${{ vars.PRODUCTION_APP_COMPOSE_OVERRIDE }}
      COMPOSE_ENV_FILE: ${{ vars.PRODUCTION_APP_ENV_FILE }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
    steps:
      - name: Inventory leftover media records without mutation
        shell: bash
        run: |
          set -euo pipefail

          [ "${GITHUB_REF}" = "refs/heads/master" ]
          [[ "${EXPECTED_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
          [ "${REPO_PATH}" = "/data/workspace/projects/ragpincheng" ]
          [ "${DATA_PATH}" = "/data/services/docker/data/ragpincheng/prod/app" ]
          [ "${BACKUP_ROOT}" = "/data/backup/databases/ragpincheng" ]
          [ "${CONTENT_ROOT}" = "/data/business/ragpincheng/content" ]
          [ "${COMPOSE_OVERRIDE}" = "/data/services/docker/compose/ragpincheng/prod/compose.prod.yaml" ]
          [ "${COMPOSE_ENV_FILE}" = "/data/secrets/ragpincheng/prod.env" ]
          for path in "${REPO_PATH}" "${DATA_PATH}" "${BACKUP_ROOT}" "${CONTENT_ROOT}"; do
            [ -d "${path}" ] && [ ! -L "${path}" ] || {
              echo "ERROR: required path is not a real directory: ${path}"
              exit 1
            }
          done
          [ -f "${COMPOSE_ENV_FILE}" ] && [ ! -L "${COMPOSE_ENV_FILE}" ]
          [ "$(git -C "${REPO_PATH}" branch --show-current)" = "master" ]
          [ -z "$(git -C "${REPO_PATH}" status --porcelain --untracked-files=no)" ]
          git -C "${REPO_PATH}" fetch --no-tags origin master
          [ "$(git -C "${REPO_PATH}" rev-parse origin/master)" = "${EXPECTED_COMMIT}" ]
          [ "$(git -C "${REPO_PATH}" rev-parse HEAD)" = "${EXPECTED_COMMIT}" ]
          [ -f "${REPO_PATH}/scripts/cleanup_leftover_media.py" ] && [ ! -L "${REPO_PATH}/scripts/cleanup_leftover_media.py" ]

          RUN_ID="leftover-media-inspect-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          RUN_ROOT="${BACKUP_ROOT}/${RUN_ID}"
          REPORT_ROOT="${RUNNER_TEMP}/leftover-media-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-summary"
          [ ! -e "${RUN_ROOT}" ]
          mkdir -m 700 "${RUN_ROOT}" "${REPORT_ROOT}"
          COMPOSE=(docker compose -p ragpincheng-prod \
            -f "${REPO_PATH}/docker/docker-compose.yml" \
            -f "${COMPOSE_OVERRIDE}" --env-file "${COMPOSE_ENV_FILE}")

          "${COMPOSE[@]}" cp "${REPO_PATH}/scripts/cleanup_leftover_media.py" \
            backend:/tmp/cleanup_leftover_media.py
          "${COMPOSE[@]}" exec -T -e PYTHONPATH=/app backend python /tmp/cleanup_leftover_media.py \
            --database /app/data/app.sqlite \
            --parents-database /app/data/parents.sqlite \
            --media-root /app/media \
            --mode inventory \
            --with-qdrant \
            --detail-output /app/data/leftover-media-inventory.json \
            > "${RUN_ROOT}/inventory-summary.json"
          "${COMPOSE[@]}" exec -T backend sh -c 'cat /app/data/leftover-media-inventory.json' \
            > "${RUN_ROOT}/inventory-detail.json"

          # Annotate host-visible media directories (content root + legacy
          # source media) that the container cannot see, for operator review.
          DETAIL="${RUN_ROOT}/inventory-detail.json" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          detail_path = Path(os.environ["DETAIL"])
          items = json.loads(detail_path.read_text(encoding="utf-8"))
          roots = [
              Path("/data/business/ragpincheng/content/media"),
              Path("/data/business/ragpincheng/source/media"),
          ]
          for item in items:
              present = []
              for root in roots:
                  candidate = root / item["media_id"]
                  if candidate.is_dir():
                      total = 0
                      for entry in candidate.rglob("*"):
                          if entry.is_file():
                              try:
                                  total += entry.stat().st_size
                              except OSError:
                                  pass
                      present.append({"root": str(root), "bytes": total})
              item["host_media_dirs"] = present
          detail_path.write_text(
              json.dumps(items, ensure_ascii=False, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          RUN_ROOT="${RUN_ROOT}" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUN_ROOT"])
          items = json.loads((root / "inventory-detail.json").read_text(encoding="utf-8"))
          summary = json.loads((root / "inventory-summary.json").read_text(encoding="utf-8"))
          print("LEFTOVER_MEDIA_INVENTORY count=%s manifest_sha256=%s" % (
              summary["candidate_count"], summary["manifest_sha256"]))
          for item in items:
              print("ITEM media_id=%s title=%r status=%s jobs=%s versions=%s "
                    "parents=%s qdrant=%s media_dirs=%s delete_blocked=%s" % (
                  item["media_id"], item["title"], item["status"],
                  item["job_count"], item["version_count"],
                  item["parents_count"], item["qdrant_points"],
                  len(item.get("host_media_dirs", [])),
                  "no" if (
                      item["active_job_count"] == 0 and not item["has_head"]
                      and item["parents_count"] == 0
                      and (item["qdrant_points"] in (0, None))
                  ) else "yes"))
          (root / "inventory-aggregate.json").write_text(
              json.dumps(summary, ensure_ascii=False, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          cp "${RUN_ROOT}/inventory-aggregate.json" "${REPORT_ROOT}/summary.json"
          chmod -R go-rwx "${RUN_ROOT}"

      - name: Upload redacted inspection summary
        uses: actions/upload-artifact@v4
        with:
          name: leftover-media-inspect-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/leftover-media-${{ github.run_id }}-${{ github.run_attempt }}-summary
          if-no-files-found: error
          retention-days: 30