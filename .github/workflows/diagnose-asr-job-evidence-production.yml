name: Diagnose ASR Job Evidence Production

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Full 40-character merged master SHA to inspect"
        required: true
        type: string
      confirm_diagnostic:
        description: "Confirm read-only ASR job outcome diagnostic"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-gpu-exclusive
  cancel-in-progress: false

jobs:
  diagnose:
    if: ${{ inputs.confirm_diagnostic == true }}
    environment: production-asr
    runs-on: [self-hosted, Windows, X64, asr-production]
    timeout-minutes: 10
    env:
      PRODUCTION_ASR_PROGRAM_ROOT: ${{ vars.PRODUCTION_ASR_PROGRAM_ROOT }}
      PRODUCTION_ASR_DATA_ROOT: ${{ vars.PRODUCTION_ASR_DATA_ROOT }}
    steps:
      - name: Validate immutable revision and diagnostic gate
        shell: powershell
        run: |
          if ("${{ inputs.commit_sha }}" -notmatch '^[0-9a-fA-F]{40}$') { throw "commit_sha must be a full SHA" }
          if ("${{ inputs.commit_sha }}".ToLowerInvariant() -ne "${{ github.sha }}".ToLowerInvariant()) { throw "commit_sha must equal the dispatch revision" }
          if ("${{ github.ref }}" -ne "refs/heads/master") { throw "ASR job diagnostics must run from master" }
          if (-not [Convert]::ToBoolean("${{ inputs.confirm_diagnostic }}")) { throw "confirm_diagnostic must be enabled" }
      - name: Check out requested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1
      - name: Collect read-only ASR job evidence
        shell: powershell
        run: |
          $report = Join-Path $env:RUNNER_TEMP "asr-job-diagnostic-${{ github.run_id }}.json"
          & "${{ github.workspace }}\scripts\diagnose-asr-job-evidence-production.ps1" `
            -CommitSha "${{ inputs.commit_sha }}" `
            -ReportPath $report `
            -SourceRoot "${{ github.workspace }}"
      - name: Publish sanitized summary
        if: ${{ always() }}
        shell: powershell
        run: |
          $path = Join-Path $env:RUNNER_TEMP "asr-job-diagnostic-${{ github.run_id }}.json"
          if (Test-Path -LiteralPath $path -PathType Leaf) {
            $result = Get-Content -LiteralPath $path -Raw -Encoding UTF8 | ConvertFrom-Json
            $lines = @(
              "## ASR job evidence",
              "",
              "- Active candidate: ``$($result.active_candidate_id)``",
              "- Spool present: ``$($result.spool_present)``",
              "- Jobs reported: ``$($result.job_count)``",
              ""
            )
            foreach ($job in @($result.jobs)) {
              $lines += "- ``$($job.state)`` / failure ``$($job.failure_code)`` / result ``$($job.result_error_code)`` ($($job.result_classification)) / profile ``$($job.service_profile_id)`` / processed ``$($job.processed_ms)`` of ``$($job.total_ms)`` ms / input ``$($job.input_duration_ms)`` ms"
            }
            $lines -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding UTF8
          } else {
            "ASR job diagnostic ended before sanitized evidence was written; nothing was modified." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding UTF8
          }
      - name: Upload sanitized diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: asr-job-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/asr-job-diagnostic-${{ github.run_id }}.json
          if-no-files-found: warn
          retention-days: 30
