name: Qualify qwen3-asr Production

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Full 40-character merged master SHA to qualify"
        required: true
        type: string
      execute_qualification:
        description: "Install isolated dependencies, prepare both pinned models, and run real CUDA BF16 qualification"
        required: true
        default: false
        type: boolean
      manifest_preflight:
        description: "Read and validate only the shared qualification manifest and WAV identities"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-asr-qwen3-asr-qualification
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate immutable revision and exclusive execution mode
        shell: bash
        run: |
          if [[ ! "${{ inputs.commit_sha }}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "commit_sha must be a full 40-character SHA" >&2
            exit 1
          fi
          if [[ "${{ inputs.commit_sha }}" != "${{ github.sha }}" ]]; then
            echo "commit_sha must equal the workflow dispatch revision" >&2
            exit 1
          fi
          if [[ "${{ github.ref }}" != "refs/heads/master" ]]; then
            echo "qualification must be dispatched from master" >&2
            exit 1
          fi
          if [[ "${{ inputs.execute_qualification }}" == "${{ inputs.manifest_preflight }}" ]]; then
            echo "enable exactly one of execute_qualification or manifest_preflight" >&2
            exit 1
          fi

  manifest-preflight:
    needs: gate
    if: ${{ inputs.manifest_preflight }}
    environment: production-asr
    runs-on: [self-hosted, Windows, X64, asr-production]
    timeout-minutes: 10
    env:
      PRODUCTION_PYTHON311_PATH: ${{ vars.PRODUCTION_PYTHON311_PATH }}
      PRODUCTION_ASR_QUALIFICATION_ROOT: ${{ vars.PRODUCTION_ASR_QUALIFICATION_ROOT }}
      PRODUCTION_ASR_QUALIFICATION_MANIFEST_PATH: ${{ vars.PRODUCTION_ASR_QUALIFICATION_MANIFEST_PATH }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1

      - name: Validate shared corpus identity read-only
        shell: powershell
        run: |
          $python = $env:PRODUCTION_PYTHON311_PATH
          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) {
            throw "Machine-wide Python 3.11 is missing"
          }
          $json = @(& $python "${{ github.workspace }}\scripts\asr_qualification_manifest.py" --engine qwen3-asr)
          if ($LASTEXITCODE -ne 0 -or $json.Count -ne 1) {
            throw "Shared corpus preflight failed"
          }
          $identity = ([string]$json[0]) | ConvertFrom-Json
          [System.IO.File]::WriteAllText(
            "${{ runner.temp }}\qwen3-asr-manifest-preflight-${{ github.run_id }}.json",
            ([string]$json[0]) + "`n",
            (New-Object System.Text.UTF8Encoding($false))
          )
          @(
            "## qwen3-asr manifest preflight",
            "",
            "- Source: ``$($identity.manifest_source)``",
            "- Manifest SHA-256: ``$($identity.manifest_sha256)``",
            "- Sample set: ``$($identity.sample_set_id)``",
            "- Annotation version: ``$($identity.annotation_version)``",
            "- Samples: ``$($identity.sample_count)``"
          ) -join "`n" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding UTF8

      - name: Upload sanitized corpus identity
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-asr-manifest-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}\qwen3-asr-manifest-preflight-${{ github.run_id }}.json
          if-no-files-found: error
          retention-days: 14

  build-internal-wheel:
    needs: gate
    if: ${{ inputs.execute_qualification }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate immutable revision and explicit R3 gate
        shell: bash
        run: |
          if [[ ! "${{ inputs.commit_sha }}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "commit_sha must be a full 40-character SHA" >&2
            exit 1
          fi
          if [[ "${{ inputs.commit_sha }}" != "${{ github.sha }}" ]]; then
            echo "commit_sha must equal the workflow dispatch revision" >&2
            exit 1
          fi
          if [[ "${{ github.ref }}" != "refs/heads/master" ]]; then
            echo "qualification must be dispatched from master" >&2
            exit 1
          fi
          if [[ "${{ inputs.execute_qualification }}" != "true" ]]; then
            echo "execute_qualification must be explicitly enabled" >&2
            exit 1
          fi

      - name: Check out requested merged revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1

      - name: Set up fixed wheel build Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build reproducible controlled Chinese-only Qwen wheel
        shell: bash
        run: |
          root="${{ runner.temp }}/qwen3-asr-controlled-wheel-${{ github.run_id }}"
          python scripts/build_controlled_qwen3_asr_wheel.py build \
            --bundle-dir "$root" \
            --commit-sha "${{ inputs.commit_sha }}" \
            --run-id "${{ github.run_id }}"

      - name: Upload controlled Chinese-only Qwen wheel
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-asr-controlled-wheel-${{ github.run_id }}
          path: ${{ runner.temp }}/qwen3-asr-controlled-wheel-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14

  qualify:
    needs: build-internal-wheel
    environment: production-asr
    runs-on: [self-hosted, Windows, X64, asr-production]
    timeout-minutes: 180
    env:
      PRODUCTION_PYTHON311_PATH: ${{ vars.PRODUCTION_PYTHON311_PATH }}
      PRODUCTION_PYTHON_PATH: ${{ vars.PRODUCTION_PYTHON_PATH }}
      PRODUCTION_ASR_DATA_ROOT: ${{ vars.PRODUCTION_ASR_DATA_ROOT }}
      PRODUCTION_NO_PROXY: ${{ vars.PRODUCTION_NO_PROXY }}
      PRODUCTION_ASR_QUALIFICATION_ROOT: ${{ vars.PRODUCTION_ASR_QUALIFICATION_ROOT }}
      PRODUCTION_ASR_QUALIFICATION_MANIFEST_PATH: ${{ vars.PRODUCTION_ASR_QUALIFICATION_MANIFEST_PATH }}
      PRODUCTION_QWEN3_ASR_QUALIFICATION_ROOT: ${{ vars.PRODUCTION_QWEN3_ASR_QUALIFICATION_ROOT }}
      GPU_SERVICE_URL: ${{ vars.GPU_SERVICE_URL }}
      GPU_SERVICE_ACTIVITY_URL: ${{ vars.GPU_SERVICE_ACTIVITY_URL }}
    steps:
      - name: Validate immutable revision and explicit R3 gate
        shell: powershell
        run: |
          if ("${{ inputs.commit_sha }}" -notmatch '^[0-9a-fA-F]{40}$') {
            throw "commit_sha must be a full 40-character SHA"
          }
          if ("${{ inputs.commit_sha }}".ToLowerInvariant() -ne "${{ github.sha }}".ToLowerInvariant()) {
            throw "commit_sha must equal the workflow dispatch revision"
          }
          if ("${{ github.ref }}" -ne "refs/heads/master") {
            throw "qualification must be dispatched from master"
          }
          if (-not [System.Convert]::ToBoolean("${{ inputs.execute_qualification }}")) {
            throw "execute_qualification must be explicitly enabled"
          }

      - name: Check out requested merged revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1

      - name: Download controlled Chinese-only Qwen wheel
        uses: actions/download-artifact@v4
        with:
          name: qwen3-asr-controlled-wheel-${{ github.run_id }}
          path: ${{ runner.temp }}\qwen3-asr-controlled-wheel-${{ github.run_id }}

      - name: Run isolated qwen3-asr R3 qualification
        shell: powershell
        env:
          ASR_DEPENDENCY_PROXY: ${{ secrets.ASR_DEPENDENCY_PROXY }}
          ASR_MODEL_DOWNLOAD_PROXY: ${{ secrets.ASR_MODEL_DOWNLOAD_PROXY }}
          GPU_SERVICE_TOKEN: ${{ secrets.GPU_SERVICE_TOKEN }}
        run: |
          $params = @{
            CommitSha = "${{ inputs.commit_sha }}"
            SourceRoot = "${{ github.workspace }}"
            RunId = "${{ github.run_id }}"
            ExecuteQualification = [System.Convert]::ToBoolean("${{ inputs.execute_qualification }}")
            QwenWheelBundlePath = "${{ runner.temp }}\qwen3-asr-controlled-wheel-${{ github.run_id }}"
            SummaryPath = "${{ runner.temp }}\qwen3-asr-r3-${{ github.run_id }}\qualification-verdict.json"
            DependencyDiagnosticPath = "${{ runner.temp }}\qwen3-asr-r3-${{ github.run_id }}\dependency-diagnostic.json"
            LicenseMatrixPath = "${{ runner.temp }}\qwen3-asr-r3-${{ github.run_id }}\license-matrix.json"
            ModelPreparationDiagnosticPath = "${{ runner.temp }}\qwen3-asr-r3-${{ github.run_id }}\model-preparation-diagnostic.json"
            PerformanceDiagnosticPath = "${{ runner.temp }}\qwen3-asr-r3-${{ github.run_id }}\performance-diagnostic.json"
          }
          & "${{ github.workspace }}\scripts\qualify-qwen3-asr-production.ps1" @params

      - name: Publish sanitized qualification summary
        if: ${{ always() }}
        shell: powershell
        run: |
          $path = "${{ runner.temp }}\qwen3-asr-r3-${{ github.run_id }}\qualification-verdict.json"
          if (Test-Path -LiteralPath $path -PathType Leaf) {
            $summary = Get-Content -LiteralPath $path -Raw -Encoding UTF8 | ConvertFrom-Json
            $lines = @(
              "## qwen3-asr R3 qualification",
              "",
              "- Status: ``$($summary.status)``",
              "- Failure code: ``$($summary.failure_code)``",
              "- Commit: ``$($summary.commit_sha)``",
              "- ASR revision: ``$($summary.asr_model_revision)``",
              "- Aligner revision: ``$($summary.aligner_model_revision)``",
              "- Candidate: ``$($summary.candidate_id)``",
              "- Baseline GPU memory: ``$($summary.baseline_gpu_memory_mib) MiB``",
              "- Peak GPU memory: ``$($summary.peak_gpu_memory_mib) MiB``",
              "- Profile admission: ``$($summary.profile_admission)``",
              "- Production services modified: ``$($summary.production_services_modified)``"
            )
            $diagnosticPath = "${{ runner.temp }}\qwen3-asr-r3-${{ github.run_id }}\dependency-diagnostic.json"
            if (Test-Path -LiteralPath $diagnosticPath -PathType Leaf) {
              $diagnostic = Get-Content -LiteralPath $diagnosticPath -Raw -Encoding UTF8 | ConvertFrom-Json
              $lines += @(
                "- Dependency stage: ``$($diagnostic.dependency_stage)``",
                "- Dependency diagnosis: ``$($diagnostic.diagnosis_kind)``",
                "- Affected requirement: ``$($diagnostic.affected_requirement)``",
                "- Audit phase: ``$($diagnostic.audit_phase)``",
                "- Exception type: ``$($diagnostic.exception_type)``"
              )
            }
            $performancePath = "${{ runner.temp }}\qwen3-asr-r3-${{ github.run_id }}\performance-diagnostic.json"
            if (Test-Path -LiteralPath $performancePath -PathType Leaf) {
              $performance = Get-Content -LiteralPath $performancePath -Raw -Encoding UTF8 | ConvertFrom-Json
              $lines += @(
                "- Engine calls: ``$($performance.engine_call_count)``",
                "- Engine elapsed mean: ``$($performance.engine_elapsed_ms.mean) ms``",
                "- Engine elapsed p95: ``$($performance.engine_elapsed_ms.p95) ms``",
                "- End-to-end RTF mean: ``$($performance.end_to_end_rtf.mean)``",
                "- End-to-end RTF p95: ``$($performance.end_to_end_rtf.p95)``"
              )
            }
            $lines -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding UTF8
          } else {
            "Qualification ended before a sanitized verdict could be written." |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding UTF8
          }

      - name: Upload sanitized verdict
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-asr-r3-verdict-${{ github.run_id }}
          path: |
            ${{ runner.temp }}\qwen3-asr-r3-${{ github.run_id }}\qualification-verdict.json
            ${{ runner.temp }}\qwen3-asr-r3-${{ github.run_id }}\dependency-diagnostic.json
            ${{ runner.temp }}\qwen3-asr-r3-${{ github.run_id }}\license-matrix.json
            ${{ runner.temp }}\qwen3-asr-r3-${{ github.run_id }}\model-preparation-diagnostic.json
            ${{ runner.temp }}\qwen3-asr-r3-${{ github.run_id }}\performance-diagnostic.json
          if-no-files-found: warn
          retention-days: 14
