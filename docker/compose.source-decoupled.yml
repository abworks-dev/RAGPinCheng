services:
  backend:
    # Replace every base/private backend mount so an older Compose merge
    # implementation cannot retain the retired /app/docs bind by target.
    volumes: !override
      - ${DATA_PATH:?DATA_PATH is required}:/app/data
      - ${CONTENT_HOST_PATH:?CONTENT_HOST_PATH is required}:/app/content
      # Production strict mode no longer accepts filesystem documents. Keep the
      # legacy runtime path as an empty, read-only tmpfs so old fallback code
      # cannot write files and no host compatibility directory is required.
      - type: tmpfs
        target: /app/docs
        read_only: true
        tmpfs:
          size: 1048576
          mode: 0555
      - ${MEDIA_HOST_PATH:?MEDIA_HOST_PATH is required}:/app/media

# Production owns this network independently of the backend container. Mark it
# external so a backend-only recreate cannot remove Qdrant or LibreOffice
# endpoints from the shared network.
networks:
  default:
    name: ragpincheng-prod_default
    external: true
