services:
  backend:
    # Compose merges env_file sequences from the base and private files. Replace
    # the repository-relative development entry so production never probes
    # ${REPO_PATH}/.env when the managed env file is mounted elsewhere.
    env_file: !override
      - ${COMPOSE_ENV_FILE:?COMPOSE_ENV_FILE is required}
    # Replace every base/private backend mount so an older Compose merge
    # implementation cannot retain the retired /app/docs bind by target.
    volumes: !override
      - ${DATA_PATH:?DATA_PATH is required}:/app/data
      - ${CONTENT_HOST_PATH:?CONTENT_HOST_PATH is required}:/app/content
      - ${MEDIA_HOST_PATH:?MEDIA_HOST_PATH is required}:/app/media
    # Use the service-level form for compatibility with the production Compose
    # runtime. The volume override above removes every legacy /app/docs bind.
    tmpfs:
      - /app/docs:ro,size=1048576,mode=0555

# Production owns this network independently of the backend container. Mark it
# external so a backend-only recreate cannot remove Qdrant or LibreOffice
# endpoints from the shared network.
networks:
  default:
    name: ragpincheng-prod_default
    external: true
