# 品丞 RAG 系统生产环境 Compose 配置（Ubuntu 应用节点）
#
# 三个服务：qdrant（向量数据库）、backend（FastAPI + React 打包成单一镜像）
# 和 libreoffice（Office 文档转换服务）。
# backend 同时提供 /api/* 接口和 React 前端页面，无需单独的前端容器或 nginx 反代。
#
# GPU 推理（BGE-M3 embedding + BGE-reranker）运行在独立的 Windows GPU 服务上，
# 通过内网 HTTP 访问。backend 通过 EMBED_PROVIDER=remote / RERANK_PROVIDER=remote
# 配置切换到远程 GPU 服务。
#
# 所有命令在仓库根目录执行：
#   docker compose -f docker/docker-compose.yml build
#   docker compose -f docker/docker-compose.yml up -d
#   docker compose -f docker/docker-compose.yml logs -f backend
#   docker compose -f docker/docker-compose.yml exec backend python scripts/build_index.py
#   docker compose -f docker/docker-compose.yml down
#
# 环境变量配置：仓库根目录的 `.env` 是唯一配置源。`docker/.env` 是软链接指向它，
# 这样 compose 构建时的变量替换（如 ${BUILD_PLATFORM}）和容器运行时的 env_file:
# 都能正常工作。必填配置项：ZHIPU_API_KEY, MINERU_API_KEY, ADMIN_EMPLOYEE_ID,
# ADMIN_PASSWORD；GPU 服务：GPU_SERVICE_URL, GPU_SERVICE_TOKEN

services:
  qdrant:
    # 固定补丁版本，避免 `latest` 在普通部署时静默升级存储引擎。
    # 升级前先创建 Qdrant 快照，并在测试环境验证索引兼容性。
    image: qdrant/qdrant:v1.18.3
    restart: unless-stopped
    volumes:
      # Qdrant 索引持久化存储。与 data 目录分开管理，保证 Qdrant 完全拥有自己的
      # 磁盘格式，可以独立升级。执行 `docker compose down` 不会删除此 volume，
      # 只有加 `-v` 才会删除。
      - qdrant_storage:/qdrant/storage
    # 不暴露端口 — 只有 backend 会通过 compose 内网访问 Qdrant。
    # 如需调试面板，取消 ports: 注释，通过 :6333 访问 Qdrant Dashboard：
    # ports:
    #   - "6333:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
      # 目标架构参数化 — 仅用于 Apple Silicon Mac 交叉编译（arm64 → amd64）
      # 到生产服务器。在原生 x86_64 服务器上请保持禁用，因为它会破坏 Docker 层缓存：
      # buildx 的 platforms 匹配会增加额外约束条件，即使文件没变化也经常导致
      # torch 安装层（约 2GB）缓存失效。如需在 Mac 上构建，取消下面两行注释。
      # platforms:
      #   - ${BUILD_PLATFORM:-linux/amd64}
    image: pincheng-rag-backend:latest
    restart: unless-stopped
    # No GPU reservation — embedding and reranking run on the separate Windows
    # GPU inference service (gpu_service/) accessed via HTTP.
    depends_on:
      qdrant:
        condition: service_healthy
    env_file:
      # 把仓库根目录 .env 的所有变量注入容器，不需要在 environment: 逐一列出。
      # .env 中缺失的变量会使用 src/config.py 和 api/auth.py 中的默认值。
      - ../.env
    environment:
      # 容器内 Qdrant 地址 — backend 通过 compose 服务名直接访问。
      # 这里强制写死，不使用 ${QDRANT_URL}，防止主机本地调试用的
      # http://localhost:6333 泄漏到容器内，导致无法连接 qdrant 服务。
      QDRANT_URL: http://qdrant:6333
      # GPU 推理服务地址 — 生产环境指向 Windows GPU 主机内网地址。
      # 生产 GPU 地址仅从私有 .env 注入；示例默认仅用于本机开发。
      GPU_SERVICE_URL: ${GPU_SERVICE_URL:-http://127.0.0.1:8100}
      GPU_SERVICE_TOKEN: ${GPU_SERVICE_TOKEN:-}
      EMBED_PROVIDER: ${EMBED_PROVIDER:-remote}
      RERANK_PROVIDER: ${RERANK_PROVIDER:-remote}
      # --env-file selects the production interpolation source, while env_file above
      # remains the local repository file. Keep every ASR client setting explicit so
      # production does not silently fall back to src/config.py defaults.
      ASR_ENABLED: ${ASR_ENABLED:-false}
      ASR_SERVICE_URL: ${ASR_SERVICE_URL:-http://127.0.0.1:8200}
      ASR_SERVICE_TOKEN: ${ASR_SERVICE_TOKEN:-}
      ASR_CONNECT_TIMEOUT_SECONDS: ${ASR_CONNECT_TIMEOUT_SECONDS:-10}
      ASR_REQUEST_TIMEOUT_SECONDS: ${ASR_REQUEST_TIMEOUT_SECONDS:-60}
      ASR_JOB_TIMEOUT_SECONDS: ${ASR_JOB_TIMEOUT_SECONDS:-7200}
      ASR_POLL_INTERVAL_MS: ${ASR_POLL_INTERVAL_MS:-1000}
      ASR_UPLOAD_PART_BYTES: ${ASR_UPLOAD_PART_BYTES:-8388608}
      ASR_EXPECTED_API_VERSION: ${ASR_EXPECTED_API_VERSION:-asr-service/1}
      ASR_FFMPEG_PATH: ${ASR_FFMPEG_PATH:-ffmpeg}
      ASR_MEDIA_PREP_TIMEOUT_SECONDS: ${ASR_MEDIA_PREP_TIMEOUT_SECONDS:-1800}
      # Business admission is application-owned and does not alter ASR runtime identity.
      TRANSCRIPTION_ADMITTED_PROFILE_IDS: ${TRANSCRIPTION_ADMITTED_PROFILE_IDS:-funasr-sensevoice-zh-experimental-v1}
      # LibreOffice 转换服务地址 — 在同一 Docker 网络内，通过服务名访问。
      LIBREOFFICE_URL: ${LIBREOFFICE_URL:-http://libreoffice:8101}
      CONTENT_ROOT: /app/content
      DOCS_DIR: /app/docs
      MEDIA_DIR: /app/media
      TRANSCRIPTION_ARTIFACT_DIR: ${TRANSCRIPTION_ARTIFACT_DIR:-/app/data/transcription-artifacts}
      CONTENT_MANAGEMENT_ENABLED: ${CONTENT_MANAGEMENT_ENABLED:-false}
      CONTENT_HEAD_ENFORCEMENT: ${CONTENT_HEAD_ENFORCEMENT:-compat}
    volumes:
      # 持久化状态 — Markdown 解析缓存、parents.sqlite（向量索引元数据）、
      # app.sqlite（用户 + 对话）、feedback.jsonl。数据存在主机磁盘上，
      # 镜像保持无状态。Qdrant 有自己的独立 volume（见上方）。
      - ../data:/app/data
      # 视频媒体文件 — 上传的 MP4 保存在这里，通过鉴权路由访问。
      - ${MEDIA_HOST_PATH:-../media}:/app/media
      # 受管资料库。生产通过 CONTENT_HOST_PATH 固定宿主机目录；本地默认仍在仓库旁。
      - ${CONTENT_HOST_PATH:-../content}:/app/content
      # 源 PDF 文档 — 只在容器内执行 scripts/build_index.py 时需要。
      # 读写挂载，MinerU 拆分后的 PDF 可以写回原目录。
      - ${DOCS_HOST_PATH:-../content/legacy-docs}:/app/docs
    ports:
      # 对外暴露入口。主机 80 端口映射到容器 uvicorn 8000 端口 —
      # 与旧 nginx 方案 URL 一致，减少一跳。生产环境建议在前面加公司
      # 反向代理 / TLS 终端做 HTTPS。
      - "80:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      # 没有 GPU 模型需要下载，启动很快。设为 30s 以覆盖首次 pip install。
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  libreoffice:
    image: pincheng-libreoffice:latest
    build:
      context: ../libreoffice
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - libreoffice_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8101/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  qdrant_storage:
    # Qdrant 索引持久化。执行 docker compose down 不会删除；
    # 只有 docker compose down -v 才会删除。如需查看索引内容，请 exec
    # 进入 qdrant 容器 — 容器运行时不要从主机直接操作这些文件。
  libreoffice_data:
    # LibreOffice 转换临时数据。执行 docker compose down 不会删除；
    # 只有 docker compose down -v 才会删除。

# -----------------------------------------------------------------------------
# 构建速查手册
# -----------------------------------------------------------------------------
# 为生产服务器构建（默认，x86_64）：
#     docker compose -f docker/docker-compose.yml build
#
# 在 Apple Silicon Mac 上原生构建快速本地测试：
#     BUILD_PLATFORM=linux/arm64 docker compose -f docker/docker-compose.yml build
#
# 让某台机器永久使用这个配置 — 加到 .env：
#     BUILD_PLATFORM=linux/arm64
